d multiple times has no side effects, like Delta Lake) or support atomic transactions.</li>\n</ol>", "raw_answer": "Exactly-once requires coordination across three components:\n\n1. **Replayable Source**: The data source must support seeking back to specific offsets (e.g., Apache Kafka, AWS Kinesis).\n2. **Deterministic Engine (Write-Ahead Logs & Checkpoint Directory)**:\n   - Spark records stream offset positions and state updates to a durable **checkpoint directory** before processing.\n   - If an executor or driver crashes, Spark resumes from the exact offset recorded in the checkpoint log.\n3. **Idempotent or Transactional Sink**: The destination must either be idempotent (writing same record multiple times has no side effects, like Delta Lake) or support atomic transactions."}, {"id": 65, "question": "What are Trigger intervals in Structured Streaming?", "difficulty": "Intermediate", "category": "Streaming & Event Processing", "answer_html": "<p class=\"prose-p\">Triggers define the timing of streaming data processing:</p>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\"># 1. Unspecified: Runs micro-batch as fast as previous batch finishes\nquery = df.writeStream.start()\n\n# 2. Fixed interval micro-batches: Executes every 30 seconds\nquery = df.writeStream.trigger(processingTime=&quot;30 seconds&quot;).start()\n\n# 3. Once trigger (Spark 2.x) / AvailableNow (Spark 3.x+):\n# Processes all pending data like a batch job, then terminates cleanly (cost saving for daily cron)\nquery = df.writeStream.trigger(availableNow=True).start()\n\n# 4. Continuous Processing (Experimental): Millisecond low-latency\nquery = df.writeStream.trigger(continuous=&quot;1 second&quot;).start()</code></pre></div>", "raw_answer": "Triggers define the timing of streaming data processing:\n\n```python\n# 1. Unspecified: Runs micro-batch as fast as previous batch finishes\nquery = df.writeStream.start()\n\n# 2. Fixed interval micro-batches: Executes every 30 seconds\nquery = df.writeStream.trigger(processingTime=\"30 seconds\").start()\n\n# 3. Once trigger (Spark 2.x) / AvailableNow (Spark 3.x+):\n# Processes all pending data like a batch job, then terminates cleanly (cost saving for daily cron)\nquery = df.writeStream.trigger(availableNow=True).start()\n\n# 4. Continuous Processing (Experimental): Millisecond low-latency\nquery = df.writeStream.trigger(continuous=\"1 second\").start()\n```"}, {"id": 66, "question": "What is the difference between Stateful and Stateless Streaming?", "difficulty": "Advanced", "category": "Streaming & Event Processing", "answer_html": "<ul class=\"bullet-list\">\n<li><strong>Stateless Streaming</strong>:</li>\n<li>Each micro-batch is processed independently without remembering prior records.</li>\n<li>Examples: Simple transformations, <code class=\"inline-code\">filter()</code>, <code class=\"inline-code\">select()</code>, mapping to JSON, writing to sinks.</li>\n<li>Requires minimal memory and no watermarking.</li>\n<li><strong>Stateful Streaming</strong>:</li>\n<li>Requires maintaining historical data across micro-batches.</li>\n<li>Examples: Windowed aggregations, deduplication (<code class=\"inline-code\">dropDuplicates()</code>), stream-stream joins.</li>\n<li>Requires RocksDB or HDFS state store backing and explicit watermarks.</li>\n</ul>", "raw_answer": "- **Stateless Streaming**:\n  - Each micro-batch is processed independently without remembering prior records.\n  - Examples: Simple transformations, `filter()`, `select()`, mapping to JSON, writing to sinks.\n  - Requires minimal memory and no watermarking.\n- **Stateful Streaming**:\n  - Requires maintaining historical data across micro-batches.\n  - Examples: Windowed aggregations, deduplication (`dropDuplicates()`), stream-stream joins.\n  - Requires RocksDB or HDFS state store backing and explicit watermarks."}, {"id": 67, "question": "How do Stream-Stream Joins work in Structured Streaming?", "difficulty": "Advanced", "category": "Streaming & Event Processing", "answer_html": "<p class=\"prose-p\">In Stream-Stream joins, records from both streams arrive at different times:</p>\n<p class=\"prose-p\"><strong>Requirements:</strong></p>\n<ol class=\"ordered-list\">\n<li>Both input streams must define a <strong>Watermark</strong> on their event-time columns.</li>\n<li>The join condition must include an <strong>event-time constraint</strong> (time bound) to define how long an event from stream A can wait for an event from stream B.</li>\n</ol>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\"># Match user clicks with impressions occurring within a 2-hour window\nquery = impressions.join(\n    clicks,\n    F.expr(&quot;impression_id = click_id AND click_time &gt;= impression_time AND click_time &lt;= impression_time + interval 2 hours&quot;)\n)</code></pre></div>", "raw_answer": "In Stream-Stream joins, records from both streams arrive at different times:\n\n**Requirements:**\n1. Both input streams must define a **Watermark** on their event-time columns.\n2. The join condition must include an **event-time constraint** (time bound) to define how long an event from stream A can wait for an event from stream B.\n\n```python\n# Match user clicks with impressions occurring within a 2-hour window\nquery = impressions.join(\n    clicks,\n    F.expr(\"impression_id = click_id AND click_time >= impression_time AND click_time <= impression_time + interval 2 hours\")\n)\n```"}, {"id": 68, "question": "What happens if you delete or change the Checkpoint Directory in a streaming query?", "difficulty": "Intermediate", "category": "Streaming & Event Processing", "answer_html": "<ul class=\"bullet-list\">\n<li>The Checkpoint Directory stores:</li>\n</ul>\n<ol class=\"ordered-list\">\n<li>Offset logs (current Kafka offsets processed).</li>\n<li>Commit logs (completed batches).</li>\n<li>State store files (accumulated aggregates, window states).</li>\n</ol>\n<ul class=\"bullet-list\">\n<li><strong>If deleted</strong>: The stream loses its state and offset history. It will re-read data from Kafka (starting from <code class=\"inline-code\">earliest</code> or <code class=\"inline-code\">latest</code>), resulting in duplicate records or lost calculations.</li>\n<li><strong>If query logic changes incompatibly</strong>: Spark will fail on startup because serialized state schemas no longer match.</li>\n</ul>", "raw_answer": "- The Checkpoint Directory stores:\n  1. Offset logs (current Kafka offsets processed).\n  2. Commit logs (completed batches).\n  3. State store files (accumulated aggregates, window states).\n- **If deleted**: The stream loses its state and offset history. It will re-read data from Kafka (starting from `earliest` or `latest`), resulting in duplicate records or lost calculations.\n- **If query logic changes incompatibly**: Spark will fail on startup because serialized state schemas no longer match."}, {"id": 69, "question": "What is RocksDB StateStore in Structured Streaming?", "difficulty": "Advanced", "category": "Streaming & Event Processing", "answer_html": "<p class=\"prose-p\">By default, Spark stores streaming state in the JVM heap (<code class=\"inline-code\">HDFSBackedStateStoreProvider</code>). On high-throughput stateful streams with millions of keys, JVM GC pauses crash executors.</p>\n<p class=\"prose-p\"><strong>RocksDB StateStore Provider</strong>:</p>\n<ul class=\"bullet-list\">\n<li>Replaces JVM heap state store with <strong>RocksDB</strong> (an embedded, high-performance C++ key-value store).</li>\n<li>Offloads state memory off-heap and flushes to local NVMe SSD disks.</li>\n<li>Prevents JVM GC freezes and handles millions of state keys efficiently.</li>\n<li>Set via:</li>\n</ul>\n<p class=\"prose-p\"><code class=\"inline-code\">spark.sql.streaming.stateStore.providerClass = org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider</code></p>", "raw_answer": "By default, Spark stores streaming state in the JVM heap (`HDFSBackedStateStoreProvider`). On high-throughput stateful streams with millions of keys, JVM GC pauses crash executors.\n\n**RocksDB StateStore Provider**:\n- Replaces JVM heap state store with **RocksDB** (an embedded, high-performance C++ key-value store).\n- Offloads state memory off-heap and flushes to local NVMe SSD disks.\n- Prevents JVM GC freezes and handles millions of state keys efficiently.\n- Set via:\n  `spark.sql.streaming.stateStore.providerClass = org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider`"}, {"id": 70, "question": "How do you read streaming data from Apache Kafka in PySpark?", "difficulty": "Intermediate", "category": "Streaming & Event Processing", "answer_html": "<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">df_kafka = spark.readStream \\\n    .format(&quot;kafka&quot;) \\\n    .option(&quot;kafka.bootstrap.servers&quot;, &quot;broker1:9092,broker2:9092&quot;) \\\n    .option(&quot;subscribe&quot;, &quot;telemetry-events&quot;) \\\n    .option(&quot;startingOffsets&quot;, &quot;latest&quot;) \\\n    .load()\n\n# Kafka message values arrive as binary; cast to string and parse JSON\ndf_parsed = df_kafka.selectExpr(&quot;CAST(key AS STRING)&quot;, &quot;CAST(value AS STRING) as json_val&quot;)</code></pre></div>", "raw_answer": "```python\ndf_kafka = spark.readStream \\\n    .format(\"kafka\") \\\n    .option(\"kafka.bootstrap.servers\", \"broker1:9092,broker2:9092\") \\\n    .option(\"subscribe\", \"telemetry-events\") \\\n    .option(\"startingOffsets\", \"latest\") \\\n    .load()\n\n# Kafka message values arrive as binary; cast to string and parse JSON\ndf_parsed = df_kafka.selectExpr(\"CAST(key AS STRING)\", \"CAST(value AS STRING) as json_val\")\n```"}, {"id": 71, "question": "What is Delta Lake, and what core capabilities does it add to Apache Spark?", "difficulty": "Intermediate", "category": "Lakehouse & Delta Lake", "answer_html": "<p class=\"prose-p\"><strong>Delta Lake</strong> is an open-source storage layer that brings reliability to data lakes by storing Parquet data files alongside an ACID transaction log (<code class=\"inline-code\">_delta_log/</code>).</p>\n<p class=\"prose-p\"><strong>Core Capabilities:</strong></p>\n<ol class=\"ordered-list\">\n<li><strong>ACID Transactions</strong>: Serializable or Write-Serializable isolation guarantees.</li>\n<li><strong>Time Travel (Data Versioning)</strong>: Query historical snapshots of data.</li>\n<li><strong>Schema Enforcement and Evolution</strong>: Prevents corrupted records; allows controlled schema updates.</li>\n<li><strong>Unified Batch and Streaming</strong>: Read and write streaming tables with transactional consistency.</li>\n<li><strong>DML Support</strong>: Full <code class=\"inline-code\">UPDATE</code>, <code class=\"inline-code\">DELETE</code>, and <code class=\"inline-code\">MERGE INTO</code> (upsert) support.</li>\n</ol>", "raw_answer": "**Delta Lake** is an open-source storage layer that brings reliability to data lakes by storing Parquet data files alongside an ACID transaction log (`_delta_log/`).\n\n**Core Capabilities:**\n1. **ACID Transactions**: Serializable or Write-Serializable isolation guarantees.\n2. **Time Travel (Data Versioning)**: Query historical snapshots of data.\n3. **Schema Enforcement and Evolution**: Prevents corrupted records; allows controlled schema updates.\n4. **Unified Batch and Streaming**: Read and write streaming tables with transactional consistency.\n5. **DML Support**: Full `UPDATE`, `DELETE`, and `MERGE INTO` (upsert) support."}, {"id": 72, "question": "How does the Delta Lake Transaction Log (`_delta_log`) work?", "difficulty": "Advanced", "category": "Lakehouse & Delta Lake", "answer_html": "<p class=\"prose-p\">The <code class=\"inline-code\">_delta_log</code> directory contains:</p>\n<ol class=\"ordered-list\">\n<li><strong>JSON Commit Files (<code class=\"inline-code\">000000.json</code>, <code class=\"inline-code\">000001.json</code>, ...)</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>Each commit writes an atomic JSON log entry recording added and removed Parquet files, column statistics (min/max/null count), and metadata changes.</li>\n</ul>\n<ol class=\"ordered-list\">\n<li><strong>Checkpoint Parquet Files (Every 10 commits)</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>At commit 10, Delta aggregates the previous 10 JSON commits into a single <code class=\"inline-code\">000010.checkpoint.parquet</code> file.</li>\n<li>Readers load the latest checkpoint file plus subsequent JSON logs, avoiding scanning thousands of individual JSON commits.</li>\n</ul>", "raw_answer": "The `_delta_log` directory contains:\n1. **JSON Commit Files (`000000.json`, `000001.json`, ...)**:\n   - Each commit writes an atomic JSON log entry recording added and removed Parquet files, column statistics (min/max/null count), and metadata changes.\n2. **Checkpoint Parquet Files (Every 10 commits)**:\n   - At commit 10, Delta aggregates the previous 10 JSON commits into a single `000010.checkpoint.parquet` file.\n   - Readers load the latest checkpoint file plus subsequent JSON logs, avoiding scanning thousands of individual JSON commits."}, {"id": 73, "question": "What is the Small Files problem in Big Data, and how does Delta Lake resolve it?", "difficulty": "Intermediate", "category": "Lakehouse & Delta Lake", "answer_html": "<p class=\"prose-p\"><strong>The Small Files Problem:</strong></p>\n<p class=\"prose-p\">Frequent streaming writes or over-partitioning generate thousands of sub-megabyte files. Reading thousands of tiny files causes high metadata overhead and slows down storage system scans.</p>\n<p class=\"prose-p\"><strong>Delta Lake Resolutions:</strong></p>\n<ol class=\"ordered-list\">\n<li><strong><code class=\"inline-code\">OPTIMIZE</code> Compaction</strong>: Merges small files into larger target files (typically 1 GB):</li>\n</ol>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">sql</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-sql\">   OPTIMIZE delta_table;</code></pre></div>\n<ol class=\"ordered-list\">\n<li><strong>Auto-Compaction and Optimized Writes</strong>:</li>\n</ol>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">   spark.conf.set(&quot;spark.databricks.delta.optimizeWrite.enabled&quot;, &quot;true&quot;)\n   spark.conf.set(&quot;spark.databricks.delta.autoOptimize.autoCompact.enabled&quot;, &quot;true&quot;)</code></pre></div>", "raw_answer": "**The Small Files Problem:**\nFrequent streaming writes or over-partitioning generate thousands of sub-megabyte files. Reading thousands of tiny files causes high metadata overhead and slows down storage system scans.\n\n**Delta Lake Resolutions:**\n1. **`OPTIMIZE` Compaction**: Merges small files into larger target files (typically 1 GB):\n   ```sql\n   OPTIMIZE delta_table;\n   ```\n2. **Auto-Compaction and Optimized Writes**:\n   ```python\n   spark.conf.set(\"spark.databricks.delta.optimizeWrite.enabled\", \"true\")\n   spark.conf.set(\"spark.databricks.delta.autoOptimize.autoCompact.enabled\", \"true\")\n   ```"}, {"id": 74, "question": "What is Z-Ordering in Delta Lake, and how does it differ from Partitioning?", "difficulty": "Intermediate", "category": "Lakehouse & Delta Lake", "answer_html": "<ul class=\"bullet-list\">\n<li><strong>Partitioning</strong>: Organizes files into discrete folder hierarchies (e.g., <code class=\"inline-code\">region=US/</code>). Best for low-cardinality columns (&lt; a few hundred unique values).</li>\n<li><strong>Z-Ordering (<code class=\"inline-code\">OPTIMIZE ... ZORDER BY</code>)</strong>: Multidimensional clustering algorithm that maps high-cardinality multi-column values onto a space-filling curve (Morton curve).</li>\n<li>Co-locates related information within the same physical Parquet files.</li>\n<li>Enables file-level data skipping on multiple high-cardinality query columns simultaneously.</li>\n</ul>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">sql</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-sql\">  OPTIMIZE customer_events ZORDER BY (user_id, event_date);</code></pre></div>", "raw_answer": "- **Partitioning**: Organizes files into discrete folder hierarchies (e.g., `region=US/`). Best for low-cardinality columns (< a few hundred unique values).\n- **Z-Ordering (`OPTIMIZE ... ZORDER BY`)**: Multidimensional clustering algorithm that maps high-cardinality multi-column values onto a space-filling curve (Morton curve).\n  - Co-locates related information within the same physical Parquet files.\n  - Enables file-level data skipping on multiple high-cardinality query columns simultaneously.\n  ```sql\n  OPTIMIZE customer_events ZORDER BY (user_id, event_date);\n  ```"}, {"id": 75, "question": "Explain Time Travel in Delta Lake with PySpark code examples.", "difficulty": "Intermediate", "category": "Lakehouse & Delta Lake", "answer_html": "<p class=\"prose-p\">Delta Lake retains historical versions based on commit logs:</p>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\"># 1. Query by Version Number\ndf_v1 = spark.read.format(&quot;delta&quot;).option(&quot;versionAsOf&quot;, 1).load(&quot;/path/to/delta&quot;)\n\n# 2. Query by Timestamp (Point-in-Time)\ndf_ts = spark.read.format(&quot;delta&quot;).option(&quot;timestampAsOf&quot;, &quot;2026-10-01 12:00:00&quot;).load(&quot;/path/to/delta&quot;)\n\n# 3. Restore table to previous version\nfrom delta.tables import DeltaTable\ndeltaTable = DeltaTable.forPath(spark, &quot;/path/to/delta&quot;)\ndeltaTable.restoreToVersion(1)</code></pre></div>", "raw_answer": "Delta Lake retains historical versions based on commit logs:\n\n```python\n# 1. Query by Version Number\ndf_v1 = spark.read.format(\"delta\").option(\"versionAsOf\", 1).load(\"/path/to/delta\")\n\n# 2. Query by Timestamp (Point-in-Time)\ndf_ts = spark.read.format(\"delta\").option(\"timestampAsOf\", \"2026-10-01 12:00:00\").load(\"/path/to/delta\")\n\n# 3. Restore table to previous version\nfrom delta.tables import DeltaTable\ndeltaTable = DeltaTable.forPath(spark, \"/path/to/delta\")\ndeltaTable.restoreToVersion(1)\n```"}, {"id": 76, "question": "What is the `VACUUM` command in Delta Lake, and why must you use it carefully?", "difficulty": "Intermediate", "category": "Lakehouse & Delta Lake", "answer_html": "<p class=\"prose-p\"><code class=\"inline-code\">VACUUM</code> deletes data files that are no longer referenced by the transaction log and are older than the retention threshold.</p>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">sql</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-sql\">VACUUM delta_table RETAIN 168 HOURS; -- Retains 7 days of history (default)</code></pre></div>\n<p class=\"prose-p\"><strong>Caution:</strong></p>\n<ul class=\"bullet-list\">\n<li>Running <code class=\"inline-code\">VACUUM</code> permanently destroys older Parquet files.</li>\n<li>Once removed, queries attempting to <strong>Time Travel</strong> prior to the retention window will fail with file-not-found errors.</li>\n<li>Never set retention to 0 hours on active production tables without stopping concurrent readers/writers.</li>\n</ul>", "raw_answer": "`VACUUM` deletes data files that are no longer referenced by the transaction log and are older than the retention threshold.\n\n```sql\nVACUUM delta_table RETAIN 168 HOURS; -- Retains 7 days of history (default)\n```\n\n**Caution:**\n- Running `VACUUM` permanently destroys older Parquet files.\n- Once removed, queries attempting to **Time Travel** prior to the retention window will fail with file-not-found errors.\n- Never set retention to 0 hours on active production tables without stopping concurrent readers/writers."}, {"id": 77, "question": "How does `MERGE INTO` (Upsert) work in Delta Lake?", "difficulty": "Intermediate", "category": "Lakehouse & Delta Lake", "answer_html": "<p class=\"prose-p\"><code class=\"inline-code\">MERGE INTO</code> performs atomic updates, inserts, and deletes in a single transactional operation:</p>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">from delta.tables import DeltaTable\n\ntargetTable = DeltaTable.forPath(spark, &quot;/data/customers&quot;)\n\ntargetTable.alias(&quot;target&quot;).merge(\n    source=df_updates.alias(&quot;updates&quot;),\n    condition=&quot;target.customer_id = updates.customer_id&quot;\n).whenMatchedUpdate(set={\n    &quot;name&quot;: &quot;updates.name&quot;,\n    &quot;email&quot;: &quot;updates.email&quot;,\n    &quot;last_updated&quot;: &quot;updates.updated_at&quot;\n}).whenNotMatchedInsert(values={\n    &quot;customer_id&quot;: &quot;updates.customer_id&quot;,\n    &quot;name&quot;: &quot;updates.name&quot;,\n    &quot;email&quot;: &quot;updates.email&quot;,\n    &quot;created_at&quot;: &quot;updates.updated_at&quot;\n}).execute()</code></pre></div>", "raw_answer": "`MERGE INTO` performs atomic updates, inserts, and deletes in a single transactional operation:\n\n```python\nfrom delta.tables import DeltaTable\n\ntargetTable = DeltaTable.forPath(spark, \"/data/customers\")\n\ntargetTable.alias(\"target\").merge(\n    source=df_updates.alias(\"updates\"),\n    condition=\"target.customer_id = updates.customer_id\"\n).whenMatchedUpdate(set={\n    \"name\": \"updates.name\",\n    \"email\": \"updates.email\",\n    \"last_updated\": \"updates.updated_at\"\n}).whenNotMatchedInsert(values={\n    \"customer_id\": \"updates.customer_id\",\n    \"name\": \"updates.name\",\n    \"email\": \"updates.email\",\n    \"created_at\": \"updates.updated_at\"\n}).execute()\n```"}, {"id": 78, "question": "Compare Parquet, ORC, and Avro file formats.", "difficulty": "Beginner", "category": "Lakehouse & Delta Lake", "answer_html": "<div class=\"table-container\"><table class=\"data-table\">\n<thead><tr>\n<th>Format</th>\n<th>Type</th>\n<th>Compression &amp; Encoding</th>\n<th>Best Use Case</th>\n</tr></thead><tbody>\n<tr>\n<td><strong>Parquet</strong></td>\n<td>Columnar</td>\n<td>Snappy, Gzip, Dictionary, Run-Length</td>\n<td>Analytical queries (OLAP), Spark read pipelines</td>\n</tr>\n<tr>\n<td><strong>ORC</strong></td>\n<td>Columnar</td>\n<td>Zlib, Snappy, Index-backed</td>\n<td>Hive &amp; Presto/Trino heavy analytical queries</td>\n</tr>\n<tr>\n<td><strong>Avro</strong></td>\n<td>Row-oriented</td>\n<td>Deflate, Snappy, JSON schema attached</td>\n<td>Event streaming (Kafka), row-level writes (OLTP)</td>\n</tr>\n</tbody>\n</table></div>\n<p class=\"prose-p\"><strong>Summary</strong>: Use Avro for real-time ingestion/Kafka payloads; convert to Parquet/Delta Lake for data warehousing and analytics.</p>", "raw_answer": "| Format | Type | Compression & Encoding | Best Use Case |\n| :--- | :--- | :--- | :--- |\n| **Parquet** | Columnar | Snappy, Gzip, Dictionary, Run-Length | Analytical queries (OLAP), Spark read pipelines |\n| **ORC** | Columnar | Zlib, Snappy, Index-backed | Hive & Presto/Trino heavy analytical queries |\n| **Avro** | Row-oriented | Deflate, Snappy, JSON schema attached | Event streaming (Kafka), row-level writes (OLTP) |\n\n**Summary**: Use Avro for real-time ingestion/Kafka payloads; convert to Parquet/Delta Lake for data warehousing and analytics."}, {"id": 79, "question": "What is Schema Enforcement vs Schema Evolution in Delta Lake?", "difficulty": "Intermediate", "category": "Lakehouse & Delta Lake", "answer_html": "<ul class=\"bullet-list\">\n<li><strong>Schema Enforcement (Schema Validation)</strong>:</li>\n<li>Default Delta Lake behavior.</li>\n<li>If incoming DataFrame has columns not present in the target Delta table or mismatched types, Delta rejects the write and throws an <code class=\"inline-code\">AnalysisException</code>.</li>\n<li><strong>Schema Evolution (<code class=\"inline-code\">mergeSchema</code>)</strong>:</li>\n<li>Allows automatically updating the target schema to accommodate new columns:</li>\n</ul>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">  df_new.write.format(&quot;delta&quot;) \\\n        .mode(&quot;append&quot;) \\\n        .option(&quot;mergeSchema&quot;, &quot;true&quot;) \\\n        .save(&quot;/data/table&quot;)</code></pre></div>", "raw_answer": "- **Schema Enforcement (Schema Validation)**:\n  - Default Delta Lake behavior.\n  - If incoming DataFrame has columns not present in the target Delta table or mismatched types, Delta rejects the write and throws an `AnalysisException`.\n- **Schema Evolution (`mergeSchema`)**:\n  - Allows automatically updating the target schema to accommodate new columns:\n  ```python\n  df_new.write.format(\"delta\") \\\n        .mode(\"append\") \\\n        .option(\"mergeSchema\", \"true\") \\\n        .save(\"/data/table\")\n  ```"}, {"id": 80, "question": "What is Change Data Feed (CDF) in Delta Lake?", "difficulty": "Advanced", "category": "Lakehouse & Delta Lake", "answer_html": "<p class=\"prose-p\"><strong>Change Data Feed (CDF)</strong> records row-level change events (inserts, updates, deletes) on a Delta table.</p>\n<p class=\"prose-p\"><strong>Enable CDF:</strong></p>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">sql</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-sql\">ALTER TABLE silver_orders SET TBLPROPERTIES (delta.enableChangeDataFeed = true);</code></pre></div>\n<p class=\"prose-p\"><strong>Output Columns Added:</strong></p>\n<ul class=\"bullet-list\">\n<li><code class=\"inline-code\">_change_type</code>: <code class=\"inline-code\">\"insert\"</code>, <code class=\"inline-code\">\"update_preimage\"</code>, <code class=\"inline-code\">\"update_postimage\"</code>, or <code class=\"inline-code\">\"delete\"</code>.</li>\n<li><code class=\"inline-code\">_commit_version</code>: Version number of the change.</li>\n<li><code class=\"inline-code\">_commit_timestamp</code>: Commit timestamp.</li>\n</ul>\n<p class=\"prose-p\"><strong>Use Case</strong>: Enables downstream Silver-to-Gold incremental aggregations without scanning the entire source table.</p>", "raw_answer": "**Change Data Feed (CDF)** records row-level change events (inserts, updates, deletes) on a Delta table.\n\n**Enable CDF:**\n```sql\nALTER TABLE silver_orders SET TBLPROPERTIES (delta.enableChangeDataFeed = true);\n```\n\n**Output Columns Added:**\n- `_change_type`: `\"insert\"`, `\"update_preimage\"`, `\"update_postimage\"`, or `\"delete\"`.\n- `_commit_version`: Version number of the change.\n- `_commit_timestamp`: Commit timestamp.\n\n**Use Case**: Enables downstream Silver-to-Gold incremental aggregations without scanning the entire source table."}, {"id": 81, "question": "What is the difference between ETL and ELT, and why did the industry shift?", "difficulty": "Beginner", "category": "Architecture & Data Modeling", "answer_html": "<ul class=\"bullet-list\">\n<li><strong>ETL (Extract, Transform, Load)</strong>:</li>\n<li>Data transformed on separate processing servers before loading into warehouse.</li>\n<li>Legacy approach required by legacy on-prem databases with limited compute.</li>\n<li><strong>ELT (Extract, Load, Transform)</strong>:</li>\n<li>Raw data loaded immediately into data lake/cloud warehouse (Snowflake, BigQuery, Fabric), transformed later using distributed SQL/Spark/dbt.</li>\n<li><strong>Why shifted</strong>: Cloud compute is elastic, cheap, and decoupled from storage; preserves raw data fidelity for future recalculations.</li>\n</ul>", "raw_answer": "- **ETL (Extract, Transform, Load)**:\n  - Data transformed on separate processing servers before loading into warehouse.\n  - Legacy approach required by legacy on-prem databases with limited compute.\n- **ELT (Extract, Load, Transform)**:\n  - Raw data loaded immediately into data lake/cloud warehouse (Snowflake, BigQuery, Fabric), transformed later using distributed SQL/Spark/dbt.\n  - **Why shifted**: Cloud compute is elastic, cheap, and decoupled from storage; preserves raw data fidelity for future recalculations."}, {"id": 82, "question": "Compare Lambda Architecture vs Kappa Architecture.", "difficulty": "Intermediate", "category": "Architecture & Data Modeling", "answer_html": "<ul class=\"bullet-list\">\n<li><strong>Lambda Architecture</strong>:</li>\n<li>Two parallel pipelines: <strong>Batch Layer</strong> (cold path, high latency, recomputes correctness) + <strong>Speed Layer</strong> (hot path, low latency stream).</li>\n<li>Merged at the <strong>Serving Layer</strong>.</li>\n<li><em>Disadvantage</em>: Requires building and maintaining two separate codebases.</li>\n<li><strong>Kappa Architecture</strong>:</li>\n<li>Single streaming engine (Kafka + Flink / Spark Structured Streaming) handles both real-time streaming and historical backfills by replaying log offsets.</li>\n<li>Single codebase to maintain.</li>\n</ul>", "raw_answer": "- **Lambda Architecture**:\n  - Two parallel pipelines: **Batch Layer** (cold path, high latency, recomputes correctness) + **Speed Layer** (hot path, low latency stream).\n  - Merged at the **Serving Layer**.\n  - *Disadvantage*: Requires building and maintaining two separate codebases.\n- **Kappa Architecture**:\n  - Single streaming engine (Kafka + Flink / Spark Structured Streaming) handles both real-time streaming and historical backfills by replaying log offsets.\n  - Single codebase to maintain."}, {"id": 83, "question": "What is the Medallion Architecture (Bronze -> Silver -> Gold)?", "difficulty": "Intermediate", "category": "Architecture & Data Modeling", "answer_html": "<p class=\"prose-p\">A data design pattern used in Lakehouse platforms:</p>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">code</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-\">[Raw Sources] ---&gt; [Bronze Layer] ---&gt; [Silver Layer] ---&gt; [Gold Layer]\n(APIs, Kafka)      (Raw Append-Only)   (Cleaned, Deduplicated) (Aggregated, Star Schema)</code></pre></div>\n<ol class=\"ordered-list\">\n<li><strong>Bronze (Raw / Ingestion)</strong>: Append-only raw data preserved in original source fidelity with ingestion timestamp.</li>\n<li><strong>Silver (Enriched / Conformed)</strong>: Cleaned, validated, typed, and deduplicated enterprise data.</li>\n<li><strong>Gold (Curated / Business-Level)</strong>: Aggregated data models, dimensional star schemas, ready for Power BI, analytics, and reporting.</li>\n</ol>", "raw_answer": "A data design pattern used in Lakehouse platforms:\n\n```\n[Raw Sources] ---> [Bronze Layer] ---> [Silver Layer] ---> [Gold Layer]\n(APIs, Kafka)      (Raw Append-Only)   (Cleaned, Deduplicated) (Aggregated, Star Schema)\n```\n\n1. **Bronze (Raw / Ingestion)**: Append-only raw data preserved in original source fidelity with ingestion timestamp.\n2. **Silver (Enriched / Conformed)**: Cleaned, validated, typed, and deduplicated enterprise data.\n3. **Gold (Curated / Business-Level)**: Aggregated data models, dimensional star schemas, ready for Power BI, analytics, and reporting."}, {"id": 84, "question": "What is the difference between Star Schema and Snowflake Schema?", "difficulty": "Intermediate", "category": "Architecture & Data Modeling", "answer_html": "<div class=\"table-container\"><table class=\"data-table\">\n<thead><tr>\n<th>Aspect</th>\n<th>Star Schema</th>\n<th>Snowflake Schema</th>\n</tr></thead><tbody>\n<tr>\n<td><strong>Dimension Structure</strong></td>\n<td>Denormalized (single dimension table per entity)</td>\n<td>Normalized (dimensions split into sub-dimension lookup tables)</td>\n</tr>\n<tr>\n<td><strong>Join Complexity</strong></td>\n<td>Simple joins (Fact joined directly to Dimensions)</td>\n<td>Complex joins across normalized dimension hierarchies</td>\n</tr>\n<tr>\n<td><strong>Query Speed</strong></td>\n<td>Faster analytical query performance (OLAP)</td>\n<td>Slower query response due to multiple joins</td>\n</tr>\n<tr>\n<td><strong>Storage Redundancy</strong></td>\n<td>Higher data redundancy</td>\n<td>Minimal storage redundancy</td>\n</tr>\n<tr>\n<td><strong>Modern Default</strong></td>\n<td><strong>Preferred standard</strong> in cloud warehousing</td>\n<td>Used selectively for strict governance hierarchies</td>\n</tr>\n</tbody>\n</table></div>", "raw_answer": "| Aspect | Star Schema | Snowflake Schema |\n| :--- | :--- | :--- |\n| **Dimension Structure** | Denormalized (single dimension table per entity) | Normalized (dimensions split into sub-dimension lookup tables) |\n| **Join Complexity** | Simple joins (Fact joined directly to Dimensions) | Complex joins across normalized dimension hierarchies |\n| **Query Speed** | Faster analytical query performance (OLAP) | Slower query response due to multiple joins |\n| **Storage Redundancy**| Higher data redundancy | Minimal storage redundancy |\n| **Modern Default** | **Preferred standard** in cloud warehousing | Used selectively for strict governance hierarchies |"}, {"id": 85, "question": "Explain Slowly Changing Dimension (SCD) Types 0, 1, 2, 3, and 6.", "difficulty": "Intermediate", "category": "Architecture & Data Modeling", "answer_html": "<ul class=\"bullet-list\">\n<li><strong>SCD Type 0</strong>: Fixed / Retain original value (e.g., birthdate).</li>\n<li><strong>SCD Type 1</strong>: Overwrite existing value (no history maintained).</li>\n<li><strong>SCD Type 2</strong>: Add a new row with validity columns (<code class=\"inline-code\">is_current</code>, <code class=\"inline-code\">start_date</code>, <code class=\"inline-code\">end_date</code>). Full history maintained.</li>\n<li><strong>SCD Type 3</strong>: Add previous value column to the same row (preserves only previous and current value).</li>\n<li><strong>SCD Type 4</strong>: Add a separate historical table for audits.</li>\n<li><strong>SCD Type 6</strong>: Hybrid ($1 + 2 + 3 = 6$): Type 2 row addition combined with Type 1 overwrite of current status flag across all rows.</li>\n</ul>", "raw_answer": "- **SCD Type 0**: Fixed / Retain original value (e.g., birthdate).\n- **SCD Type 1**: Overwrite existing value (no history maintained).\n- **SCD Type 2**: Add a new row with validity columns (`is_current`, `start_date`, `end_date`). Full history maintained.\n- **SCD Type 3**: Add previous value column to the same row (preserves only previous and current value).\n- **SCD Type 4**: Add a separate historical table for audits.\n- **SCD Type 6**: Hybrid ($1 + 2 + 3 = 6$): Type 2 row addition combined with Type 1 overwrite of current status flag across all rows."}, {"id": 86, "question": "What is Idempotency in Data Engineering pipelines, and why is it essential?", "difficulty": "Intermediate", "category": "Architecture & Data Modeling", "answer_html": "<p class=\"prose-p\"><strong>Idempotency</strong> means running the same pipeline execution multiple times with the exact same inputs produces the identical outcome without duplicate records or corrupted state:</p>\n<p class=\"prose-p\">$$f(f(x)) = f(x)$$</p>\n<p class=\"prose-p\"><strong>How to Implement Idempotent Pipelines:</strong></p>\n<ol class=\"ordered-list\">\n<li>Avoid blind <code class=\"inline-code\">INSERT INTO</code> or append operations without checks.</li>\n<li>Use <strong>Partition Overwrites</strong>: Overwrite target partitions rather than appending (<code class=\"inline-code\">mode(\"overwrite\")</code>).</li>\n<li>Use <strong>Upsert / <code class=\"inline-code\">MERGE INTO</code></strong> matching on unique business surrogate keys.</li>\n<li>Stage data in temporary staging locations and commit using atomic file system renames.</li>\n</ol>", "raw_answer": "**Idempotency** means running the same pipeline execution multiple times with the exact same inputs produces the identical outcome without duplicate records or corrupted state:\n\n$$f(f(x)) = f(x)$$\n\n**How to Implement Idempotent Pipelines:**\n1. Avoid blind `INSERT INTO` or append operations without checks.\n2. Use **Partition Overwrites**: Overwrite target partitions rather than appending (`mode(\"overwrite\")`).\n3. Use **Upsert / `MERGE INTO`** matching on unique business surrogate keys.\n4. Stage data in temporary staging locations and commit using atomic file system renames."}, {"id": 87, "question": "What is Change Data Capture (CDC), and what are common CDC patterns?", "difficulty": "Intermediate", "category": "Architecture & Data Modeling", "answer_html": "<p class=\"prose-p\"><strong>Change Data Capture (CDC)</strong> tracks insert, update, and delete events from source transactional databases (OLTP) and replicates them downstream:</p>\n<p class=\"prose-p\"><strong>CDC Patterns:</strong></p>\n<ol class=\"ordered-list\">\n<li><strong>Log-Based CDC (Recommended)</strong>: Reads transaction logs directly without querying the database engine (e.g., Debezium reading MySQL binlog or Postgres WAL). Zero overhead on source application queries.</li>\n<li><strong>Timestamp/Audit Columns</strong>: Queries <code class=\"inline-code\">WHERE updated_at &gt; :last_watermark</code>. Cannot detect hard deletions without soft-delete columns.</li>\n<li><strong>Database Triggers</strong>: Inserts audit rows on DB trigger. Degrades OLTP write performance.</li>\n</ol>", "raw_answer": "**Change Data Capture (CDC)** tracks insert, update, and delete events from source transactional databases (OLTP) and replicates them downstream:\n\n**CDC Patterns:**\n1. **Log-Based CDC (Recommended)**: Reads transaction logs directly without querying the database engine (e.g., Debezium reading MySQL binlog or Postgres WAL). Zero overhead on source application queries.\n2. **Timestamp/Audit Columns**: Queries `WHERE updated_at > :last_watermark`. Cannot detect hard deletions without soft-delete columns.\n3. **Database Triggers**: Inserts audit rows on DB trigger. Degrades OLTP write performance."}, {"id": 88, "question": "Explain the CAP Theorem and its relevance to modern Big Data systems.", "difficulty": "Beginner", "category": "Architecture & Data Modeling", "answer_html": "<p class=\"prose-p\">In any distributed data store, you can guarantee at most <strong>two out of three</strong> properties during network partition:</p>\n<ol class=\"ordered-list\">\n<li><strong>Consistency (C)</strong>: Every read receives the most recent write or an error.</li>\n<li><strong>Availability (A)</strong>: Every non-failing node returns a response, but without guarantee it contains the latest write.</li>\n<li><strong>Partition Tolerance (P)</strong>: The system continues to operate despite arbitrary network dropped messages.</li>\n</ol>\n<p class=\"prose-p\"><em>Since network partitions are inevitable in distributed hardware ($P$ is mandatory), distributed systems must choose between <strong>CP</strong> (e.g., HBase, MongoDB) or <strong>AP</strong> (e.g., Cassandra, DynamoDB).</em></p>", "raw_answer": "In any distributed data store, you can guarantee at most **two out of three** properties during network partition:\n\n1. **Consistency (C)**: Every read receives the most recent write or an error.\n2. **Availability (A)**: Every non-failing node returns a response, but without guarantee it contains the latest write.\n3. **Partition Tolerance (P)**: The system continues to operate despite arbitrary network dropped messages.\n\n*Since network partitions are inevitable in distributed hardware ($P$ is mandatory), distributed systems must choose between **CP** (e.g., HBase, MongoDB) or **AP** (e.g., Cassandra, DynamoDB).*"}, {"id": 89, "question": "What is Data Lineage, and why is it important in enterprise platforms?", "difficulty": "Intermediate", "category": "Architecture & Data Modeling", "answer_html": "<p class=\"prose-p\"><strong>Data Lineage</strong> tracks the complete lifecycle of data: origin source, every transformation applied across pipelines, and all downstream consumer reports/dashboards.</p>\n<p class=\"prose-p\"><strong>Importance:</strong></p>\n<ol class=\"ordered-list\">\n<li><strong>Root Cause Analysis</strong>: Pinpoint the exact pipeline failure when a KPI dashboard breaks.</li>\n<li><strong>Impact Analysis</strong>: Determine downstream impact before altering an upstream table schema.</li>\n<li><strong>Regulatory Compliance</strong>: Meet GDPR, HIPAA, and BCBS 239 audit standards.</li>\n<li><strong>Data Governance Platforms</strong>: Populated into catalogs like Microsoft Purview, Apache Atlas, and Collibra.</li>\n</ol>", "raw_answer": "**Data Lineage** tracks the complete lifecycle of data: origin source, every transformation applied across pipelines, and all downstream consumer reports/dashboards.\n\n**Importance:**\n1. **Root Cause Analysis**: Pinpoint the exact pipeline failure when a KPI dashboard breaks.\n2. **Impact Analysis**: Determine downstream impact before altering an upstream table schema.\n3. **Regulatory Compliance**: Meet GDPR, HIPAA, and BCBS 239 audit standards.\n4. **Data Governance Platforms**: Populated into catalogs like Microsoft Purview, Apache Atlas, and Collibra."}, {"id": 90, "question": "What is Data Observability, and what are its 5 core pillars?", "difficulty": "Intermediate", "category": "Architecture & Data Modeling", "answer_html": "<p class=\"prose-p\">Data Observability monitors the end-to-end health of enterprise data systems:</p>\n<p class=\"prose-p\"><strong>The 5 Pillars of Data Observability:</strong></p>\n<ol class=\"ordered-list\">\n<li><strong>Freshness</strong>: Is data updated on schedule or is the pipeline delayed?</li>\n<li><strong>Distribution</strong>: Do column values fit expected statistical ranges (e.g., sudden spikes in nulls or zero values)?</li>\n<li><strong>Volume</strong>: Did the expected number of records arrive (e.g., 0 records or 10x normal volume)?</li>\n<li><strong>Schema</strong>: Did an upstream team rename, remove, or modify a column data type?</li>\n<li><strong>Lineage</strong>: Which downstream reports and users are impacted by an upstream anomaly?</li>\n</ol>", "raw_answer": "Data Observability monitors the end-to-end health of enterprise data systems:\n\n**The 5 Pillars of Data Observability:**\n1. **Freshness**: Is data updated on schedule or is the pipeline delayed?\n2. **Distribution**: Do column values fit expected statistical ranges (e.g., sudden spikes in nulls or zero values)?\n3. **Volume**: Did the expected number of records arrive (e.g., 0 records or 10x normal volume)?\n4. **Schema**: Did an upstream team rename, remove, or modify a column data type?\n5. **Lineage**: Which downstream reports and users are impacted by an upstream anomaly?"}, {"id": 91, "question": "How do you size and allocate CPU cores and memory for Spark Executors in production?", "difficulty": "Advanced", "category": "Troubleshooting & Spark UI", "answer_html": "<p class=\"prose-p\"><strong>Recommended Sizing Strategy:</strong></p>\n<ol class=\"ordered-list\">\n<li><strong>Do NOT allocate 1 core per executor</strong>: Poor multithreading and unable to share broadcast variables.</li>\n<li><strong>Do NOT allocate &gt; 5 cores per executor</strong>: JVM Garbage Collection pauses degrade beyond 5 cores.</li>\n<li><strong>Standard Best Practice</strong>: <strong>4 to 5 cores per executor</strong>.</li>\n</ol>\n<p class=\"prose-p\"><strong>Example Cluster Sizing Calculation:</strong></p>\n<p class=\"prose-p\">Suppose Worker Node has 16 CPU cores and 64 GB RAM:</p>\n<ul class=\"bullet-list\">\n<li>Reserve 1 core and 4 GB RAM for OS and system daemons.</li>\n<li>Usable: 15 cores and 60 GB RAM.</li>\n<li>Executors per node: $15 / 5 = 3$ executors.</li>\n<li>Memory per executor: $60 / 3 = 20$ GB.</li>\n<li>Split memory: <code class=\"inline-code\">spark.executor.memory = 18g</code>, <code class=\"inline-code\">spark.executor.memoryOverhead = 2g</code>.</li>\n</ul>", "raw_answer": "**Recommended Sizing Strategy:**\n\n1. **Do NOT allocate 1 core per executor**: Poor multithreading and unable to share broadcast variables.\n2. **Do NOT allocate > 5 cores per executor**: JVM Garbage Collection pauses degrade beyond 5 cores.\n3. **Standard Best Practice**: **4 to 5 cores per executor**.\n\n**Example Cluster Sizing Calculation:**\nSuppose Worker Node has 16 CPU cores and 64 GB RAM:\n- Reserve 1 core and 4 GB RAM for OS and system daemons.\n- Usable: 15 cores and 60 GB RAM.\n- Executors per node: $15 / 5 = 3$ executors.\n- Memory per executor: $60 / 3 = 20$ GB.\n- Split memory: `spark.executor.memory = 18g`, `spark.executor.memoryOverhead = 2g`."}, {"id": 92, "question": "How do you diagnose and fix a slow-running PySpark job using the Spark UI?", "difficulty": "Intermediate", "category": "Troubleshooting & Spark UI", "answer_html": "<p class=\"prose-p\"><strong>Step-by-step diagnostic workflow:</strong></p>\n<ol class=\"ordered-list\">\n<li><strong>Jobs Tab</strong>: Identify the Job with the longest duration.</li>\n<li><strong>Stages Tab</strong>: Locate the Stage consuming the most runtime.</li>\n<li><strong>Task Metrics Table</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>Check <strong>Duration / GC Time</strong>: High GC time (&gt;10%) indicates memory starvation.</li>\n<li>Check <strong>Min / Median / Max Task Durations</strong>: If Max is 20x higher than Median, data skew exists.</li>\n<li>Check <strong>Shuffle Read Size / Spill (Memory / Disk)</strong>: Non-zero spill indicates insufficient executor execution memory.</li>\n</ul>\n<ol class=\"ordered-list\">\n<li><strong>Executors Tab</strong>: Verify whether tasks are evenly distributed across all executors or clustered on a single worker node.</li>\n</ol>", "raw_answer": "**Step-by-step diagnostic workflow:**\n\n1. **Jobs Tab**: Identify the Job with the longest duration.\n2. **Stages Tab**: Locate the Stage consuming the most runtime.\n3. **Task Metrics Table**:\n   - Check **Duration / GC Time**: High GC time (>10%) indicates memory starvation.\n   - Check **Min / Median / Max Task Durations**: If Max is 20x higher than Median, data skew exists.\n   - Check **Shuffle Read Size / Spill (Memory / Disk)**: Non-zero spill indicates insufficient executor execution memory.\n4. **Executors Tab**: Verify whether tasks are evenly distributed across all executors or clustered on a single worker node."}, {"id": 93, "question": "What is the File Commit Protocol, and why can saving to S3/Cloud storage be slow?", "difficulty": "Intermediate", "category": "Troubleshooting & Spark UI", "answer_html": "<p class=\"prose-p\">Spark uses <code class=\"inline-code\">FileOutputCommitter</code> to ensure atomic writes.</p>\n<p class=\"prose-p\"><strong>The S3 Renaming Problem:</strong></p>\n<ul class=\"bullet-list\">\n<li>On HDFS, file renaming is an atomic $O(1)$ pointer metadata change.</li>\n<li>On Amazon S3 or object stores, renaming a file requires <strong>copying the entire file byte-by-byte</strong>, then deleting the original.</li>\n<li>When Spark commits thousands of files at the end of a job (<code class=\"inline-code\">_temporary/</code> -&gt; final path), the commit stage can take hours.</li>\n</ul>\n<p class=\"prose-p\"><strong>Solution:</strong></p>\n<ul class=\"bullet-list\">\n<li>Use object-store optimized committers: <strong>S3A Committers</strong> (<code class=\"inline-code\">magic</code> committer), <strong>Delta Lake</strong> (uses atomic transaction log instead of directory rename), or Azure OneLake / ADLS Gen2 drivers.</li>\n</ul>", "raw_answer": "Spark uses `FileOutputCommitter` to ensure atomic writes.\n\n**The S3 Renaming Problem:**\n- On HDFS, file renaming is an atomic $O(1)$ pointer metadata change.\n- On Amazon S3 or object stores, renaming a file requires **copying the entire file byte-by-byte**, then deleting the original.\n- When Spark commits thousands of files at the end of a job (`_temporary/` -> final path), the commit stage can take hours.\n\n**Solution:**\n- Use object-store optimized committers: **S3A Committers** (`magic` committer), **Delta Lake** (uses atomic transaction log instead of directory rename), or Azure OneLake / ADLS Gen2 drivers."}, {"id": 94, "question": "What causes `SparkException: Job aborted due to stage failure: Task failed 4 times`?", "difficulty": "Intermediate", "category": "Troubleshooting & Spark UI", "answer_html": "<p class=\"prose-p\">This occurs when a single task fails repeatedly across 4 retries (<code class=\"inline-code\">spark.task.maxFailures = 4</code>).</p>\n<p class=\"prose-p\"><strong>Common Root Causes:</strong></p>\n<ol class=\"ordered-list\">\n<li><strong>Data Corruption / Malformed Records</strong>: A specific row causes a parser exception (e.g., date parsing crash or division by zero in UDF).</li>\n<li><strong>Poison Pill Partition</strong>: A partition causes an unrecoverable executor crash (SIGSEGV in C library or native OOM).</li>\n<li><strong>Network Timeouts</strong>: Reducer unable to fetch shuffle files from a dead worker node.</li>\n<li><strong>Fix</strong>: Inspect Driver logs and Executor stderr logs for the specific stack trace of the failed task index.</li>\n</ol>", "raw_answer": "This occurs when a single task fails repeatedly across 4 retries (`spark.task.maxFailures = 4`).\n\n**Common Root Causes:**\n1. **Data Corruption / Malformed Records**: A specific row causes a parser exception (e.g., date parsing crash or division by zero in UDF).\n2. **Poison Pill Partition**: A partition causes an unrecoverable executor crash (SIGSEGV in C library or native OOM).\n3. **Network Timeouts**: Reducer unable to fetch shuffle files from a dead worker node.\n4. **Fix**: Inspect Driver logs and Executor stderr logs for the specific stack trace of the failed task index."}, {"id": 95, "question": "What is Blacklisting / Node Decommissioning in Spark?", "difficulty": "Advanced", "category": "Troubleshooting & Spark UI", "answer_html": "<ul class=\"bullet-list\">\n<li><strong>Blacklisting (<code class=\"inline-code\">spark.blacklist.enabled=true</code>)</strong>:</li>\n<li>Automatically identifies problematic executors or physical worker nodes that fail multiple tasks.</li>\n<li>Temporarily avoids scheduling tasks on blacklisted nodes.</li>\n<li><strong>Node Decommissioning (Spark 3.1+)</strong>:</li>\n<li>Cloud spot/preemptible instances give a 30-120 second warning before termination.</li>\n<li>Spark gracefully migrates cached data and active shuffle files off the preempted node to healthy executors before the instance shuts down, preventing stage recomputation.</li>\n</ul>", "raw_answer": "- **Blacklisting (`spark.blacklist.enabled=true`)**:\n  - Automatically identifies problematic executors or physical worker nodes that fail multiple tasks.\n  - Temporarily avoids scheduling tasks on blacklisted nodes.\n- **Node Decommissioning (Spark 3.1+)**:\n  - Cloud spot/preemptible instances give a 30-120 second warning before termination.\n  - Spark gracefully migrates cached data and active shuffle files off the preempted node to healthy executors before the instance shuts down, preventing stage recomputation."}, {"id": 96, "question": "What is the difference between Client Mode and Cluster Mode in Spark deployment?", "difficulty": "Intermediate", "category": "Troubleshooting & Spark UI", "answer_html": "<div class=\"table-container\"><table class=\"data-table\">\n<thead><tr>\n<th>Mode</th>\n<th>Driver Location</th>\n<th>Best For</th>\n</tr></thead><tbody>\n<tr>\n<td><strong>Client Mode</strong></td>\n<td>Runs on the client machine submitting the job (e.g., developer laptop, edge gateway node)</td>\n<td>Interactive notebooks (Jupyter, Databricks interactive sessions), debugging</td>\n</tr>\n<tr>\n<td><strong>Cluster Mode</strong></td>\n<td>Runs inside an Application Master container allocated on a worker node in the cluster</td>\n<td>Production scheduled jobs, Airflow pipelines, automated CI/CD runs</td>\n</tr>\n</tbody>\n</table></div>\n<p class=\"prose-p\"><em>Production Recommendation</em>: Always use <strong>Cluster Mode</strong> in production so that network disconnection between your client machine and the cluster does not kill the running job.</p>", "raw_answer": "| Mode | Driver Location | Best For |\n| :--- | :--- | :--- |\n| **Client Mode** | Runs on the client machine submitting the job (e.g., developer laptop, edge gateway node) | Interactive notebooks (Jupyter, Databricks interactive sessions), debugging |\n| **Cluster Mode** | Runs inside an Application Master container allocated on a worker node in the cluster | Production scheduled jobs, Airflow pipelines, automated CI/CD runs |\n\n*Production Recommendation*: Always use **Cluster Mode** in production so that network disconnection between your client machine and the cluster does not kill the running job."}, {"id": 97, "question": "How do you optimize PySpark writes for high performance and clean partitions?", "difficulty": "Advanced", "category": "Troubleshooting & Spark UI", "answer_html": "<p class=\"prose-p\"><strong>Production PySpark write best practices:</strong></p>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\"># 1. Avoid over-partitioning: coalesce to reasonable partition count\n# 2. Partition on low-cardinality columns\n# 3. Use Parquet / Delta with Snappy compression\ndf.coalesce(20) \\\n  .write \\\n  .format(&quot;parquet&quot;) \\\n  .mode(&quot;overwrite&quot;) \\\n  .partitionBy(&quot;event_date&quot;) \\\n  .option(&quot;compression&quot;, &quot;snappy&quot;) \\\n  .save(&quot;s3://analytics-bucket/gold/events&quot;)</code></pre></div>", "raw_answer": "**Production PySpark write best practices:**\n\n```python\n# 1. Avoid over-partitioning: coalesce to reasonable partition count\n# 2. Partition on low-cardinality columns\n# 3. Use Parquet / Delta with Snappy compression\ndf.coalesce(20) \\\n  .write \\\n  .format(\"parquet\") \\\n  .mode(\"overwrite\") \\\n  .partitionBy(\"event_date\") \\\n  .option(\"compression\", \"snappy\") \\\n  .save(\"s3://analytics-bucket/gold/events\")\n```"}, {"id": 98, "question": "What is the Broadcast Timeout error and how do you resolve it?", "difficulty": "Intermediate", "category": "Troubleshooting & Spark UI", "answer_html": "<p class=\"prose-p\"><strong>Error</strong>: <code class=\"inline-code\">org.apache.spark.SparkException: Could not execute broadcast in 300 secs</code>.</p>\n<p class=\"prose-p\"><strong>Root Cause:</strong></p>\n<p class=\"prose-p\">Spark attempts to broadcast a table exceeding the default timeout (<code class=\"inline-code\">spark.sql.broadcastTimeout = 300</code> seconds). Either the table is too large for the driver to collect and serialize, or the network is congested.</p>\n<p class=\"prose-p\"><strong>Fixes:</strong></p>\n<ol class=\"ordered-list\">\n<li>Increase timeout: <code class=\"inline-code\">spark.conf.set(\"spark.sql.broadcastTimeout\", \"600\")</code>.</li>\n<li>Disable broadcast join for that specific query: remove the broadcast hint and allow Sort Merge Join.</li>\n<li>Check table statistics: ensure Catalyst did not underestimate table size.</li>\n</ol>", "raw_answer": "**Error**: `org.apache.spark.SparkException: Could not execute broadcast in 300 secs`.\n\n**Root Cause:**\nSpark attempts to broadcast a table exceeding the default timeout (`spark.sql.broadcastTimeout = 300` seconds). Either the table is too large for the driver to collect and serialize, or the network is congested.\n\n**Fixes:**\n1. Increase timeout: `spark.conf.set(\"spark.sql.broadcastTimeout\", \"600\")`.\n2. Disable broadcast join for that specific query: remove the broadcast hint and allow Sort Merge Join.\n3. Check table statistics: ensure Catalyst did not underestimate table size."}, {"id": 99, "question": "How do you securely handle secrets and credentials in PySpark pipelines?", "difficulty": "Advanced", "category": "Troubleshooting & Spark UI", "answer_html": "<p class=\"prose-p\"><strong>Security Best Practices:</strong></p>\n<ol class=\"ordered-list\">\n<li><strong>Never hardcode secrets</strong> in Python scripts or Git repositories.</li>\n<li>Use cloud secret managers:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>Azure Key Vault via Databricks Secret Scopes (<code class=\"inline-code\">dbutils.secrets.get()</code>).</li>\n<li>AWS Secrets Manager / Parameter Store.</li>\n<li>HashiCorp Vault.</li>\n</ul>\n<ol class=\"ordered-list\">\n<li>Use <strong>IAM Roles / Managed Identities</strong> (e.g., AWS IAM Instance Profiles or Azure Workload Identity) so Spark executors authenticate to cloud storage automatically without static access keys.</li>\n</ol>", "raw_answer": "**Security Best Practices:**\n1. **Never hardcode secrets** in Python scripts or Git repositories.\n2. Use cloud secret managers:\n   - Azure Key Vault via Databricks Secret Scopes (`dbutils.secrets.get()`).\n   - AWS Secrets Manager / Parameter Store.\n   - HashiCorp Vault.\n3. Use **IAM Roles / Managed Identities** (e.g., AWS IAM Instance Profiles or Azure Workload Identity) so Spark executors authenticate to cloud storage automatically without static access keys."}, {"id": 100, "question": "Summarize the Top 5 Golden Rules of PySpark Performance Tuning.", "difficulty": "Advanced", "category": "Troubleshooting & Spark UI", "answer_html": "<p class=\"prose-p\"><strong>The 5 Golden Rules:</strong></p>\n<ol class=\"ordered-list\">\n<li><strong>Leverage Catalyst &amp; Tungsten</strong>: Use DataFrames, Spark SQL, and built-in functions; avoid Python row-level UDFs and RDDs.</li>\n<li><strong>Eliminate Unnecessary Shuffles</strong>: Use Broadcast Joins for small lookup tables; bucket large tables that join frequently.</li>\n<li><strong>Enable Adaptive Query Execution (AQE)</strong>: Set <code class=\"inline-code\">spark.sql.adaptive.enabled = true</code> to let Spark coalesce partitions, handle skew, and convert joins dynamically.</li>\n<li><strong>Size Partitions Appropriately</strong>: Aim for 100 MB - 200 MB per partition; use <code class=\"inline-code\">coalesce()</code> to reduce partition count before writing to storage.</li>\n<li><strong>Monitor via Spark UI</strong>: Regularly inspect GC time, shuffle read/write sizes, and task duration percentiles to detect stragglers and memory spills early.</li>\n</ol>", "raw_answer": "**The 5 Golden Rules:**\n\n1. **Leverage Catalyst & Tungsten**: Use DataFrames, Spark SQL, and built-in functions; avoid Python row-level UDFs and RDDs.\n2. **Eliminate Unnecessary Shuffles**: Use Broadcast Joins for small lookup tables; bucket large tables that join frequently.\n3. **Enable Adaptive Query Execution (AQE)**: Set `spark.sql.adaptive.enabled = true` to let Spark coalesce partitions, handle skew, and convert joins dynamically.\n4. **Size Partitions Appropriately**: Aim for 100 MB - 200 MB per partition; use `coalesce()` to reduce partition count before writing to storage.\n5. **Monitor via Spark UI**: Regularly inspect GC time, shuffle read/write sizes, and task duration percentiles to detect stragglers and memory spills early."}, {"id": 101, "question": "What is the difference between the Databricks Control Plane and Data Plane?", "difficulty": "Intermediate", "category": "Databricks & Lakehouse Platform", "answer_html": "<p class=\"prose-p\">Databricks separates its architecture into two distinct planes:</p>\n<ol class=\"ordered-list\">\n<li><strong>Control Plane</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>Resides in the Databricks cloud account.</li>\n<li>Houses the web UI, notebook code/metadata, cluster orchestration engines, Databricks Workflows scheduler, and Unity Catalog metadata service.</li>\n<li>Does <strong>not</strong> process or store raw customer business data.</li>\n</ul>\n<ol class=\"ordered-list\">\n<li><strong>Data Plane</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li><strong>Classic Data Plane</strong>: Resides within the customer's cloud account (VPC / VNet). Hosts the compute clusters (Driver and Worker VMs) and directly reads/writes physical data files in cloud object storage (S3/ADLS/GCS).</li>\n<li><strong>Serverless Data Plane</strong>: Managed inside secure, isolated compute environments in Databricks' cloud perimeter. Boots in seconds, autoscales rapidly, and eliminates cluster configuration overhead.</li>\n</ul>", "raw_answer": "Databricks separates its architecture into two distinct planes:\n\n1. **Control Plane**:\n   - Resides in the Databricks cloud account.\n   - Houses the web UI, notebook code/metadata, cluster orchestration engines, Databricks Workflows scheduler, and Unity Catalog metadata service.\n   - Does **not** process or store raw customer business data.\n\n2. **Data Plane**:\n   - **Classic Data Plane**: Resides within the customer's cloud account (VPC / VNet). Hosts the compute clusters (Driver and Worker VMs) and directly reads/writes physical data files in cloud object storage (S3/ADLS/GCS).\n   - **Serverless Data Plane**: Managed inside secure, isolated compute environments in Databricks' cloud perimeter. Boots in seconds, autoscales rapidly, and eliminates cluster configuration overhead."}, {"id": 102, "question": "Explain Unity Catalog and its 3-level namespace hierarchy.", "difficulty": "Intermediate", "category": "Databricks & Lakehouse Platform", "answer_html": "<p class=\"prose-p\"><strong>Unity Catalog</strong> is Databricks' centralized data and AI governance layer across multi-cloud environments.</p>\n<p class=\"prose-p\"><strong>3-Level Namespace Structure</strong>:</p>\n<p class=\"prose-p\"><code class=\"inline-code\">catalog.schema.table_or_volume</code></p>\n<ol class=\"ordered-list\">\n<li><strong>Metastore</strong>: Top-level container per cloud region storing all governance metadata.</li>\n<li><strong>Catalog</strong>: First level of namespace isolation. Typically used for environment separation (<code class=\"inline-code\">dev</code>, <code class=\"inline-code\">staging</code>, <code class=\"inline-code\">prod</code>) or business units (<code class=\"inline-code\">finance</code>, <code class=\"inline-code\">marketing</code>).</li>\n<li><strong>Schema (Database)</strong>: Logical grouping of tables, views, and volumes (<code class=\"inline-code\">raw</code>, <code class=\"inline-code\">silver</code>, <code class=\"inline-code\">gold</code>).</li>\n<li><strong>Table / Volume / Model</strong>: Data assets:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li><strong>Tables</strong>: Tabular data backed by Delta Lake.</li>\n<li><strong>Volumes</strong>: Governance for non-tabular files (CSV, JSON, audio, images).</li>\n</ul>\n<p class=\"prose-p\"><em>Key Advantage</em>: Replaces legacy Hive Metastore 2-level namespace (<code class=\"inline-code\">database.table</code>), enabling centralized access permissions, cross-workspace sharing, and automated data lineage.</p>", "raw_answer": "**Unity Catalog** is Databricks' centralized data and AI governance layer across multi-cloud environments.\n\n**3-Level Namespace Structure**:\n`catalog.schema.table_or_volume`\n\n1. **Metastore**: Top-level container per cloud region storing all governance metadata.\n2. **Catalog**: First level of namespace isolation. Typically used for environment separation (`dev`, `staging`, `prod`) or business units (`finance`, `marketing`).\n3. **Schema (Database)**: Logical grouping of tables, views, and volumes (`raw`, `silver`, `gold`).\n4. **Table / Volume / Model**: Data assets:\n   - **Tables**: Tabular data backed by Delta Lake.\n   - **Volumes**: Governance for non-tabular files (CSV, JSON, audio, images).\n\n*Key Advantage*: Replaces legacy Hive Metastore 2-level namespace (`database.table`), enabling centralized access permissions, cross-workspace sharing, and automated data lineage."}, {"id": 103, "question": "What is the difference between Managed Tables, External Tables, and Volumes in Unity Catalog?", "difficulty": "Intermediate", "category": "Databricks & Lakehouse Platform", "answer_html": "<div class=\"table-container\"><table class=\"data-table\">\n<thead><tr>\n<th>Asset Type</th>\n<th>Storage Location</th>\n<th>Metadata Control</th>\n<th>On <code class=\"inline-code\">DROP</code> Command</th>\n</tr></thead><tbody>\n<tr>\n<td><strong>Managed Table</strong></td>\n<td>Default Unity Catalog root storage path</td>\n<td>Unity Catalog</td>\n<td><strong>Deletes both</strong> metadata and physical data files on storage.</td>\n</tr>\n<tr>\n<td><strong>External Table</strong></td>\n<td>Customer-specified cloud storage path (<code class=\"inline-code\">LOCATION 's3://...'</code>)</td>\n<td>Unity Catalog</td>\n<td>Deletes <strong>only metadata</strong>; underlying files remain on cloud storage.</td>\n</tr>\n<tr>\n<td><strong>Volume (Managed/External)</strong></td>\n<td>Governed file storage for unstructured data</td>\n<td>Unity Catalog</td>\n<td>Governs access to non-tabular raw files (images, raw JSON/CSV, ML weights).</td>\n</tr>\n</tbody>\n</table></div>\n<p class=\"prose-p\"><em>Best Practice</em>: Use <strong>Managed Tables</strong> as default for Lakehouse tables to leverage automatic maintenance, predictive optimization, and full governance.</p>", "raw_answer": "| Asset Type | Storage Location | Metadata Control | On `DROP` Command |\n| :--- | :--- | :--- | :--- |\n| **Managed Table** | Default Unity Catalog root storage path | Unity Catalog | **Deletes both** metadata and physical data files on storage. |\n| **External Table** | Customer-specified cloud storage path (`LOCATION 's3://...'`) | Unity Catalog | Deletes **only metadata**; underlying files remain on cloud storage. |\n| **Volume (Managed/External)** | Governed file storage for unstructured data | Unity Catalog | Governs access to non-tabular raw files (images, raw JSON/CSV, ML weights). |\n\n*Best Practice*: Use **Managed Tables** as default for Lakehouse tables to leverage automatic maintenance, predictive optimization, and full governance."}, {"id": 104, "question": "What is Liquid Clustering in Databricks Delta Lake, and how does it outperform Partitioning & Z-Ordering?", "difficulty": "Advanced", "category": "Databricks & Lakehouse Platform", "answer_html": "<p class=\"prose-p\"><strong>Liquid Clustering</strong> (<code class=\"inline-code\">CLUSTER BY</code>) is Databricks' modern data layout optimization algorithm that replaces traditional Hive-style partitioning and Z-Ordering.</p>\n<p class=\"prose-p\"><strong>Why Traditional Methods Fall Short:</strong></p>\n<ul class=\"bullet-list\">\n<li>Hive partitioning requires low cardinality; high cardinality creates millions of tiny files.</li>\n<li>Z-Ordering requires expensive, full table rewrites during <code class=\"inline-code\">OPTIMIZE ... ZORDER BY</code>.</li>\n</ul>\n<p class=\"prose-p\"><strong>Advantages of Liquid Clustering:</strong></p>\n<ol class=\"ordered-list\">\n<li><strong>Handles Any Cardinality</strong>: Works seamlessly on low, medium, and high cardinality columns.</li>\n<li><strong>Incremental Clustering</strong>: New data is clustered incrementally without rewriting historical files.</li>\n<li><strong>Flexible Clustering Keys</strong>: You can change clustering keys on existing tables (<code class=\"inline-code\">ALTER TABLE ... CLUSTER BY (...)</code>) instantly without table rewrites.</li>\n<li><strong>Prevents Data Skew</strong>: Distributes data evenly across cluster blocks without rigid folder directory nesting.</li>\n</ol>", "raw_answer": "**Liquid Clustering** (`CLUSTER BY`) is Databricks' modern data layout optimization algorithm that replaces traditional Hive-style partitioning and Z-Ordering.\n\n**Why Traditional Methods Fall Short:**\n- Hive partitioning requires low cardinality; high cardinality creates millions of tiny files.\n- Z-Ordering requires expensive, full table rewrites during `OPTIMIZE ... ZORDER BY`.\n\n**Advantages of Liquid Clustering:**\n1. **Handles Any Cardinality**: Works seamlessly on low, medium, and high cardinality columns.\n2. **Incremental Clustering**: New data is clustered incrementally without rewriting historical files.\n3. **Flexible Clustering Keys**: You can change clustering keys on existing tables (`ALTER TABLE ... CLUSTER BY (...)`) instantly without table rewrites.\n4. **Prevents Data Skew**: Distributes data evenly across cluster blocks without rigid folder directory nesting."}, {"id": 105, "question": "What is Photon Engine, and how does it differ from Apache Spark's Tungsten engine?", "difficulty": "Advanced", "category": "Databricks & Lakehouse Platform", "answer_html": "<p class=\"prose-p\"><strong>Photon</strong> is Databricks' vectorized query execution engine written entirely in <strong>native C++</strong>:</p>\n<div class=\"table-container\"><table class=\"data-table\">\n<thead><tr>\n<th>Dimension</th>\n<th>Spark Tungsten Engine</th>\n<th>Photon Engine</th>\n</tr></thead><tbody>\n<tr>\n<td><strong>Language</strong></td>\n<td>Java Bytecode (JVM)</td>\n<td>Native C++</td>\n</tr>\n<tr>\n<td><strong>Execution Model</strong></td>\n<td>Whole-Stage Code Generation (Java loop)</td>\n<td>Vectorized SIMD processing on CPU registers</td>\n</tr>\n<tr>\n<td><strong>Memory Management</strong></td>\n<td>Mixed JVM Heap + Off-Heap unsafe</td>\n<td>100% direct native memory; zero JVM GC</td>\n</tr>\n<tr>\n<td><strong>Speedup</strong></td>\n<td>Standard baseline</td>\n<td>2x - 8x faster for joins, aggregations, scans</td>\n</tr>\n<tr>\n<td><strong>Fallback</strong></td>\n<td>N/A</td>\n<td>Transparent fallback to Spark JVM if unsupported</td>\n</tr>\n</tbody>\n</table></div>\n<p class=\"prose-p\"><em>Workload Fit</em>: Excellent for SQL queries, large aggregations, Parquet/Delta scanning, and Databricks SQL Warehouses.</p>", "raw_answer": "**Photon** is Databricks' vectorized query execution engine written entirely in **native C++**:\n\n| Dimension | Spark Tungsten Engine | Photon Engine |\n| :--- | :--- | :--- |\n| **Language** | Java Bytecode (JVM) | Native C++ |\n| **Execution Model** | Whole-Stage Code Generation (Java loop) | Vectorized SIMD processing on CPU registers |\n| **Memory Management** | Mixed JVM Heap + Off-Heap unsafe | 100% direct native memory; zero JVM GC |\n| **Speedup** | Standard baseline | 2x - 8x faster for joins, aggregations, scans |\n| **Fallback** | N/A | Transparent fallback to Spark JVM if unsupported |\n\n*Workload Fit*: Excellent for SQL queries, large aggregations, Parquet/Delta scanning, and Databricks SQL Warehouses."}, {"id": 106, "question": "What is Delta Live Tables (DLT), and what are DLT Expectations?", "difficulty": "Intermediate", "category": "Databricks & Lakehouse Platform", "answer_html": "<p class=\"prose-p\"><strong>Delta Live Tables (DLT)</strong> is a declarative framework for building reliable ETL pipelines with automated infrastructure management and data quality monitoring.</p>\n<p class=\"prose-p\"><strong>DLT Expectations (Data Quality Rules):</strong></p>\n<ol class=\"ordered-list\">\n<li><strong><code class=\"inline-code\">@dlt.expect(name, condition)</code></strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>Logs quality violation metrics into the event log.</li>\n<li>Records are <strong>retained</strong> in the target dataset.</li>\n</ul>\n<ol class=\"ordered-list\">\n<li><strong><code class=\"inline-code\">@dlt.expect_or_drop(name, condition)</code></strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>Logs quality violation metrics.</li>\n<li>Violating records are <strong>filtered out and dropped</strong>.</li>\n</ul>\n<ol class=\"ordered-list\">\n<li><strong><code class=\"inline-code\">@dlt.expect_or_fail(name, condition)</code></strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>If even a single violating record is encountered, the pipeline <strong>fails immediately and halts</strong>.</li>\n</ul>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">@dlt.table\n@dlt.expect_or_drop(&quot;valid_price&quot;, &quot;price &gt; 0&quot;)\ndef clean_orders():\n    return dlt.read_stream(&quot;raw_orders&quot;)</code></pre></div>", "raw_answer": "**Delta Live Tables (DLT)** is a declarative framework for building reliable ETL pipelines with automated infrastructure management and data quality monitoring.\n\n**DLT Expectations (Data Quality Rules):**\n1. **`@dlt.expect(name, condition)`**:\n   - Logs quality violation metrics into the event log.\n   - Records are **retained** in the target dataset.\n2. **`@dlt.expect_or_drop(name, condition)`**:\n   - Logs quality violation metrics.\n   - Violating records are **filtered out and dropped**.\n3. **`@dlt.expect_or_fail(name, condition)`**:\n   - If even a single violating record is encountered, the pipeline **fails immediately and halts**.\n\n```python\n@dlt.table\n@dlt.expect_or_drop(\"valid_price\", \"price > 0\")\ndef clean_orders():\n    return dlt.read_stream(\"raw_orders\")\n```"}, {"id": 107, "question": "What is Databricks Auto Loader (`cloudFiles`), and how does it discover new files?", "difficulty": "Intermediate", "category": "Databricks & Lakehouse Platform", "answer_html": "<p class=\"prose-p\"><strong>Auto Loader</strong> efficiently ingests millions of incoming files from cloud storage into Delta Lake incrementally.</p>\n<p class=\"prose-p\"><strong>Discovery Modes:</strong></p>\n<ol class=\"ordered-list\">\n<li><strong>Directory Listing</strong>: Scans cloud directories using lexical order sorting. Efficient for small to medium scale (up to millions of files).</li>\n<li><strong>File Notification</strong>: Sets up cloud event queues (AWS SQS, Azure Event Grid, GCP Pub/Sub). As files land in S3/ADLS, notification events trigger ingestion without directory scanning.</li>\n</ol>\n<p class=\"prose-p\"><strong>Key Features:</strong></p>\n<ul class=\"bullet-list\">\n<li><strong><code class=\"inline-code\">_rescued_data</code></strong>: Rescues unparsed or schema-mismatched columns into a JSON column instead of dropping records.</li>\n<li><strong>Automatic Schema Evolution</strong>: Automatically detects new columns and updates the Delta table schema.</li>\n</ul>", "raw_answer": "**Auto Loader** efficiently ingests millions of incoming files from cloud storage into Delta Lake incrementally.\n\n**Discovery Modes:**\n1. **Directory Listing**: Scans cloud directories using lexical order sorting. Efficient for small to medium scale (up to millions of files).\n2. **File Notification**: Sets up cloud event queues (AWS SQS, Azure Event Grid, GCP Pub/Sub). As files land in S3/ADLS, notification events trigger ingestion without directory scanning.\n\n**Key Features:**\n- **`_rescued_data`**: Rescues unparsed or schema-mismatched columns into a JSON column instead of dropping records.\n- **Automatic Schema Evolution**: Automatically detects new columns and updates the Delta table schema."}, {"id": 108, "question": "What is the difference between Job Clusters and All-Purpose Clusters in Databricks?", "difficulty": "Intermediate", "category": "Databricks & Lakehouse Platform", "answer_html": "<div class=\"table-container\"><table class=\"data-table\">\n<thead><tr>\n<th>Feature</th>\n<th>All-Purpose Cluster</th>\n<th>Job Cluster (Automated)</th>\n</tr></thead><tbody>\n<tr>\n<td><strong>Intended Use</strong></td>\n<td>Interactive exploration, notebooks, ad-hoc analysis</td>\n<td>Production scheduled workflows, automated jobs</td>\n</tr>\n<tr>\n<td><strong>Lifecycle</strong></td>\n<td>Remains active until manual stop or auto-terminate timeout</td>\n<td>Spun up when job starts; terminated immediately when job finishes</td>\n</tr>\n<tr>\n<td><strong>Cost (DBUs)</strong></td>\n<td>Higher DBU rate (~2x more expensive per core/hour)</td>\n<td>Discounted DBU rate (~50% cheaper)</td>\n</tr>\n<tr>\n<td><strong>Isolation</strong></td>\n<td>Shared among team members; state persists</td>\n<td>Dedicated to single job run; clean isolated environment</td>\n</tr>\n</tbody>\n</table></div>\n<p class=\"prose-p\"><em>Production Standard</em>: Always run scheduled production workloads on <strong>Job Clusters</strong> or <strong>Serverless Compute</strong> to minimize DBU spend.</p>", "raw_answer": "| Feature | All-Purpose Cluster | Job Cluster (Automated) |\n| :--- | :--- | :--- |\n| **Intended Use** | Interactive exploration, notebooks, ad-hoc analysis | Production scheduled workflows, automated jobs |\n| **Lifecycle** | Remains active until manual stop or auto-terminate timeout | Spun up when job starts;
