le partitions, then join and remove salt.</li>\n<li><strong>Adaptive Query Execution (AQE)</strong>: Set <code class=\"inline-code\">spark.sql.adaptive.skewJoin.enabled = true</code>. Spark automatically splits skewed partitions into smaller sub-partitions during runtime.</li>\n<li><strong>Broadcast Join</strong>: If the non-skewed table is small, broadcast it to eliminate shuffle altogether.</li>\n</ol>", "raw_answer": "**Data Skew** occurs when data is disproportionately distributed across keys, causing one or few partitions to be much larger than others.\n\n**How to Spot in Spark UI:**\n- In the **Stages Tab**, inspect the **Task Metrics Table** (Min, 25th percentile, Median, 75th percentile, Max).\n- If 99 tasks complete in 5 seconds (Median = 5s), but 1 single task takes 25 minutes (Max = 25m), the job is suffering from Data Skew.\n\n**How to Resolve Data Skew:**\n1. **Salting**: Append random integer prefixes (e.g., `key_0`, `key_1`, ..., `key_k`) to skewed keys to spread data across multiple partitions, then join and remove salt.\n2. **Adaptive Query Execution (AQE)**: Set `spark.sql.adaptive.skewJoin.enabled = true`. Spark automatically splits skewed partitions into smaller sub-partitions during runtime.\n3. **Broadcast Join**: If the non-skewed table is small, broadcast it to eliminate shuffle altogether."}, {"id": 24, "question": "Explain the Salting technique with a concrete PySpark example.", "difficulty": "Advanced", "category": "Partitioning, Shuffling & Skew", "answer_html": "<p class=\"prose-p\">Salting distributes a single hot key across multiple partitions by appending random numbers to the key.</p>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">from pyspark.sql import functions as F\n\n# 1. Large skewed table: add salt column (0 to 4)\nSALT_FACTOR = 5\ndf_large_salted = df_large.withColumn(&quot;salt&quot;, F.concat(F.col(&quot;skewed_key&quot;), F.lit(&quot;_&quot;), F.floor(F.rand() * SALT_FACTOR)))\n\n# 2. Small lookup table: explode salt factor to match all possible salts\ndf_small_expanded = df_small.withColumn(&quot;salt_factor&quot;, F.array([F.lit(i) for i in range(SALT_FACTOR)])) \\\n                            .withColumn(&quot;salt_factor&quot;, F.explode(&quot;salt_factor&quot;)) \\\n                            .withColumn(&quot;salt&quot;, F.concat(F.col(&quot;join_key&quot;), F.lit(&quot;_&quot;), F.col(&quot;salt_factor&quot;)))\n\n# 3. Join on the salted key (distributes load across 5 partitions evenly)\ndf_joined = df_large_salted.join(df_small_expanded, on=&quot;salt&quot;, how=&quot;inner&quot;) \\\n                           .drop(&quot;salt&quot;, &quot;salt_factor&quot;)</code></pre></div>", "raw_answer": "Salting distributes a single hot key across multiple partitions by appending random numbers to the key.\n\n```python\nfrom pyspark.sql import functions as F\n\n# 1. Large skewed table: add salt column (0 to 4)\nSALT_FACTOR = 5\ndf_large_salted = df_large.withColumn(\"salt\", F.concat(F.col(\"skewed_key\"), F.lit(\"_\"), F.floor(F.rand() * SALT_FACTOR)))\n\n# 2. Small lookup table: explode salt factor to match all possible salts\ndf_small_expanded = df_small.withColumn(\"salt_factor\", F.array([F.lit(i) for i in range(SALT_FACTOR)])) \\\n                            .withColumn(\"salt_factor\", F.explode(\"salt_factor\")) \\\n                            .withColumn(\"salt\", F.concat(F.col(\"join_key\"), F.lit(\"_\"), F.col(\"salt_factor\")))\n\n# 3. Join on the salted key (distributes load across 5 partitions evenly)\ndf_joined = df_large_salted.join(df_small_expanded, on=\"salt\", how=\"inner\") \\\n                           .drop(\"salt\", \"salt_factor\")\n```"}, {"id": 25, "question": "What is `spark.sql.shuffle.partitions`, and how do you tune it?", "difficulty": "Intermediate", "category": "Partitioning, Shuffling & Skew", "answer_html": "<p class=\"prose-p\"><code class=\"inline-code\">spark.sql.shuffle.partitions</code> configures the default number of partitions created when shuffling data for joins or aggregations. The default value is <strong>200</strong>.</p>\n<p class=\"prose-p\"><strong>When 200 is Bad:</strong></p>\n<ul class=\"bullet-list\">\n<li><strong>Too small</strong>: On large datasets (e.g., 500 GB), each partition will be 2.5 GB. Tasks will exceed memory and spill to disk or cause OOM errors.</li>\n<li><strong>Too large</strong>: On small datasets (e.g., 100 MB), each partition is tiny (sub-megabyte). The cluster wastes CPU cycles scheduling thousands of trivial tasks.</li>\n</ul>\n<p class=\"prose-p\"><strong>Tuning Guidelines:</strong></p>\n<ul class=\"bullet-list\">\n<li>Target <strong>100MB \u2013 200MB</strong> compressed data size per partition.</li>\n<li>Formula: <code class=\"inline-code\">Total Shuffle Input Size / 128 MB</code>.</li>\n<li>In Spark 3.x, enable <strong>Adaptive Query Execution (AQE)</strong>:</li>\n</ul>\n<p class=\"prose-p\"><code class=\"inline-code\">spark.sql.adaptive.coalescePartitions.enabled = true</code></p>\n<p class=\"prose-p\">Spark automatically coalesces shuffle partitions to the target size.</p>", "raw_answer": "`spark.sql.shuffle.partitions` configures the default number of partitions created when shuffling data for joins or aggregations. The default value is **200**.\n\n**When 200 is Bad:**\n- **Too small**: On large datasets (e.g., 500 GB), each partition will be 2.5 GB. Tasks will exceed memory and spill to disk or cause OOM errors.\n- **Too large**: On small datasets (e.g., 100 MB), each partition is tiny (sub-megabyte). The cluster wastes CPU cycles scheduling thousands of trivial tasks.\n\n**Tuning Guidelines:**\n- Target **100MB \u2013 200MB** compressed data size per partition.\n- Formula: `Total Shuffle Input Size / 128 MB`.\n- In Spark 3.x, enable **Adaptive Query Execution (AQE)**:\n  `spark.sql.adaptive.coalescePartitions.enabled = true`\n  Spark automatically coalesces shuffle partitions to the target size."}, {"id": 26, "question": "What is the difference between Hash Partitioning and Range Partitioning?", "difficulty": "Intermediate", "category": "Partitioning, Shuffling & Skew", "answer_html": "<p class=\"prose-p\">Spark supports two main partitioning algorithms:</p>\n<ol class=\"ordered-list\">\n<li><strong>Hash Partitioning</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>Computes <code class=\"inline-code\">partition = hash(key) % numPartitions</code>.</li>\n<li>Distributes rows with matching keys into the same partition.</li>\n<li>Ideal for equality comparisons, <code class=\"inline-code\">groupBy()</code>, and equality joins.</li>\n<li>Can cause skew if one key has disproportionate row counts.</li>\n</ul>\n<ol class=\"ordered-list\">\n<li><strong>Range Partitioning</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>Determines partition boundaries based on ordered value ranges (e.g., A-D, E-K, L-Z).</li>\n<li>Requires an initial sampling step to calculate balanced split points.</li>\n<li>Ideal for sorting operations (<code class=\"inline-code\">orderBy()</code>, <code class=\"inline-code\">sort()</code>) and range queries (<code class=\"inline-code\">BETWEEN a AND b</code>).</li>\n</ul>", "raw_answer": "Spark supports two main partitioning algorithms:\n\n1. **Hash Partitioning**:\n   - Computes `partition = hash(key) % numPartitions`.\n   - Distributes rows with matching keys into the same partition.\n   - Ideal for equality comparisons, `groupBy()`, and equality joins.\n   - Can cause skew if one key has disproportionate row counts.\n\n2. **Range Partitioning**:\n   - Determines partition boundaries based on ordered value ranges (e.g., A-D, E-K, L-Z).\n   - Requires an initial sampling step to calculate balanced split points.\n   - Ideal for sorting operations (`orderBy()`, `sort()`) and range queries (`BETWEEN a AND b`)."}, {"id": 27, "question": "What is Partition Pruning (Static vs Dynamic)?", "difficulty": "Intermediate", "category": "Partitioning, Shuffling & Skew", "answer_html": "<p class=\"prose-p\"><strong>Partition Pruning</strong> skips reading directories on storage that do not match query filter predicates.</p>\n<ol class=\"ordered-list\">\n<li><strong>Static Partition Pruning (SPP)</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>Spark determines filtered partitions at compile time from literal filter clauses.</li>\n<li>Example: <code class=\"inline-code\">WHERE date = '2026-10-10'</code>. Spark reads only the <code class=\"inline-code\">date=2026-10-10</code> folder.</li>\n</ul>\n<ol class=\"ordered-list\">\n<li><strong>Dynamic Partition Pruning (DPP - Spark 3.0+)</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>Evaluates filter conditions derived from a dimension table join at runtime.</li>\n<li>Example: Fact table joined with <code class=\"inline-code\">DimDate</code> where <code class=\"inline-code\">DimDate.year = 2026</code>.</li>\n<li>Spark computes matching dates from <code class=\"inline-code\">DimDate</code>, broadcasts them as a dynamic filter, and prunes fact table partitions before scanning the fact table files.</li>\n</ul>", "raw_answer": "**Partition Pruning** skips reading directories on storage that do not match query filter predicates.\n\n1. **Static Partition Pruning (SPP)**:\n   - Spark determines filtered partitions at compile time from literal filter clauses.\n   - Example: `WHERE date = '2026-10-10'`. Spark reads only the `date=2026-10-10` folder.\n\n2. **Dynamic Partition Pruning (DPP - Spark 3.0+)**:\n   - Evaluates filter conditions derived from a dimension table join at runtime.\n   - Example: Fact table joined with `DimDate` where `DimDate.year = 2026`.\n   - Spark computes matching dates from `DimDate`, broadcasts them as a dynamic filter, and prunes fact table partitions before scanning the fact table files."}, {"id": 28, "question": "What is Bucketing in Spark SQL, and how does it prevent shuffles?", "difficulty": "Intermediate", "category": "Partitioning, Shuffling & Skew", "answer_html": "<p class=\"prose-p\"><strong>Bucketing</strong> organizes table data into a fixed number of hash-partitioned files based on specific bucketing columns at write time.</p>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\"># Save DataFrame as bucketed table\ndf.write.format(&quot;parquet&quot;) \\\n  .bucketBy(16, &quot;customer_id&quot;) \\\n  .sortBy(&quot;order_date&quot;) \\\n  .saveAsTable(&quot;bucketed_orders&quot;)</code></pre></div>\n<p class=\"prose-p\"><strong>How it eliminates Shuffles:</strong></p>\n<ul class=\"bullet-list\">\n<li>If two tables are bucketed on their join keys with the <strong>same number of buckets</strong> (or multiples), Spark knows data for each key is already co-located in matching bucket files.</li>\n<li>Spark performs a direct <strong>Bucket-to-Bucket Sort Merge Join</strong> without shuffling data across the network.</li>\n</ul>", "raw_answer": "**Bucketing** organizes table data into a fixed number of hash-partitioned files based on specific bucketing columns at write time.\n\n```python\n# Save DataFrame as bucketed table\ndf.write.format(\"parquet\") \\\n  .bucketBy(16, \"customer_id\") \\\n  .sortBy(\"order_date\") \\\n  .saveAsTable(\"bucketed_orders\")\n```\n\n**How it eliminates Shuffles:**\n- If two tables are bucketed on their join keys with the **same number of buckets** (or multiples), Spark knows data for each key is already co-located in matching bucket files.\n- Spark performs a direct **Bucket-to-Bucket Sort Merge Join** without shuffling data across the network."}, {"id": 29, "question": "What are Stragglers in Spark, and how does Speculative Execution address them?", "difficulty": "Advanced", "category": "Partitioning, Shuffling & Skew", "answer_html": "<p class=\"prose-p\">A <strong>Straggler</strong> is a task running significantly slower than other tasks in the same stage due to faulty hardware, slow network cards, bad disks, or resource contention.</p>\n<p class=\"prose-p\"><strong>Speculative Execution (<code class=\"inline-code\">spark.speculation=true</code>):</strong></p>\n<ul class=\"bullet-list\">\n<li>Spark monitors task progress across the stage.</li>\n<li>If a task runs substantially slower than median task completion time, Spark launches a duplicate speculative copy of the task on another worker.</li>\n<li>Whichever task copy completes first commits its output, and the slower copy is killed.</li>\n</ul>\n<p class=\"prose-p\"><em>Caveat</em>: Do not enable speculation on non-idempotent sinks (e.g., custom database JDBC writes without upsert support).</p>", "raw_answer": "A **Straggler** is a task running significantly slower than other tasks in the same stage due to faulty hardware, slow network cards, bad disks, or resource contention.\n\n**Speculative Execution (`spark.speculation=true`):**\n- Spark monitors task progress across the stage.\n- If a task runs substantially slower than median task completion time, Spark launches a duplicate speculative copy of the task on another worker.\n- Whichever task copy completes first commits its output, and the slower copy is killed.\n\n*Caveat*: Do not enable speculation on non-idempotent sinks (e.g., custom database JDBC writes without upsert support)."}, {"id": 30, "question": "What is the difference between Partitioning in Storage vs Partitioning in Spark Memory?", "difficulty": "Intermediate", "category": "Partitioning, Shuffling & Skew", "answer_html": "<p class=\"prose-p\">These are two distinct concepts often confused in interviews:</p>\n<ol class=\"ordered-list\">\n<li><strong>Storage Partitioning (<code class=\"inline-code\">partitionBy</code> on write)</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>Physical folder structure on disk/S3/OneLake: <code class=\"inline-code\">year=2026/month=10/day=10/part-000.parquet</code>.</li>\n<li>Optimizes disk reading via Partition Pruning. Avoid over-partitioning (causes Small Files problem).</li>\n</ul>\n<ol class=\"ordered-list\">\n<li><strong>Spark Memory Partitioning (<code class=\"inline-code\">repartition()</code> / <code class=\"inline-code\">coalesce()</code>)</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>Logical chunks of data residing in executor memory during computation.</li>\n<li>Dictates parallelism: each partition equals one task processed by one CPU core.</li>\n<li>Sized for executor throughput (target 100-200MB per partition).</li>\n</ul>", "raw_answer": "These are two distinct concepts often confused in interviews:\n\n1. **Storage Partitioning (`partitionBy` on write)**:\n   - Physical folder structure on disk/S3/OneLake: `year=2026/month=10/day=10/part-000.parquet`.\n   - Optimizes disk reading via Partition Pruning. Avoid over-partitioning (causes Small Files problem).\n\n2. **Spark Memory Partitioning (`repartition()` / `coalesce()`)**:\n   - Logical chunks of data residing in executor memory during computation.\n   - Dictates parallelism: each partition equals one task processed by one CPU core.\n   - Sized for executor throughput (target 100-200MB per partition)."}, {"id": 31, "question": "What are the 5 Join strategies available in Spark, in order of preference?", "difficulty": "Intermediate", "category": "Joins & Query Optimization", "answer_html": "<p class=\"prose-p\">Spark evaluates join strategies in the following priority order:</p>\n<ol class=\"ordered-list\">\n<li><strong>Broadcast Hash Join (BHJ)</strong>: Broadcasts small table to all executors; no shuffle required.</li>\n<li><strong>Shuffle Hash Join (SHJ)</strong>: Shuffles both datasets on join key, builds hash table from smaller partition in memory.</li>\n<li><strong>Sort Merge Join (SMJ)</strong>: Shuffles both datasets on join key, sorts partitions by join key, and merges them. Default strategy for large-to-large joins.</li>\n<li><strong>Broadcast Nested Loop Join (BNLJ)</strong>: Fallback when join condition lacks equality (non-equi joins like <code class=\"inline-code\">&gt;</code>, <code class=\"inline-code\">&lt;</code>) and one side is small.</li>\n<li><strong>Cartesian Product Join (CPJ)</strong>: Computes cross product of all rows across both tables without join condition. Very slow ($O(M \\times N)$).</li>\n</ol>", "raw_answer": "Spark evaluates join strategies in the following priority order:\n\n1. **Broadcast Hash Join (BHJ)**: Broadcasts small table to all executors; no shuffle required.\n2. **Shuffle Hash Join (SHJ)**: Shuffles both datasets on join key, builds hash table from smaller partition in memory.\n3. **Sort Merge Join (SMJ)**: Shuffles both datasets on join key, sorts partitions by join key, and merges them. Default strategy for large-to-large joins.\n4. **Broadcast Nested Loop Join (BNLJ)**: Fallback when join condition lacks equality (non-equi joins like `>`, `<`) and one side is small.\n5. **Cartesian Product Join (CPJ)**: Computes cross product of all rows across both tables without join condition. Very slow ($O(M \\times N)$)."}, {"id": 32, "question": "How does Broadcast Hash Join (BHJ) work, and what is its threshold?", "difficulty": "Intermediate", "category": "Joins & Query Optimization", "answer_html": "<p class=\"prose-p\"><strong>Broadcast Hash Join (BHJ)</strong>:</p>\n<ul class=\"bullet-list\">\n<li>The driver downloads the small table, builds a broadcast variable, and ships the full table to every executor node.</li>\n<li>Each executor reads its local partition of the large table and joins it against the in-memory hash table.</li>\n<li>Eliminates network shuffles completely.</li>\n</ul>\n<p class=\"prose-p\"><strong>Threshold and Manual Hint:</strong></p>\n<ul class=\"bullet-list\">\n<li>Default threshold: <code class=\"inline-code\">spark.sql.autoBroadcastJoinThreshold = 10485760</code> (10 MB). Set to <code class=\"inline-code\">-1</code> to disable.</li>\n</ul>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">from pyspark.sql.functions import broadcast\n\n# Explicit broadcast hint in PySpark\ndf_joined = df_large.join(broadcast(df_small), on=&quot;customer_id&quot;, how=&quot;inner&quot;)</code></pre></div>", "raw_answer": "**Broadcast Hash Join (BHJ)**:\n- The driver downloads the small table, builds a broadcast variable, and ships the full table to every executor node.\n- Each executor reads its local partition of the large table and joins it against the in-memory hash table.\n- Eliminates network shuffles completely.\n\n**Threshold and Manual Hint:**\n- Default threshold: `spark.sql.autoBroadcastJoinThreshold = 10485760` (10 MB). Set to `-1` to disable.\n```python\nfrom pyspark.sql.functions import broadcast\n\n# Explicit broadcast hint in PySpark\ndf_joined = df_large.join(broadcast(df_small), on=\"customer_id\", how=\"inner\")\n```"}, {"id": 33, "question": "How does Sort Merge Join (SMJ) work step-by-step?", "difficulty": "Advanced", "category": "Joins & Query Optimization", "answer_html": "<p class=\"prose-p\"><strong>Sort Merge Join (SMJ)</strong> executes in three phases:</p>\n<ol class=\"ordered-list\">\n<li><strong>Shuffle Phase</strong>: Both tables are hash-partitioned on the join key. Rows with matching keys land on the same reducer executor.</li>\n<li><strong>Sort Phase</strong>: Within each partition on the reducer, Spark sorts rows in ascending order by the join key.</li>\n<li><strong>Merge Phase</strong>: Spark scans through both sorted partitions with two pointers simultaneously, matching keys in linear time ($O(N + M)$).</li>\n</ol>\n<p class=\"prose-p\"><strong>Advantage over Hash Join</strong>: Handles arbitrarily large datasets without running out of memory because data is streamed through disk-backed iterators rather than stored entirely in a memory hash table.</p>", "raw_answer": "**Sort Merge Join (SMJ)** executes in three phases:\n\n1. **Shuffle Phase**: Both tables are hash-partitioned on the join key. Rows with matching keys land on the same reducer executor.\n2. **Sort Phase**: Within each partition on the reducer, Spark sorts rows in ascending order by the join key.\n3. **Merge Phase**: Spark scans through both sorted partitions with two pointers simultaneously, matching keys in linear time ($O(N + M)$).\n\n**Advantage over Hash Join**: Handles arbitrarily large datasets without running out of memory because data is streamed through disk-backed iterators rather than stored entirely in a memory hash table."}, {"id": 34, "question": "What is Adaptive Query Execution (AQE) in Spark 3.x?", "difficulty": "Advanced", "category": "Joins & Query Optimization", "answer_html": "<p class=\"prose-p\"><strong>Adaptive Query Execution (AQE)</strong> re-optimizes query execution plans dynamically at runtime based on actual stage statistics.</p>\n<p class=\"prose-p\"><strong>Three Major Features of AQE:</strong></p>\n<ol class=\"ordered-list\">\n<li><strong>Dynamically Coalescing Shuffle Partitions</strong>: Inspects output sizes after a shuffle stage and merges small post-shuffle partitions into target sizes (default 64MB).</li>\n<li><strong>Dynamically Switching Join Strategies</strong>: If an input table was originally estimated at 50MB, but filter reduction shrinks it to 8MB at runtime, AQE switches a planned Sort-Merge Join to a Broadcast Hash Join.</li>\n<li><strong>Dynamically Optimizing Skew Joins</strong>: Automatically detects skewed partitions and divides them into smaller sub-partitions, joining them in parallel with duplicate slices of the matching table.</li>\n</ol>\n<p class=\"prose-p\">Enable AQE: <code class=\"inline-code\">spark.sql.adaptive.enabled = true</code> (Enabled by default in Spark 3.2+).</p>", "raw_answer": "**Adaptive Query Execution (AQE)** re-optimizes query execution plans dynamically at runtime based on actual stage statistics.\n\n**Three Major Features of AQE:**\n1. **Dynamically Coalescing Shuffle Partitions**: Inspects output sizes after a shuffle stage and merges small post-shuffle partitions into target sizes (default 64MB).\n2. **Dynamically Switching Join Strategies**: If an input table was originally estimated at 50MB, but filter reduction shrinks it to 8MB at runtime, AQE switches a planned Sort-Merge Join to a Broadcast Hash Join.\n3. **Dynamically Optimizing Skew Joins**: Automatically detects skewed partitions and divides them into smaller sub-partitions, joining them in parallel with duplicate slices of the matching table.\n\nEnable AQE: `spark.sql.adaptive.enabled = true` (Enabled by default in Spark 3.2+)."}, {"id": 35, "question": "What is the difference between Left Semi Join and Left Anti Join?", "difficulty": "Intermediate", "category": "Joins & Query Optimization", "answer_html": "<p class=\"prose-p\">Both return columns <strong>only from the left table</strong>, acting like SQL <code class=\"inline-code\">EXISTS</code> and <code class=\"inline-code\">NOT EXISTS</code>:</p>\n<ol class=\"ordered-list\">\n<li><strong>Left Semi Join</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>Returns rows from the left table that have at least one matching key in the right table.</li>\n<li>Deduplicates matching records (never duplicates left rows).</li>\n</ul>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">   # Customers who have placed at least one order:\n   df_customers.join(df_orders, on=&quot;customer_id&quot;, how=&quot;left_semi&quot;)</code></pre></div>\n<ol class=\"ordered-list\">\n<li><strong>Left Anti Join</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>Returns rows from the left table that have <strong>no match</strong> in the right table.</li>\n</ul>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">   # Customers who have never placed an order:\n   df_customers.join(df_orders, on=&quot;customer_id&quot;, how=&quot;left_anti&quot;)</code></pre></div>", "raw_answer": "Both return columns **only from the left table**, acting like SQL `EXISTS` and `NOT EXISTS`:\n\n1. **Left Semi Join**:\n   - Returns rows from the left table that have at least one matching key in the right table.\n   - Deduplicates matching records (never duplicates left rows).\n   ```python\n   # Customers who have placed at least one order:\n   df_customers.join(df_orders, on=\"customer_id\", how=\"left_semi\")\n   ```\n\n2. **Left Anti Join**:\n   - Returns rows from the left table that have **no match** in the right table.\n   ```python\n   # Customers who have never placed an order:\n   df_customers.join(df_orders, on=\"customer_id\", how=\"left_anti\")\n   ```"}, {"id": 36, "question": "What is Predicate Pushdown and how do you verify it?", "difficulty": "Intermediate", "category": "Joins & Query Optimization", "answer_html": "<p class=\"prose-p\"><strong>Predicate Pushdown</strong> pushes filter conditions down to the underlying storage layer (Parquet, ORC, JDBC) before loading data into Spark memory.</p>\n<p class=\"prose-p\"><strong>How to Verify:</strong></p>\n<p class=\"prose-p\">Call <code class=\"inline-code\">.explain()</code> or <code class=\"inline-code\">.explain(mode=\"formatted\")</code> on the DataFrame and inspect the <code class=\"inline-code\">Scan</code> node:</p>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">df = spark.read.parquet(&quot;sales.parquet&quot;).filter(&quot;country = &#x27;US&#x27;&quot;)\ndf.explain()</code></pre></div>\n<p class=\"prose-p\">Look for:</p>\n<ul class=\"bullet-list\">\n<li><code class=\"inline-code\">PushedFilters: [IsNotNull(country), EqualTo(country,US)]</code> -&gt; Storage engine skipped non-matching Parquet row groups directly at disk read time.</li>\n</ul>", "raw_answer": "**Predicate Pushdown** pushes filter conditions down to the underlying storage layer (Parquet, ORC, JDBC) before loading data into Spark memory.\n\n**How to Verify:**\nCall `.explain()` or `.explain(mode=\"formatted\")` on the DataFrame and inspect the `Scan` node:\n```python\ndf = spark.read.parquet(\"sales.parquet\").filter(\"country = 'US'\")\ndf.explain()\n```\nLook for:\n- `PushedFilters: [IsNotNull(country), EqualTo(country,US)]` -> Storage engine skipped non-matching Parquet row groups directly at disk read time."}, {"id": 37, "question": "What is Column Pruning (Projection Pruning)?", "difficulty": "Intermediate", "category": "Joins & Query Optimization", "answer_html": "<p class=\"prose-p\"><strong>Column Pruning</strong> reads only columns referenced in downstream query operations, discarding unused columns during file scan.</p>\n<p class=\"prose-p\"><strong>Why Columnar Formats Matter:</strong></p>\n<ul class=\"bullet-list\">\n<li>In columnar file formats like <strong>Parquet</strong> or <strong>ORC</strong>, Spark reads only byte offsets corresponding to queried columns.</li>\n<li>Scanning 3 columns out of a 100-column Parquet table reduces disk read I/O and network transfer by up to 97%.</li>\n<li>In contrast, row-oriented formats (CSV, JSON) must read full lines regardless of column projection.</li>\n</ul>", "raw_answer": "**Column Pruning** reads only columns referenced in downstream query operations, discarding unused columns during file scan.\n\n**Why Columnar Formats Matter:**\n- In columnar file formats like **Parquet** or **ORC**, Spark reads only byte offsets corresponding to queried columns.\n- Scanning 3 columns out of a 100-column Parquet table reduces disk read I/O and network transfer by up to 97%.\n- In contrast, row-oriented formats (CSV, JSON) must read full lines regardless of column projection."}, {"id": 38, "question": "What is Cost-Based Optimization (CBO) in Spark?", "difficulty": "Advanced", "category": "Joins & Query Optimization", "answer_html": "<p class=\"prose-p\"><strong>Cost-Based Optimizer (CBO)</strong> uses detailed column-level table statistics to select the most efficient physical execution plan (join order selection, join algorithm choice).</p>\n<p class=\"prose-p\"><strong>Requirements for CBO:</strong></p>\n<ol class=\"ordered-list\">\n<li>Enable configuration: <code class=\"inline-code\">spark.sql.cbo.enabled = true</code></li>\n<li>Generate table and column statistics:</li>\n</ol>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">sql</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-sql\">   ANALYZE TABLE orders COMPUTE STATISTICS;\n   ANALYZE TABLE orders COMPUTE STATISTICS FOR COLUMNS customer_id, order_date;</code></pre></div>\n<p class=\"prose-p\"><strong>What CBO Optimizes:</strong></p>\n<ul class=\"bullet-list\">\n<li>Selects the optimal multi-way join order (joins smallest tables first to minimize intermediate data volume).</li>\n<li>Estimates accurate intermediate row counts for joins and aggregations.</li>\n</ul>", "raw_answer": "**Cost-Based Optimizer (CBO)** uses detailed column-level table statistics to select the most efficient physical execution plan (join order selection, join algorithm choice).\n\n**Requirements for CBO:**\n1. Enable configuration: `spark.sql.cbo.enabled = true`\n2. Generate table and column statistics:\n   ```sql\n   ANALYZE TABLE orders COMPUTE STATISTICS;\n   ANALYZE TABLE orders COMPUTE STATISTICS FOR COLUMNS customer_id, order_date;\n   ```\n\n**What CBO Optimizes:**\n- Selects the optimal multi-way join order (joins smallest tables first to minimize intermediate data volume).\n- Estimates accurate intermediate row counts for joins and aggregations."}, {"id": 39, "question": "How do you inspect and interpret `df.explain()` output?", "difficulty": "Intermediate", "category": "Joins & Query Optimization", "answer_html": "<p class=\"prose-p\">The <code class=\"inline-code\">explain()</code> method displays the Spark query execution plan:</p>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">df.explain(mode=&quot;extended&quot;)  # Shows Parsed, Analyzed, Optimized Logical, and Physical plans</code></pre></div>\n<p class=\"prose-p\"><strong>Key plan checkpoints:</strong></p>\n<ol class=\"ordered-list\">\n<li><strong>Physical Plan</strong>: The actual execution instructions.</li>\n<li><strong><code class=\"inline-code\">Scan [columns] ... PushedFilters</code></strong>: Verifies column pruning and predicate pushdown.</li>\n<li><strong><code class=\"inline-code\">Exchange hashpartitioning(...)</code></strong>: Indicates a network Shuffle stage boundary.</li>\n<li><strong><code class=\"inline-code\">SortMergeJoin</code> vs <code class=\"inline-code\">BroadcastHashJoin</code></strong>: Verifies join strategy selected.</li>\n<li><strong>Asterisk <code class=\"inline-code\"><em></code> (e.g. <code class=\"inline-code\"></em>(1) HashAggregate</code>)</strong>: Confirms Whole-Stage Code Generation is active.</li>\n</ol>", "raw_answer": "The `explain()` method displays the Spark query execution plan:\n\n```python\ndf.explain(mode=\"extended\")  # Shows Parsed, Analyzed, Optimized Logical, and Physical plans\n```\n\n**Key plan checkpoints:**\n1. **Physical Plan**: The actual execution instructions.\n2. **`Scan [columns] ... PushedFilters`**: Verifies column pruning and predicate pushdown.\n3. **`Exchange hashpartitioning(...)`**: Indicates a network Shuffle stage boundary.\n4. **`SortMergeJoin` vs `BroadcastHashJoin`**: Verifies join strategy selected.\n5. **Asterisk `*` (e.g. `*(1) HashAggregate`)**: Confirms Whole-Stage Code Generation is active."}, {"id": 40, "question": "What happens when you perform a non-equi join in Spark?", "difficulty": "Advanced", "category": "Joins & Query Optimization", "answer_html": "<p class=\"prose-p\">A non-equi join uses inequality comparison operators (<code class=\"inline-code\">&lt;</code>, <code class=\"inline-code\">&gt;</code>, <code class=\"inline-code\">&lt;=</code>, <code class=\"inline-code\">&gt;=</code>, <code class=\"inline-code\">!=</code>) instead of an equality operator (<code class=\"inline-code\">=</code>).</p>\n<p class=\"prose-p\"><strong>Impact on Spark:</strong></p>\n<ul class=\"bullet-list\">\n<li>Spark <strong>cannot use</strong> Hash Joins or Sort Merge Joins because hash partitioning requires exact key equality matching (<code class=\"inline-code\">hash(key)</code>).</li>\n<li>Spark falls back to <strong>Broadcast Nested Loop Join (BNLJ)</strong> or <strong>Cartesian Product Join</strong>.</li>\n<li>Time complexity escalates to $O(M \\times N)$, causing job hangs or out-of-memory errors.</li>\n</ul>\n<p class=\"prose-p\"><strong>Mitigation:</strong></p>\n<ul class=\"bullet-list\">\n<li>Rewrite the query with an equality condition on an approximate key (e.g., matching on <code class=\"inline-code\">date_bucket = date_bucket</code>) combined with a secondary range filter.</li>\n</ul>", "raw_answer": "A non-equi join uses inequality comparison operators (`<`, `>`, `<=`, `>=`, `!=`) instead of an equality operator (`=`).\n\n**Impact on Spark:**\n- Spark **cannot use** Hash Joins or Sort Merge Joins because hash partitioning requires exact key equality matching (`hash(key)`).\n- Spark falls back to **Broadcast Nested Loop Join (BNLJ)** or **Cartesian Product Join**.\n- Time complexity escalates to $O(M \\times N)$, causing job hangs or out-of-memory errors.\n\n**Mitigation:**\n- Rewrite the query with an equality condition on an approximate key (e.g., matching on `date_bucket = date_bucket`) combined with a secondary range filter."}, {"id": 41, "question": "What is the difference between `cache()` and `persist()` in PySpark?", "difficulty": "Intermediate", "category": "Caching, Persistence & Fault Tolerance", "answer_html": "<p class=\"prose-p\"><code class=\"inline-code\">cache()</code> is a convenience shortcut for <code class=\"inline-code\">persist()</code>:</p>\n<ul class=\"bullet-list\">\n<li><code class=\"inline-code\">df.cache()</code>: Saves the DataFrame using default storage level: <strong><code class=\"inline-code\">StorageLevel.MEMORY_AND_DISK</code></strong> (in Spark DataFrames; for RDDs default is <code class=\"inline-code\">MEMORY_ONLY</code>).</li>\n<li><code class=\"inline-code\">df.persist(storageLevel)</code>: Allows specifying custom storage levels:</li>\n<li><code class=\"inline-code\">MEMORY_ONLY</code>: Deserialized in JVM heap.</li>\n<li><code class=\"inline-code\">MEMORY_ONLY_SER</code>: Serialized byte array in JVM heap (smaller footprint, higher CPU to read).</li>\n<li><code class=\"inline-code\">MEMORY_AND_DISK</code>: In memory; spills to local disk if memory is exhausted.</li>\n<li><code class=\"inline-code\">DISK_ONLY</code>: Stored only on executor local disk.</li>\n<li><code class=\"inline-code\">_2</code> suffix (e.g., <code class=\"inline-code\">MEMORY_AND_DISK_2</code>): Replicates data across two worker nodes for high availability.</li>\n</ul>\n<p class=\"prose-p\">Always call <code class=\"inline-code\">df.unpersist()</code> when cached data is no longer needed to release executor memory.</p>", "raw_answer": "`cache()` is a convenience shortcut for `persist()`:\n\n- `df.cache()`: Saves the DataFrame using default storage level: **`StorageLevel.MEMORY_AND_DISK`** (in Spark DataFrames; for RDDs default is `MEMORY_ONLY`).\n- `df.persist(storageLevel)`: Allows specifying custom storage levels:\n  - `MEMORY_ONLY`: Deserialized in JVM heap.\n  - `MEMORY_ONLY_SER`: Serialized byte array in JVM heap (smaller footprint, higher CPU to read).\n  - `MEMORY_AND_DISK`: In memory; spills to local disk if memory is exhausted.\n  - `DISK_ONLY`: Stored only on executor local disk.\n  - `_2` suffix (e.g., `MEMORY_AND_DISK_2`): Replicates data across two worker nodes for high availability.\n\nAlways call `df.unpersist()` when cached data is no longer needed to release executor memory."}, {"id": 42, "question": "When should you NOT cache a DataFrame in Spark?", "difficulty": "Intermediate", "category": "Caching, Persistence & Fault Tolerance", "answer_html": "<p class=\"prose-p\">Caching is an anti-pattern in the following scenarios:</p>\n<ol class=\"ordered-list\">\n<li><strong>Single-use DataFrames</strong>: If a DataFrame is consumed only once in downstream actions, caching adds serialization and write overhead with zero benefit.</li>\n<li><strong>Datasets larger than cluster memory</strong>: Storing massive datasets in cache triggers frequent disk spills and aggressive memory eviction, degrading performance.</li>\n<li><strong>Simple, lightweight transformations</strong>: Reading from Parquet with simple filters is often faster than reading cached data from disk spill.</li>\n<li><strong>Breaking Catalyst Optimization</strong>: Caching materializes data and truncates certain Catalyst optimizations (like pushing new filters down into earlier scans).</li>\n</ol>", "raw_answer": "Caching is an anti-pattern in the following scenarios:\n\n1. **Single-use DataFrames**: If a DataFrame is consumed only once in downstream actions, caching adds serialization and write overhead with zero benefit.\n2. **Datasets larger than cluster memory**: Storing massive datasets in cache triggers frequent disk spills and aggressive memory eviction, degrading performance.\n3. **Simple, lightweight transformations**: Reading from Parquet with simple filters is often faster than reading cached data from disk spill.\n4. **Breaking Catalyst Optimization**: Caching materializes data and truncates certain Catalyst optimizations (like pushing new filters down into earlier scans)."}, {"id": 43, "question": "What is Checkpointing (`checkpoint()`), and how does it differ from `persist()`?", "difficulty": "Advanced", "category": "Caching, Persistence & Fault Tolerance", "answer_html": "<p class=\"prose-p\">Both persist data, but their mechanisms and purposes differ:</p>\n<div class=\"table-container\"><table class=\"data-table\">\n<thead><tr>\n<th>Feature</th>\n<th><code class=\"inline-code\">persist()</code> / <code class=\"inline-code\">cache()</code></th>\n<th><code class=\"inline-code\">checkpoint()</code></th>\n</tr></thead><tbody>\n<tr>\n<td><strong>Storage Location</strong></td>\n<td>Executor memory and local disk</td>\n<td>Reliable external distributed storage (HDFS, S3, ADLS)</td>\n</tr>\n<tr>\n<td><strong>Lineage Graph</strong></td>\n<td><strong>Preserves</strong> lineage graph. If an executor dies, Spark recomputes via DAG.</td>\n<td><strong>Truncates</strong> and severs the lineage graph completely.</td>\n</tr>\n<tr>\n<td><strong>Fault Tolerance</strong></td>\n<td>Bound to application lifecycle.</td>\n<td>Persistent even if entire Spark application terminates.</td>\n</tr>\n<tr>\n<td><strong>Use Case</strong></td>\n<td>Iterative algorithms; re-using same DataFrame multiple times.</td>\n<td>Long-running pipelines, iterative graph algorithms (MLlib), and Structured Streaming state recovery.</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">spark.sparkContext.setCheckpointDir(&quot;hdfs:///checkpoints&quot;)\ndf_clean = df_complex.checkpoint()  # Lineage is cut; data saved to HDFS</code></pre></div>", "raw_answer": "Both persist data, but their mechanisms and purposes differ:\n\n| Feature | `persist()` / `cache()` | `checkpoint()` |\n| :--- | :--- | :--- |\n| **Storage Location** | Executor memory and local disk | Reliable external distributed storage (HDFS, S3, ADLS) |\n| **Lineage Graph** | **Preserves** lineage graph. If an executor dies, Spark recomputes via DAG. | **Truncates** and severs the lineage graph completely. |\n| **Fault Tolerance** | Bound to application lifecycle. | Persistent even if entire Spark application terminates. |\n| **Use Case** | Iterative algorithms; re-using same DataFrame multiple times. | Long-running pipelines, iterative graph algorithms (MLlib), and Structured Streaming state recovery. |\n\n```python\nspark.sparkContext.setCheckpointDir(\"hdfs:///checkpoints\")\ndf_clean = df_complex.checkpoint()  # Lineage is cut; data saved to HDFS\n```"}, {"id": 44, "question": "How does Spark achieve Fault Tolerance?", "difficulty": "Intermediate", "category": "Caching, Persistence & Fault Tolerance", "answer_html": "<p class=\"prose-p\">Spark achieves fault tolerance through <strong>Lineage Tracking</strong> and <strong>State Replication</strong>:</p>\n<ol class=\"ordered-list\">\n<li><strong>Lineage (DAG)</strong>: Spark records deterministic transformation history. If a worker node crashes and loses an RDD/DataFrame partition, the driver re-schedules tasks to recompute only that lost partition using the lineage graph.</li>\n<li><strong>Task Retries</strong>: If a task fails (e.g., transient network glitch), the driver retries it up to <code class=\"inline-code\">spark.task.maxFailures</code> times (default 4) before failing the stage.</li>\n<li><strong>Stage Retries</strong>: If shuffle fetch fails due to an executor crash, the driver retries the upstream stage to regenerate missing shuffle files.</li>\n<li><strong>Driver Recovery</strong>: In cluster mode, the cluster manager restarts failed drivers; state is restored via metadata checkpoints.</li>\n</ol>", "raw_answer": "Spark achieves fault tolerance through **Lineage Tracking** and **State Replication**:\n\n1. **Lineage (DAG)**: Spark records deterministic transformation history. If a worker node crashes and loses an RDD/DataFrame partition, the driver re-schedules tasks to recompute only that lost partition using the lineage graph.\n2. **Task Retries**: If a task fails (e.g., transient network glitch), the driver retries it up to `spark.task.maxFailures` times (default 4) before failing the stage.\n3. **Stage Retries**: If shuffle fetch fails due to an executor crash, the driver retries the upstream stage to regenerate missing shuffle files.\n4. **Driver Recovery**: In cluster mode, the cluster manager restarts failed drivers; state is restored via metadata checkpoints."}, {"id": 45, "question": "What is Local Checkpointing (`localCheckpoint()`)?", "difficulty": "Advanced", "category": "Caching, Persistence & Fault Tolerance", "answer_html": "<p class=\"prose-p\"><code class=\"inline-code\">df.localCheckpoint()</code> truncates the DAG lineage graph while writing intermediate data to <strong>executor local storage</strong> instead of a distributed file system like HDFS or S3.</p>\n<p class=\"prose-p\"><strong>Trade-offs:</strong></p>\n<ul class=\"bullet-list\">\n<li><strong>Pros</strong>: Much faster than standard <code class=\"inline-code\">checkpoint()</code> because it skips remote network writes to distributed storage.</li>\n<li><strong>Cons</strong>: Less fault-tolerant. If an executor node crashes, the checkpointed partition on that executor's local disk is lost, and the job fails because the lineage was severed.</li>\n<li><strong>Best Use Case</strong>: Short-cycle iterative algorithms where speed is critical and executor failure probability is low.</li>\n</ul>", "raw_answer": "`df.localCheckpoint()` truncates the DAG lineage graph while writing intermediate data to **executor local storage** instead of a distributed file system like HDFS or S3.\n\n**Trade-offs:**\n- **Pros**: Much faster than standard `checkpoint()` because it skips remote network writes to distributed storage.\n- **Cons**: Less fault-tolerant. If an executor node crashes, the checkpointed partition on that executor's local disk is lost, and the job fails because the lineage was severed.\n- **Best Use Case**: Short-cycle iterative algorithms where speed is critical and executor failure probability is low."}, {"id": 46, "question": "What happens under the hood when you call `df.count()` twice on an uncached DataFrame?", "difficulty": "Intermediate", "category": "Caching, Persistence & Fault Tolerance", "answer_html": "<p class=\"prose-p\">If a DataFrame is not cached:</p>\n<ol class=\"ordered-list\">\n<li>The first <code class=\"inline-code\">df.count()</code> triggers a Spark Job. Spark executes the full DAG: reads files from storage, applies all filters and transformations, and calculates the count.</li>\n<li>The second <code class=\"inline-code\">df.count()</code> triggers a <strong>completely separate Spark Job</strong>. Spark re-reads the entire dataset from storage and repeats all transformation steps again.</li>\n</ol>\n<p class=\"prose-p\"><strong>Solution</strong>: If you must perform multiple actions on a transformed dataset, call <code class=\"inline-code\">df.cache()</code> before the first action, and call <code class=\"inline-code\">df.unpersist()</code> after the last action.</p>", "raw_answer": "If a DataFrame is not cached:\n1. The first `df.count()` triggers a Spark Job. Spark executes the full DAG: reads files from storage, applies all filters and transformations, and calculates the count.\n2. The second `df.count()` triggers a **completely separate Spark Job**. Spark re-reads the entire dataset from storage and repeats all transformation steps again.\n\n**Solution**: If you must perform multiple actions on a transformed dataset, call `df.cache()` before the first action, and call `df.unpersist()` after the last action."}, {"id": 47, "question": "How do you monitor Cached DataFrames in the Spark UI?", "difficulty": "Intermediate", "category": "Caching, Persistence & Fault Tolerance", "answer_html": "<p class=\"prose-p\"><strong>Spark UI -&gt; Storage Tab:</strong></p>\n<ul class=\"bullet-list\">\n<li>Displays all cached RDDs and DataFrames.</li>\n<li><strong>Fraction Cached</strong>: Shows percentage of data resident in memory (e.g., 100% vs 65%).</li>\n<li><strong>Size in Memory</strong>: RAM consumed by cached blocks.</li>\n<li><strong>Size on Disk</strong>: Amount of cached data spilled to disk.</li>\n<li>If Fraction Cached is below 100% and Size on Disk is high, memory pressure is causing cache eviction or disk spill.</li>\n</ul>", "raw_answer": "**Spark UI -> Storage Tab:**\n- Displays all cached RDDs and DataFrames.\n- **Fraction Cached**: Shows percentage of data resident in memory (e.g., 100% vs 65%).\n- **Size in Memory**: RAM consumed by cached blocks.\n- **Size on Disk**: Amount of cached data spilled to disk.\n- If Fraction Cached is below 100% and Size on Disk is high, memory pressure is causing cache eviction or disk spill."}, {"id": 48, "question": "What is the difference between Lazy Caching and Eager Caching?", "difficulty": "Intermediate", "category": "Caching, Persistence & Fault Tolerance", "answer_html": "<ul class=\"bullet-list\">\n<li><strong>Lazy Caching (<code class=\"inline-code\">df.cache()</code>)</strong>: Merely sets an internal flag on the DataFrame. No data is stored in cache until the next <strong>Action</strong> is invoked.</li>\n<li><strong>Eager Caching (<code class=\"inline-code\">df.cache().count()</code>)</strong>: Immediately triggers an action to populate memory blocks across all executors, ensuring subsequent actions read directly from RAM without initial computation latency.</li>\n</ul>", "raw_answer": "- **Lazy Caching (`df.cache()`)**: Merely sets an internal flag on the DataFrame. No data is stored in cache until the next **Action** is invoked.\n- **Eager Caching (`df.cache().count()`)**: Immediately triggers an action to populate memory blocks across all executors, ensuring subsequent actions read directly from RAM without initial computation latency."}, {"id": 49, "question": "How does Spark handle Executor Heartbeat Timeouts?", "difficulty": "Advanced", "category": "Caching, Persistence & Fault Tolerance", "answer_html": "<p class=\"prose-p\">Executors periodically report health to the Driver via heartbeats:</p>\n<ul class=\"bullet-list\">\n<li>Interval configured by: <code class=\"inline-code\">spark.executor.heartbeatInterval</code> (default 10s).</li>\n<li>Timeout configured by: <code class=\"inline-code\">spark.network.timeout</code> (default 120s).</li>\n</ul>\n<p class=\"prose-p\"><strong>Failure Scenario:</strong></p>\n<p class=\"prose-p\">If an executor undergoes an extended Full Garbage Collection pause (e.g., 130s), it cannot send heartbeats. The Driver considers the executor dead, revokes its allocated tasks, and marks it as <code class=\"inline-code\">ExecutorLostFailure</code>.</p>\n<p class=\"prose-p\"><strong>Remediation</strong>: Tune JVM GC parameters (switch to G1GC) or increase <code class=\"inline-code\">spark.network.timeout</code>.</p>", "raw_answer": "Executors periodically report health to the Driver via heartbeats:\n- Interval configured by: `spark.executor.heartbeatInterval` (default 10s).\n- Timeout configured by: `spark.network.timeout` (default 120s).\n\n**Failure Scenario:**\nIf an executor undergoes an extended Full Garbage Collection pause (e.g., 130s), it cannot send heartbeats. The Driver considers the executor dead, revokes its allocated tasks, and marks it as `ExecutorLostFailure`.\n**Remediation**: Tune JVM GC parameters (switch to G1GC) or increase `spark.network.timeout`."}, {"id": 50, "question": "What is the difference between `StorageLevel.MEMORY_ONLY` and `StorageLevel.MEMORY_ONLY_SER`?", "difficulty": "Intermediate", "category": "Caching, Persistence & Fault Tolerance", "answer_html": "<ul class=\"bullet-list\">\n<li><strong><code class=\"inline-code\">MEMORY_ONLY</code></strong>: Stores partitions as deserialized Java objects in JVM heap.</li>\n<li><em>Pros</em>: Extremely fast access; zero deserialization overhead when read.</li>\n<li><em>Cons</em>: High memory footprint due to Java object headers (often 2-5x larger than raw data).</li>\n<li><strong><code class=\"inline-code\">MEMORY_ONLY_SER</code></strong>: Stores partitions as raw serialized byte arrays.</li>\n<li><em>Pros</em>: Significantly smaller memory footprint; reduces GC pressure.</li>\n<li><em>Cons</em>: Consumes CPU cycles to deserialize objects each time a task reads from cache.</li>\n</ul>", "raw_answer": "- **`MEMORY_ONLY`**: Stores partitions as deserialized Java objects in JVM heap.\n  - *Pros*: Extremely fast access; zero deserialization overhead when read.\n  - *Cons*: High memory footprint due to Java object headers (often 2-5x larger than raw data).\n- **`MEMORY_ONLY_SER`**: Stores partitions as raw serialized byte arrays.\n  - *Pros*: Significantly smaller memory footprint; reduces GC pressure.\n  - *Cons*: Consumes CPU cycles to deserialize objects each time a task reads from cache."}, {"id": 51, "question": "What are Window Functions in PySpark, and what is the difference between `row_number()`, `rank()`, and `dense_rank()`?", "difficulty": "Intermediate", "category": "Functions & Advanced Operations", "answer_html": "<p class=\"prose-p\">Window functions perform calculations across a partitioned set of rows without collapsing rows (unlike <code class=\"inline-code\">groupBy()</code>).</p>\n<div class=\"table-container\"><table class=\"data-table\">\n<thead><tr>\n<th>Function</th>\n<th>Ties Handling</th>\n<th>Sequence Example (for values 100, 100, 80)</th>\n</tr></thead><tbody>\n<tr>\n<td><code class=\"inline-code\">row_number()</code></td>\n<td>Assigns unique consecutive numbers arbitrarily for ties</td>\n<td>1, 2, 3</td>\n</tr>\n<tr>\n<td><code class=\"inline-code\">rank()</code></td>\n<td>Same rank for ties; <strong>skips</strong> subsequent ranks</td>\n<td>1, 1, 3</td>\n</tr>\n<tr>\n<td><code class=\"inline-code\">dense_rank()</code></td>\n<td>Same rank for ties; <strong>no gap</strong> in subsequent ranks</td>\n<td>1, 1, 2</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">from pyspark.sql.window import Window\nfrom pyspark.sql import functions as F\n\nwindowSpec = Window.partitionBy(&quot;department&quot;).orderBy(F.desc(&quot;salary&quot;))\n\ndf.withColumn(&quot;row_num&quot;, F.row_number().over(windowSpec)) \\\n  .withColumn(&quot;rank&quot;, F.rank().over(windowSpec)) \\\n  .withColumn(&quot;dense_rank&quot;, F.dense_rank().over(windowSpec))</code></pre></div>", "raw_answer": "Window functions perform calculations across a partitioned set of rows without collapsing rows (unlike `groupBy()`).\n\n| Function | Ties Handling | Sequence Example (for values 100, 100, 80) |\n| :--- | :--- | :--- |\n| `row_number()` | Assigns unique consecutive numbers arbitrarily for ties | 1, 2, 3 |\n| `rank()` | Same rank for ties; **skips** subsequent ranks | 1, 1, 3 |\n| `dense_rank()` | Same rank for ties; **no gap** in subsequent ranks | 1, 1, 2 |\n\n```python\nfrom pyspark.sql.window import Window\nfrom pyspark.sql import functions as F\n\nwindowSpec = Window.partitionBy(\"department\").orderBy(F.desc(\"salary\"))\n\ndf.withColumn(\"row_num\", F.row_number().over(windowSpec)) \\\n  .withColumn(\"rank\", F.rank().over(windowSpec)) \\\n  .withColumn(\"dense_rank\", F.dense_rank().over(windowSpec))\n```"}, {"id": 52, "question": "What is the difference between `lead()` and `lag()` window functions?", "difficulty": "Intermediate", "category": "Functions & Advanced Operations", "answer_html": "<p class=\"prose-p\">Both functions access data from surrounding rows relative to the current row:</p>\n<ul class=\"bullet-list\">\n<li><strong><code class=\"inline-code\">lag(col, offset, default)</code></strong>: Accesses a value from <code class=\"inline-code\">offset</code> rows <strong>before</strong> the current row.</li>\n<li><strong><code class=\"inline-code\">lead(col, offset, default)</code></strong>: Accesses a value from <code class=\"inline-code\">offset</code> rows <strong>after</strong> the current row.</li>\n</ul>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">windowSpec = Window.partitionBy(&quot;user_id&quot;).orderBy(&quot;transaction_time&quot;)\n\n# Calculate time difference between consecutive transactions\ndf_diff = df.withColumn(&quot;prev_tx_time&quot;, F.lag(&quot;transaction_time&quot;, 1).over(windowSpec)) \\\n            .withColumn(&quot;seconds_since_last&quot;, F.col(&quot;transaction_time&quot;).cast(&quot;long&quot;) - F.col(&quot;prev_tx_time&quot;).cast(&quot;long&quot;))</code></pre></div>", "raw_answer": "Both functions access data from surrounding rows relative to the current row:\n\n- **`lag(col, offset, default)`**: Accesses a value from `offset` rows **before** the current row.\n- **`lead(col, offset, default)`**: Accesses a value from `offset` rows **after** the current row.\n\n```python\nwindowSpec = Window.partitionBy(\"user_id\").orderBy(\"transaction_time\")\n\n# Calculate time difference between consecutive transactions\ndf_diff = df.withColumn(\"prev_tx_time\", F.lag(\"transaction_time\", 1).over(windowSpec)) \\\n            .withColumn(\"seconds_since_last\", F.col(\"transaction_time\").cast(\"long\") - F.col(\"prev_tx_time\").cast(\"long\"))\n```"}, {"id": 53, "question": "What is the difference between PySpark UDF and Pandas UDF (Vectorized UDF)?", "difficulty": "Intermediate", "category": "Functions & Advanced Operations", "answer_html": "<div class=\"table-container\"><table class=\"data-table\">\n<thead><tr>\n<th>Feature</th>\n<th>Standard PySpark UDF (<code class=\"inline-code\">@udf</code>)</th>\n<th>Pandas UDF (<code class=\"inline-code\">@pandas_udf</code>)</th>\n</tr></thead><tbody>\n<tr>\n<td><strong>Execution Model</strong></td>\n<td>Row-by-row iteration in Python</td>\n<td>Batch execution using Apache Arrow</td>\n</tr>\n<tr>\n<td><strong>Serialization</strong></td>\n<td>High overhead via Python Pickle</td>\n<td>Zero-copy / low overhead via Arrow</td>\n</tr>\n<tr>\n<td><strong>Performance</strong></td>\n<td>Slow (often 10x-100x slower than native SQL)</td>\n<td>Near-native C/C++ speed</td>\n</tr>\n<tr>\n<td><strong>Input Type</strong></td>\n<td>Python native scalar types</td>\n<td><code class=\"inline-code\">pandas.Series</code> or <code class=\"inline-code\">pandas.DataFrame</code></td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">from pyspark.sql.functions import pandas_udf\nimport pandas as pd\n\n@pandas_udf(&quot;double&quot;)\ndef vectorized_discount(price: pd.Series, rate: pd.Series) -&gt; pd.Series:\n    return price * (1.0 - rate)\n\ndf.withColumn(&quot;net_price&quot;, vectorized_discount(&quot;price&quot;, &quot;rate&quot;))</code></pre></div>", "raw_answer": "| Feature | Standard PySpark UDF (`@udf`) | Pandas UDF (`@pandas_udf`) |\n| :--- | :--- | :--- |\n| **Execution Model** | Row-by-row iteration in Python | Batch execution using Apache Arrow |\n| **Serialization** | High overhead via Python Pickle | Zero-copy / low overhead via Arrow |\n| **Performance** | Slow (often 10x-100x slower than native SQL) | Near-native C/C++ speed |\n| **Input Type** | Python native scalar types | `pandas.Series` or `pandas.DataFrame` |\n\n```python\nfrom pyspark.sql.functions import pandas_udf\nimport pandas as pd\n\n@pandas_udf(\"double\")\ndef vectorized_discount(price: pd.Series, rate: pd.Series) -> pd.Series:\n    return price * (1.0 - rate)\n\ndf.withColumn(\"net_price\", vectorized_discount(\"price\", \"rate\"))\n```"}, {"id": 54, "question": "How do `explode()` and `explode_outer()` work?", "difficulty": "Intermediate", "category": "Functions & Advanced Operations", "answer_html": "<p class=\"prose-p\">Both functions unnest an array or map column into multiple individual rows:</p>\n<ul class=\"bullet-list\">\n<li><strong><code class=\"inline-code\">explode(col)</code></strong>: Creates a new row for each element in the array. If the array is <strong>null or empty</strong>, the entire parent row is dropped.</li>\n<li><strong><code class=\"inline-code\">explode_outer(col)</code></strong>: Creates a new row for each element. If the array is null or empty, it retains the parent row with <code class=\"inline-code\">null</code> in the exploded column (equivalent to an outer join).</li>\n</ul>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\"># Explode tags array: [&#x27;tech&#x27;, &#x27;python&#x27;] -&gt; 2 rows\ndf_exploded = df.select(&quot;article_id&quot;, F.explode(&quot;tags&quot;).alias(&quot;tag&quot;))</code></pre></div>", "raw_answer": "Both functions unnest an array or map column into multiple individual rows:\n\n- **`explode(col)`**: Creates a new row for each element in the array. If the array is **null or empty**, the entire parent row is dropped.\n- **`explode_outer(col)`**: Creates a new row for each element. If the array is null or empty, it retains the parent row with `null` in the exploded column (equivalent to an outer join).\n\n```python\n# Explode tags array: ['tech', 'python'] -> 2 rows\ndf_exploded = df.select(\"article_id\", F.explode(\"tags\").alias(\"tag\"))\n```"}, {"id": 55, "question": "How do you handle null values in PySpark (`fillna`, `dropna`, `coalesce`)?", "difficulty": "Beginner", "category": "Functions & Advanced Operations", "answer_html": "<p class=\"prose-p\">PySpark provides built-in null-handling operations:</p>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\"># 1. Drop rows with nulls\ndf.dropna(how=&quot;any&quot;, subset=[&quot;user_id&quot;, &quot;email&quot;])\n\n# 2. Fill nulls with default values\ndf.fillna({&quot;age&quot;: 0, &quot;status&quot;: &quot;UNKNOWN&quot;})\n\n# 3. SQL coalesce: return first non-null value across columns\nfrom pyspark.sql import functions as F\ndf.withColumn(&quot;phone&quot;, F.coalesce(F.col(&quot;mobile_number&quot;), F.col(&quot;home_number&quot;), F.lit(&quot;N/A&quot;)))</code></pre></div>", "raw_answer": "PySpark provides built-in null-handling operations:\n\n```python\n# 1. Drop rows with nulls\ndf.dropna(how=\"any\", subset=[\"user_id\", \"email\"])\n\n# 2. Fill nulls with default values\ndf.fillna({\"age\": 0, \"status\": \"UNKNOWN\"})\n\n# 3. SQL coalesce: return first non-null value across columns\nfrom pyspark.sql import functions as F\ndf.withColumn(\"phone\", F.coalesce(F.col(\"mobile_number\"), F.col(\"home_number\"), F.lit(\"N/A\")))\n```"}, {"id": 56, "question": "What is the difference between `GROUP BY`, `ROLLUP`, and `CUBE`?", "difficulty": "Intermediate", "category": "Functions & Advanced Operations", "answer_html": "<p class=\"prose-p\">All three generate multidimensional aggregation subtotals:</p>\n<ol class=\"ordered-list\">\n<li><strong><code class=\"inline-code\">GROUP BY (A, B)</code></strong>: Computes aggregate for exact combination <code class=\"inline-code\">(A, B)</code> only.</li>\n<li><strong><code class=\"inline-code\">ROLLUP (A, B)</code></strong>: Computes hierarchical aggregations from left to right:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li><code class=\"inline-code\">(A, B)</code>, <code class=\"inline-code\">(A)</code>, and Grand Total <code class=\"inline-code\">()</code>.</li>\n</ul>\n<ol class=\"ordered-list\">\n<li><strong><code class=\"inline-code\">CUBE (A, B)</code></strong>: Computes all possible combinations of dimensions (power set $2^N$):</li>\n</ol>\n<ul class=\"bullet-list\">\n<li><code class=\"inline-code\">(A, B)</code>, <code class=\"inline-code\">(A)</code>, <code class=\"inline-code\">(B)</code>, and Grand Total <code class=\"inline-code\">()</code>.</li>\n</ul>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">df.cube(&quot;country&quot;, &quot;year&quot;).agg(F.sum(&quot;revenue&quot;))</code></pre></div>", "raw_answer": "All three generate multidimensional aggregation subtotals:\n\n1. **`GROUP BY (A, B)`**: Computes aggregate for exact combination `(A, B)` only.\n2. **`ROLLUP (A, B)`**: Computes hierarchical aggregations from left to right:\n   - `(A, B)`, `(A)`, and Grand Total `()`.\n3. **`CUBE (A, B)`**: Computes all possible combinations of dimensions (power set $2^N$):\n   - `(A, B)`, `(A)`, `(B)`, and Grand Total `()`.\n\n```python\ndf.cube(\"country\", \"year\").agg(F.sum(\"revenue\"))\n```"}, {"id": 57, "question": "How do you define and enforce a schema using `StructType` and `StructField`?", "difficulty": "Intermediate", "category": "Functions & Advanced Operations", "answer_html": "<p class=\"prose-p\">Explicit schema definition avoids runtime schema inference costs and prevents pipeline failure on malformed records:</p>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">from pyspark.sql.types import StructType, StructField, StringType, IntegerType, TimestampType\n\nschema = StructType([\n    StructField(&quot;order_id&quot;, StringType(), nullable=False),\n    StructField(&quot;customer_id&quot;, StringType(), nullable=False),\n    StructField(&quot;amount&quot;, IntegerType(), nullable=True),\n    StructField(&quot;created_at&quot;, TimestampType(), nullable=True)\n])\n\ndf = spark.read.schema(schema).json(&quot;s3://bucket/orders/&quot;)</code></pre></div>", "raw_answer": "Explicit schema definition avoids runtime schema inference costs and prevents pipeline failure on malformed records:\n\n```python\nfrom pyspark.sql.types import StructType, StructField, StringType, IntegerType, TimestampType\n\nschema = StructType([\n    StructField(\"order_id\", StringType(), nullable=False),\n    StructField(\"customer_id\", StringType(), nullable=False),\n    StructField(\"amount\", IntegerType(), nullable=True),\n    StructField(\"created_at\", TimestampType(), nullable=True)\n])\n\ndf = spark.read.schema(schema).json(\"s3://bucket/orders/\")\n```"}, {"id": 58, "question": "What are High-Order Functions in PySpark (Spark 3.x)?", "difficulty": "Intermediate", "category": "Functions & Advanced Operations", "answer_html": "<p class=\"prose-p\">High-order functions manipulate complex array/nested structures directly in SQL without needing <code class=\"inline-code\">explode()</code>:</p>\n<ol class=\"ordered-list\">\n<li><strong><code class=\"inline-code\">transform(arr, expr)</code></strong>: Maps a lambda over an array.</li>\n</ol>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">   df.withColumn(&quot;doubled&quot;, F.expr(&quot;transform(numbers, x -&gt; x * 2)&quot;))</code></pre></div>\n<ol class=\"ordered-list\">\n<li><strong><code class=\"inline-code\">filter(arr, expr)</code></strong>: Filters array elements matching a condition.</li>\n</ol>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">   df.withColumn(&quot;evens&quot;, F.expr(&quot;filter(numbers, x -&gt; x % 2 = 0)&quot;))</code></pre></div>\n<ol class=\"ordered-list\">\n<li><strong><code class=\"inline-code\">aggregate(arr, zero, merge, finish)</code></strong>: Reduces an array to a scalar value.</li>\n</ol>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">   df.withColumn(&quot;sum&quot;, F.expr(&quot;aggregate(numbers, 0, (acc, x) -&gt; acc + x)&quot;))</code></pre></div>", "raw_answer": "High-order functions manipulate complex array/nested structures directly in SQL without needing `explode()`:\n\n1. **`transform(arr, expr)`**: Maps a lambda over an array.\n   ```python\n   df.withColumn(\"doubled\", F.expr(\"transform(numbers, x -> x * 2)\"))\n   ```\n2. **`filter(arr, expr)`**: Filters array elements matching a condition.\n   ```python\n   df.withColumn(\"evens\", F.expr(\"filter(numbers, x -> x % 2 = 0)\"))\n   ```\n3. **`aggregate(arr, zero, merge, finish)`**: Reduces an array to a scalar value.\n   ```python\n   df.withColumn(\"sum\", F.expr(\"aggregate(numbers, 0, (acc, x) -> acc + x)\"))\n   ```"}, {"id": 59, "question": "How do you write conditional logic with `when()` and `otherwise()`?", "difficulty": "Intermediate", "category": "Functions & Advanced Operations", "answer_html": "<p class=\"prose-p\">Equivalent to SQL <code class=\"inline-code\">CASE WHEN ... THEN ... ELSE ... END</code>:</p>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">from pyspark.sql import functions as F\n\ndf_categorized = df.withColumn(\n    &quot;tier&quot;,\n    F.when(F.col(&quot;spend&quot;) &gt;= 1000, &quot;Platinum&quot;)\n     .when((F.col(&quot;spend&quot;) &gt;= 500) &amp; (F.col(&quot;spend&quot;) &lt; 1000), &quot;Gold&quot;)\n     .otherwise(&quot;Standard&quot;)\n)</code></pre></div>", "raw_answer": "Equivalent to SQL `CASE WHEN ... THEN ... ELSE ... END`:\n\n```python\nfrom pyspark.sql import functions as F\n\ndf_categorized = df.withColumn(\n    \"tier\",\n    F.when(F.col(\"spend\") >= 1000, \"Platinum\")\n     .when((F.col(\"spend\") >= 500) & (F.col(\"spend\") < 1000), \"Gold\")\n     .otherwise(\"Standard\")\n)\n```"}, {"id": 60, "question": "How do you optimize PySpark jobs that perform repetitive regex operations?", "difficulty": "Advanced", "category": "Functions & Advanced Operations", "answer_html": "<p class=\"prose-p\">Regex operations in Python or standard Spark UDFs are computationally expensive.</p>\n<p class=\"prose-p\"><strong>Optimizations:</strong></p>\n<ol class=\"ordered-list\">\n<li>Use native Spark SQL regex functions (<code class=\"inline-code\">regexp_extract</code>, <code class=\"inline-code\">regexp_replace</code>, <code class=\"inline-code\">rlike</code>) instead of Python <code class=\"inline-code\">re</code> module UDFs to leverage Tungsten execution.</li>\n<li>For multiple extracts from the same string, combine regex patterns or parse structured formats into JSON/StructType directly.</li>\n<li>Pre-filter rows using <code class=\"inline-code\">rlike</code> before applying expensive extract expressions.</li>\n</ol>", "raw_answer": "Regex operations in Python or standard Spark UDFs are computationally expensive.\n\n**Optimizations:**\n1. Use native Spark SQL regex functions (`regexp_extract`, `regexp_replace`, `rlike`) instead of Python `re` module UDFs to leverage Tungsten execution.\n2. For multiple extracts from the same string, combine regex patterns or parse structured formats into JSON/StructType directly.\n3. Pre-filter rows using `rlike` before applying expensive extract expressions."}, {"id": 61, "question": "What is Spark Structured Streaming, and how does it differ from Spark DStreams?", "difficulty": "Intermediate", "category": "Streaming & Event Processing", "answer_html": "<div class=\"table-container\"><table class=\"data-table\">\n<thead><tr>\n<th>Feature</th>\n<th>DStreams (Legacy Spark Streaming)</th>\n<th>Structured Streaming (Modern)</th>\n</tr></thead><tbody>\n<tr>\n<td><strong>Abstraction</strong></td>\n<td>RDDs under the hood</td>\n<td>DataFrames and Datasets</td>\n</tr>\n<tr>\n<td><strong>Optimization</strong></td>\n<td>None (standard RDD execution)</td>\n<td>Catalyst Optimizer and Tungsten engine</td>\n</tr>\n<tr>\n<td><strong>Event Time Handling</strong></td>\n<td>Weak; based on processing arrival time</td>\n<td>Native event-time processing and watermarks</td>\n</tr>\n<tr>\n<td><strong>End-to-End Guarantees</strong></td>\n<td>At-least-once (difficult exactly-once)</td>\n<td>Built-in Exactly-Once guarantees</td>\n</tr>\n<tr>\n<td><strong>API Model</strong></td>\n<td>Separate streaming API</td>\n<td>Unified API: streaming query uses standard DataFrame API</td>\n</tr>\n</tbody>\n</table></div>", "raw_answer": "| Feature | DStreams (Legacy Spark Streaming) | Structured Streaming (Modern) |\n| :--- | :--- | :--- |\n| **Abstraction** | RDDs under the hood | DataFrames and Datasets |\n| **Optimization** | None (standard RDD execution) | Catalyst Optimizer and Tungsten engine |\n| **Event Time Handling** | Weak; based on processing arrival time | Native event-time processing and watermarks |\n| **End-to-End Guarantees** | At-least-once (difficult exactly-once) | Built-in Exactly-Once guarantees |\n| **API Model** | Separate streaming API | Unified API: streaming query uses standard DataFrame API |"}, {"id": 62, "question": "What are the three Output Modes in Structured Streaming?", "difficulty": "Intermediate", "category": "Streaming & Event Processing", "answer_html": "<ol class=\"ordered-list\">\n<li><strong>Append Mode (Default)</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>Only new rows added to the Result Table since the last trigger are output to the sink.</li>\n<li>Ideal for queries without aggregations, or with event-time watermarked aggregations.</li>\n</ul>\n<ol class=\"ordered-list\">\n<li><strong>Complete Mode</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>The entire updated Result Table is written to the sink on every trigger.</li>\n<li>Required for queries with non-watermarked aggregations (e.g., global <code class=\"inline-code\">count()</code>).</li>\n</ul>\n<ol class=\"ordered-list\">\n<li><strong>Update Mode</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>Only rows in the Result Table that changed since the last trigger are written to the sink.</li>\n<li>If a query has no aggregations, it behaves identically to Append Mode.</li>\n</ul>", "raw_answer": "1. **Append Mode (Default)**:\n   - Only new rows added to the Result Table since the last trigger are output to the sink.\n   - Ideal for queries without aggregations, or with event-time watermarked aggregations.\n2. **Complete Mode**:\n   - The entire updated Result Table is written to the sink on every trigger.\n   - Required for queries with non-watermarked aggregations (e.g., global `count()`).\n3. **Update Mode**:\n   - Only rows in the Result Table that changed since the last trigger are written to the sink.\n   - If a query has no aggregations, it behaves identically to Append Mode."}, {"id": 63, "question": "What is Watermarking in Structured Streaming, and why is it necessary?", "difficulty": "Advanced", "category": "Streaming & Event Processing", "answer_html": "<p class=\"prose-p\">A <strong>Watermark</strong> tells Spark how long to wait for late-arriving data before evicting historical state from executor memory.</p>\n<p class=\"prose-p\"><strong>Why it is Necessary:</strong></p>\n<p class=\"prose-p\">Without watermarking, stateful operations (like windowed aggregations or stream-stream joins) would keep historical aggregate keys in memory indefinitely, causing executor OOM crashes.</p>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\"># Wait up to 10 minutes for late-arriving events\ndf_stream = df.withWatermark(&quot;timestamp&quot;, &quot;10 minutes&quot;) \\\n              .groupBy(F.window(&quot;timestamp&quot;, &quot;5 minutes&quot;), &quot;sensor_id&quot;) \\\n              .count()</code></pre></div>\n<p class=\"prose-p\"><em>Rule</em>: Any event arriving with <code class=\"inline-code\">event_time &lt; (MaxEventTimeSeen - 10 minutes)</code> is dropped.</p>", "raw_answer": "A **Watermark** tells Spark how long to wait for late-arriving data before evicting historical state from executor memory.\n\n**Why it is Necessary:**\nWithout watermarking, stateful operations (like windowed aggregations or stream-stream joins) would keep historical aggregate keys in memory indefinitely, causing executor OOM crashes.\n\n```python\n# Wait up to 10 minutes for late-arriving events\ndf_stream = df.withWatermark(\"timestamp\", \"10 minutes\") \\\n              .groupBy(F.window(\"timestamp\", \"5 minutes\"), \"sensor_id\") \\\n              .count()\n```\n*Rule*: Any event arriving with `event_time < (MaxEventTimeSeen - 10 minutes)` is dropped."}, {"id": 64, "question": "How does Spark Structured Streaming achieve Exactly-Once semantics?", "difficulty": "Advanced", "category": "Streaming & Event Processing", "answer_html": "<p class=\"prose-p\">Exactly-once requires coordination across three components:</p>\n<ol class=\"ordered-list\">\n<li><strong>Replayable Source</strong>: The data source must support seeking back to specific offsets (e.g., Apache Kafka, AWS Kinesis).</li>\n<li><strong>Deterministic Engine (Write-Ahead Logs &amp; Checkpoint Directory)</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>Spark records stream offset positions and state updates to a durable <strong>checkpoint directory</strong> before processing.</li>\n<li>If an executor or driver crashes, Spark resumes from the exact offset recorded in the checkpoint log.</li>\n</ul>\n<ol class=\"ordered-list\">\n<li><strong>Idempotent or Transactional Sink</strong>: The destination must either be idempotent (writing same recor
