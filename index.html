terminated immediately when job finishes |\n| **Cost (DBUs)** | Higher DBU rate (~2x more expensive per core/hour) | Discounted DBU rate (~50% cheaper) |\n| **Isolation** | Shared among team members; state persists | Dedicated to single job run; clean isolated environment |\n\n*Production Standard*: Always run scheduled production workloads on **Job Clusters** or **Serverless Compute** to minimize DBU spend."}, {"id": 109, "question": "What are Databricks Asset Bundles (DABs), and why are they used for CI/CD?", "difficulty": "Advanced", "category": "Databricks & Lakehouse Platform", "answer_html": "<p class=\"prose-p\"><strong>Databricks Asset Bundles (DABs)</strong> are Databricks' Infrastructure-as-Code (IaC) tool for declaring and deploying Lakehouse projects.</p>\n<p class=\"prose-p\"><strong>Key Characteristics:</strong></p>\n<ul class=\"bullet-list\">\n<li>Projects are defined via YAML files (<code class=\"inline-code\">databricks.yml</code>).</li>\n<li>Manages complete pipelines: Workflows, DLT pipelines, ML models, and schemas as version-controlled code.</li>\n<li>Supports multi-environment promotion (<code class=\"inline-code\">dev</code> -&gt; <code class=\"inline-code\">staging</code> -&gt; <code class=\"inline-code\">prod</code>) with environment-specific overrides.</li>\n<li>Integrates seamlessly with GitHub Actions, Azure DevOps, and GitLab CI/CD pipelines via Databricks CLI (<code class=\"inline-code\">databricks bundle deploy</code>).</li>\n</ul>", "raw_answer": "**Databricks Asset Bundles (DABs)** are Databricks' Infrastructure-as-Code (IaC) tool for declaring and deploying Lakehouse projects.\n\n**Key Characteristics:**\n- Projects are defined via YAML files (`databricks.yml`).\n- Manages complete pipelines: Workflows, DLT pipelines, ML models, and schemas as version-controlled code.\n- Supports multi-environment promotion (`dev` -> `staging` -> `prod`) with environment-specific overrides.\n- Integrates seamlessly with GitHub Actions, Azure DevOps, and GitLab CI/CD pipelines via Databricks CLI (`databricks bundle deploy`)."}, {"id": 110, "question": "What is Databricks Connect v2, and how does it work?", "difficulty": "Intermediate", "category": "Databricks & Lakehouse Platform", "answer_html": "<p class=\"prose-p\"><strong>Databricks Connect (v2)</strong> allows developers to write PySpark code in local IDEs (VS Code, PyCharm, Cursor) and execute commands remotely on a Databricks cluster.</p>\n<p class=\"prose-p\"><strong>Architecture:</strong></p>\n<ul class=\"bullet-list\">\n<li>Built on open-source <strong>Spark Connect</strong> client-server protocol.</li>\n<li>Client communicates with the remote cluster using thin gRPC requests and Apache Arrow IPC streams.</li>\n<li>Code runs locally on developer workstation; data computation and heavy lifting happen on the cluster.</li>\n<li>Enables local unit testing, Git branches, and step-through debugging.</li>\n</ul>", "raw_answer": "**Databricks Connect (v2)** allows developers to write PySpark code in local IDEs (VS Code, PyCharm, Cursor) and execute commands remotely on a Databricks cluster.\n\n**Architecture:**\n- Built on open-source **Spark Connect** client-server protocol.\n- Client communicates with the remote cluster using thin gRPC requests and Apache Arrow IPC streams.\n- Code runs locally on developer workstation; data computation and heavy lifting happen on the cluster.\n- Enables local unit testing, Git branches, and step-through debugging."}, {"id": 111, "question": "How do you pass parameters and share data between tasks in Databricks Workflows?", "difficulty": "Intermediate", "category": "Databricks & Lakehouse Platform", "answer_html": "<p class=\"prose-p\">Databricks provides multiple mechanisms:</p>\n<ol class=\"ordered-list\">\n<li><strong><code class=\"inline-code\">dbutils.jobs.taskValues</code> (Dynamic Value Passing)</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>Upstream task sets a value:</li>\n</ul>\n<p class=\"prose-p\"><code class=\"inline-code\">dbutils.jobs.taskValues.set(key=\"batch_count\", value=50000)</code></p>\n<ul class=\"bullet-list\">\n<li>Downstream task reads the value:</li>\n</ul>\n<p class=\"prose-p\"><code class=\"inline-code\">count = dbutils.jobs.taskValues.get(taskKey=\"ingest_task\", key=\"batch_count\")</code></p>\n<ol class=\"ordered-list\">\n<li><strong>Job Parameters &amp; Widgets (<code class=\"inline-code\">dbutils.widgets</code>)</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>Pass static or scheduled job parameters (e.g. <code class=\"inline-code\">{{job.start_time.iso_date}}</code>).</li>\n<li>Read inside notebook: <code class=\"inline-code\">dbutils.widgets.get(\"execution_date\")</code>.</li>\n</ul>\n<ol class=\"ordered-list\">\n<li><strong>If/Else Condition Tasks</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>Branch DAG execution paths based on status or task values.</li>\n</ul>", "raw_answer": "Databricks provides multiple mechanisms:\n\n1. **`dbutils.jobs.taskValues` (Dynamic Value Passing)**:\n   - Upstream task sets a value:\n     `dbutils.jobs.taskValues.set(key=\"batch_count\", value=50000)`\n   - Downstream task reads the value:\n     `count = dbutils.jobs.taskValues.get(taskKey=\"ingest_task\", key=\"batch_count\")`\n2. **Job Parameters & Widgets (`dbutils.widgets`)**:\n   - Pass static or scheduled job parameters (e.g. `{{job.start_time.iso_date}}`).\n   - Read inside notebook: `dbutils.widgets.get(\"execution_date\")`.\n3. **If/Else Condition Tasks**:\n   - Branch DAG execution paths based on status or task values."}, {"id": 112, "question": "What is Predictive Optimization in Databricks Unity Catalog?", "difficulty": "Intermediate", "category": "Databricks & Lakehouse Platform", "answer_html": "<p class=\"prose-p\"><strong>Predictive Optimization</strong> leverages AI and query history to automatically run table maintenance across Unity Catalog tables.</p>\n<p class=\"prose-p\"><strong>Automated Operations:</strong></p>\n<ul class=\"bullet-list\">\n<li><strong>Auto-Compaction</strong>: Merges small files into 1 GB files without needing scheduled <code class=\"inline-code\">OPTIMIZE</code> cron jobs.</li>\n<li><strong>Auto-Vacuum</strong>: Purges obsolete data files older than retention policy safely.</li>\n<li><strong>Auto-Clustering</strong>: Refreshes Liquid Clustering layouts incrementally based on query patterns.</li>\n</ul>\n<p class=\"prose-p\">Enable on tables or entire schemas:</p>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">sql</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-sql\">ALTER SCHEMA prod.silver ENABLE PREDICTIVE OPTIMIZATION;</code></pre></div>", "raw_answer": "**Predictive Optimization** leverages AI and query history to automatically run table maintenance across Unity Catalog tables.\n\n**Automated Operations:**\n- **Auto-Compaction**: Merges small files into 1 GB files without needing scheduled `OPTIMIZE` cron jobs.\n- **Auto-Vacuum**: Purges obsolete data files older than retention policy safely.\n- **Auto-Clustering**: Refreshes Liquid Clustering layouts incrementally based on query patterns.\n\nEnable on tables or entire schemas:\n```sql\nALTER SCHEMA prod.silver ENABLE PREDICTIVE OPTIMIZATION;\n```"}, {"id": 113, "question": "How do Dynamic Row Filters and Column Masks work in Unity Catalog?", "difficulty": "Intermediate", "category": "Databricks & Lakehouse Platform", "answer_html": "<p class=\"prose-p\">Unity Catalog enforces row-level and column-level security at query time:</p>\n<ol class=\"ordered-list\">\n<li><strong>Row Filters (<code class=\"inline-code\">ROW FILTER</code>)</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>Filter rows based on user role or group:</li>\n</ul>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">sql</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-sql\">   CREATE FUNCTION region_filter(region STRING)\n   RETURN IF(IS_ACCOUNT_GROUP_MEMBER(&#x27;managers&#x27;), true, region = &#x27;US&#x27;);\n\n   ALTER TABLE sales_orders SET ROW FILTER region_filter ON (region);</code></pre></div>\n<ol class=\"ordered-list\">\n<li><strong>Column Masks (<code class=\"inline-code\">COLUMN MASK</code>)</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>Mask sensitive columns like credit cards or emails:</li>\n</ul>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">sql</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-sql\">   CREATE FUNCTION mask_ssn(ssn STRING)\n   RETURN IF(IS_ACCOUNT_GROUP_MEMBER(&#x27;hr_admin&#x27;), ssn, &#x27;***-**-****&#x27;);\n\n   ALTER TABLE employees ALTER COLUMN ssn SET MASK mask_ssn;</code></pre></div>", "raw_answer": "Unity Catalog enforces row-level and column-level security at query time:\n\n1. **Row Filters (`ROW FILTER`)**:\n   - Filter rows based on user role or group:\n   ```sql\n   CREATE FUNCTION region_filter(region STRING)\n   RETURN IF(IS_ACCOUNT_GROUP_MEMBER('managers'), true, region = 'US');\n\n   ALTER TABLE sales_orders SET ROW FILTER region_filter ON (region);\n   ```\n\n2. **Column Masks (`COLUMN MASK`)**:\n   - Mask sensitive columns like credit cards or emails:\n   ```sql\n   CREATE FUNCTION mask_ssn(ssn STRING)\n   RETURN IF(IS_ACCOUNT_GROUP_MEMBER('hr_admin'), ssn, '***-**-****');\n\n   ALTER TABLE employees ALTER COLUMN ssn SET MASK mask_ssn;\n   ```"}, {"id": 114, "question": "What are Serverless SQL Warehouses in Databricks, and what are their benefits?", "difficulty": "Intermediate", "category": "Databricks & Lakehouse Platform", "answer_html": "<p class=\"prose-p\"><strong>Serverless SQL Warehouses</strong> are fully managed compute endpoints running in the Databricks serverless compute plane:</p>\n<p class=\"prose-p\"><strong>Key Benefits:</strong></p>\n<ol class=\"ordered-list\">\n<li><strong>Instant Startup</strong>: Starts in <strong>under 10 seconds</strong> compared to 3-5 minutes for classic VM clusters.</li>\n<li><strong>Aggressive Auto-Stop</strong>: Default auto-stop of 1-5 minutes of inactivity, saving DBU costs.</li>\n<li><strong>Intelligent Autoscaling</strong>: Rapidly scales up/down multi-cluster warehouses during concurrency spikes (e.g. morning Power BI dashboard refreshes).</li>\n<li><strong>Built-in Photon Engine</strong>: Optimized for vectorized SQL query speeds.</li>\n</ol>", "raw_answer": "**Serverless SQL Warehouses** are fully managed compute endpoints running in the Databricks serverless compute plane:\n\n**Key Benefits:**\n1. **Instant Startup**: Starts in **under 10 seconds** compared to 3-5 minutes for classic VM clusters.\n2. **Aggressive Auto-Stop**: Default auto-stop of 1-5 minutes of inactivity, saving DBU costs.\n3. **Intelligent Autoscaling**: Rapidly scales up/down multi-cluster warehouses during concurrency spikes (e.g. morning Power BI dashboard refreshes).\n4. **Built-in Photon Engine**: Optimized for vectorized SQL query speeds."}, {"id": 115, "question": "What is the difference between Streaming Tables and Materialized Views in Delta Live Tables?", "difficulty": "Advanced", "category": "Databricks & Lakehouse Platform", "answer_html": "<div class=\"table-container\"><table class=\"data-table\">\n<thead><tr>\n<th>Dimension</th>\n<th>Streaming Table (<code class=\"inline-code\">dlt.read_stream</code>)</th>\n<th>Materialized View (<code class=\"inline-code\">dlt.read</code>)</th>\n</tr></thead><tbody>\n<tr>\n<td><strong>Ingestion Type</strong></td>\n<td>Incremental / Append-only</td>\n<td>Snapshot / Full recalculation or incremental aggregation</td>\n</tr>\n<tr>\n<td><strong>State Tracking</strong></td>\n<td>Uses streaming checkpoint offsets</td>\n<td>Managed by DLT engine based on upstream query graph</td>\n</tr>\n<tr>\n<td><strong>Best For</strong></td>\n<td>High-volume raw ingestion (Bronze), append-only event streams</td>\n<td>Conformed dimensions (Silver), KPI dashboards, business aggregates (Gold)</td>\n</tr>\n<tr>\n<td><strong>Source Data Changes</strong></td>\n<td>Requires append-only or CDC</td>\n<td>Can reflect updates and deletes in source tables</td>\n</tr>\n</tbody>\n</table></div>", "raw_answer": "| Dimension | Streaming Table (`dlt.read_stream`) | Materialized View (`dlt.read`) |\n| :--- | :--- | :--- |\n| **Ingestion Type** | Incremental / Append-only | Snapshot / Full recalculation or incremental aggregation |\n| **State Tracking** | Uses streaming checkpoint offsets | Managed by DLT engine based on upstream query graph |\n| **Best For** | High-volume raw ingestion (Bronze), append-only event streams | Conformed dimensions (Silver), KPI dashboards, business aggregates (Gold) |\n| **Source Data Changes**| Requires append-only or CDC | Can reflect updates and deletes in source tables |"}];

        let currentDeck = 'concepts';

        function replaceSlideCopy(slide, rawBefore, rawAfter, htmlBefore, htmlAfter) {
            if (!slide.raw_md.includes(rawBefore) || !slide.body_html.includes(htmlBefore)) {
                throw new Error(`Could not apply a content correction to "${slide.title}".`);

            slide.raw_md = slide.raw_md.replace(rawBefore, rawAfter);
            slide.body_html = slide.body_html.replace(htmlBefore, htmlAfter);
        }

        replaceSlideCopy(

            title: 'CAP Theorem & BASE',
            raw_md: `## CAP Theorem & BASE

### CAP Theorem
CAP describes a trade-off during a network partition: a distributed system cannot guarantee both:
- **Consistency**: A read returns the latest committed value (linearizability), or an error.
- **Availability**: Every request to a non-failing node receives a successful response, though it may be stale.
- **Partition Tolerance**: The system continues operating despite network communication failures.

For a system that must tolerate partitions, the practical choice during a partition is whether to reject/delay some requests to preserve consistency or respond while allowing stale/conflicting data. The CP/AP labels depend on the system, operation, and configuration.

### BASE
BASE (Basically Available, Soft state, Eventually consistent) describes a design that favors availability and convergence in some distributed systems. It is not a direct replacement for ACID; choose consistency and transaction guarantees according to workload requirements.`,

### Message Queues
- Brokers such as RabbitMQ, SQS, and Pulsar differ in retention, acknowledgment, ordering, and delivery guarantees; do not assume one universal default.
- Many queue consumers acknowledge messages, after which the broker may remove them according to product semantics. Some systems also retain messages or support replay.
- Queues commonly support point-to-point work distribution and/or publish-subscribe patterns.

### Event Streaming
- Kafka stores a partitioned append log; ordering is guaranteed within a partition, and consumers track offsets.
- Retention is configured independently of consumption, enabling replay while data remains retained.
- Throughput and latency depend on partitioning, replication, workload, and configuration.

        document.getElementById('concept-count').textContent = conceptsSlides.length;
        document.getElementById('interview-count').textContent = interviewQuestions.length;
        document.getElementById('interview-deck-label').textContent = `${interviewQuestions.length} Questions`;

        let currentSlideIdx = 0;
        let masteredIds = JSON.parse(localStorage.getItem('de_mastered_ids') || '[]');
        document.getElementById('footer-mastery-stat').textContent = `${masteredIds.length}/${interviewQuestions.length} Mastered`;

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof mermaid !== 'undefined') {
                mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
            }
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.body.setAttribute('data-theme', savedTheme);
            renderDeck('concepts');
            document.addEventListener('keydown', handleGlobalKeyNav);
            updateMasteryCounter();
        });

        function toggleTheme() {
            const isLight = document.body.getAttribute('data-theme') === 'light';
            const next = isLight ? 'dark' : 'light';
            document.body.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }

        function handleGlobalKeyNav(e) {
            if (['input', 'textarea', 'select'].includes(document.activeElement.tagName.toLowerCase())) return;
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSlide();
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullScreen();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        }

        function switchDeck(deck) {
            currentDeck = deck;
            currentSlideIdx = 0;
            const buttons = document.querySelectorAll('.deck-segment-btn');
            const map = { 'concepts': 0, 'topics': 1, 'databricks': 2, 'syntax': 3, 'interview': 4, 'simulators': 5 };
            buttons.forEach(b => b.classList.remove('active'));
            if (map[deck] !== undefined) {
                buttons[map[deck]].classList.add('active');
            }
            renderDeck(deck);
        }

        function renderDeck(deck) {
            const docked = document.getElementById('docked-controller');
            if (deck === 'concepts') {
                docked.style.display = 'flex';
                renderSlides(conceptsSlides, 'DE Concept');
            } else if (deck === 'topics') {
                docked.style.display = 'flex';
                renderSlides(topicsSlides, 'PySpark Core');
            } else if (deck === 'databricks') {
                docked.style.display = 'flex';
                renderSlides(databricksSlides, 'Databricks');
            } else if (deck === 'syntax') {
                docked.style.display = 'flex';
                renderSlides(syntaxSlides, 'Code Syntax');
            } else if (deck === 'interview') {
                docked.style.display = 'none';
                renderInterviewConsole();
            } else if (deck === 'simulators') {
                docked.style.display = 'none';
                renderSimulatorsBench();
            }
        }

        function renderSlides(arr, tag) {
            const list = document.getElementById('directory-list');
            list.innerHTML = '';
            document.getElementById('footer-topic-stat').textContent = `${arr.length} Topics`;

            arr.forEach((slide, i) => {
                const li = document.createElement('li');
                li.className = 'directory-nav-item';
                li.innerHTML = `
                    <a class="directory-nav-link ${i === currentSlideIdx ? 'active' : ''}" onclick="goToSlide(${i})">
                        <span><span class="directory-index">${String(i + 1).padStart(2, '0')}</span>${slide.title}</span>
                    </a>
                `;
                list.appendChild(li);
            });

            displaySlide(currentSlideIdx, arr, tag);
        }

        function displaySlide(idx, arr, tag) {
            if (idx < 0) idx = 0;
            if (idx >= arr.length) idx = arr.length - 1;
            currentSlideIdx = idx;

            const slide = arr[idx];
            const viewport = document.getElementById('stage-viewport');
            const isDatabricks = tag === 'Databricks';

            viewport.innerHTML = `
                <div class="stage-canvas">
                    <div class="slide-frame ${idx === 0 && tag === 'DE Concept' ? 'slide-frame-opening' : ''}">
                        <div class="slide-meta-row">
                            <span class="module-stamp ${isDatabricks ? 'stamp-databricks' : ''}">${tag}</span>
                            <span class="slide-index-counter">${String(idx + 1).padStart(2, '0')} / ${String(arr.length).padStart(2, '0')}</span>
                        </div>
                        <h1 class="heading-main">${slide.title}</h1>
                        ${idx === 0 && tag === 'DE Concept' ? `
                            <div class="opening-flow" role="img" aria-label="A data engineering pipeline: collect raw signals, refine trusted data, and serve useful insight.">
                                <div class="opening-flow-node"><strong>Collect</strong><span>raw signals</span></div>
                                <span class="opening-flow-arrow" aria-hidden="true">→</span>
                                <div class="opening-flow-node opening-flow-node--transform"><strong>Refine</strong><span>trusted data</span></div>
                                <span class="opening-flow-arrow" aria-hidden="true">→</span>
                                <div class="opening-flow-node opening-flow-node--serve"><strong>Serve</strong><span>useful insight</span></div>
                            </div>
                        ` : ''}
                        <div class="slide-body-content">
                            ${slide.body_html}
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('dock-counter').textContent = `${String(idx + 1).padStart(2, '0')} of ${String(arr.length).padStart(2, '0')}`;
            const pct = ((idx + 1) / arr.length) * 100;
            document.getElementById('streamer-bar').style.width = pct + '%';

            document.querySelectorAll('.directory-nav-link').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
            });

            if (typeof mermaid !== 'undefined') {
                mermaid.run();
            }
        }

        function nextSlide() {
            const arr = getActiveDeckArray();
            if (arr && currentSlideIdx < arr.length - 1) {
                currentSlideIdx++;
                displaySlide(currentSlideIdx, arr, getActiveTag());
            }
        }

        function prevSlide() {
            const arr = getActiveDeckArray();
            if (arr && currentSlideIdx > 0) {
                currentSlideIdx--;
                displaySlide(currentSlideIdx, arr, getActiveTag());
            }
        }

        function goToSlide(i) {
            const arr = getActiveDeckArray();
            if (arr) {
                displaySlide(i, arr, getActiveTag());
            }
        }

        function getActiveDeckArray() {
            if (currentDeck === 'concepts') return conceptsSlides;
            if (currentDeck === 'topics') return topicsSlides;
            if (currentDeck === 'databricks') return databricksSlides;
            if (currentDeck === 'syntax') return syntaxSlides;
            return null;
        }

        function getActiveTag() {
            if (currentDeck === 'concepts') return 'DE Concept';
            if (currentDeck === 'topics') return 'PySpark Core';
            if (currentDeck === 'databricks') return 'Databricks';
            if (currentDeck === 'syntax') return 'Code Syntax';
            return '';
        }

            categories.forEach(cat => {
                const count = cat === 'All' ? interviewQuestions.length : interviewQuestions.filter(q => q.category === cat).length;
                const li = document.createElement('li');
                li.className = 'directory-nav-item';
                li.innerHTML = `
                    <a class="directory-nav-link ${cat === filterCat ? 'active' : ''}" onclick="renderInterviewConsole('${cat}', '${filterDiff}', '${query}')">

                    </a>
                `;
                list.appendChild(li);
            });

            let filtered = interviewQuestions.filter(q => {
                const matchCat = filterCat === 'All' || q.category === filterCat;

                const matchQ = query === '' ||

            });

            viewport.innerHTML = `
                <div class="qa-drill-console">

                    </div>

            if (typeof mermaid !== 'undefined') {

            }
        }

        function toggleQuestionCard(id) {
            const card = document.getElementById(`qcard-${id}`);
            if (card) {

            }
        }

        let isAllQuestionsOpen = false;
        function toggleExpandAllQuestions() {
            isAllQuestionsOpen = !isAllQuestionsOpen;
            document.querySelectorAll('.qa-record-card').forEach(c => {
                if (isAllQuestionsOpen) c.classList.add('open');
                else c.classList.remove('open');
            });

        function toggleMasteredItem(e, id) {
            e.stopPropagation();
            if (masteredIds.includes(id)) {
                masteredIds = masteredIds.filter(x => x !== id);
            } else {
                masteredIds.push(id);
            }
            localStorage.setItem('de_mastered_ids', JSON.stringify(masteredIds));
            updateMasteryCounter();
            renderInterviewConsole();
        }

        function updateMasteryCounter() {
            document.getElementById('footer-mastery-stat').textContent = `${masteredIds.length}/${interviewQuestions.length} Mastered`;

                            <div class="control-pod">
                                <div class="control-label-row"><span>Daily Active Hours</span><span class="control-val-readout" id="lbl-dbu-hrs">4 Hours</span></div>
                                <input type="range" class="control-slider" id="slider-dbu-hrs" min="0.5" max="24" value="4" step="0.5" oninput="recalcDbuSim()">
                            </div>
                            <div class="control-pod">
                                <div class="control-label-row"><span>Worker Node Count</span><span class="control-val-readout" id="lbl-dbu-workers">4 Workers</span></div>
                                <input type="range" class="control-slider" id="slider-dbu-workers" min="1" max="32" value="4" step="1" oninput="recalcDbuSim()">
                            </div>
                        </div>
                        <div class="diagnostic-readout-box" id="dbu-diagnostic-box">
                        </div>
                    </div>
                </div>
            `;
            recalcMemorySim();
            recalcPartitionSim();
            recalcJoinSim();
            recalcLiquidSim();
            recalcDbuSim();
        }

        function recalcMemorySim() {
            const ramGb = parseFloat(document.getElementById('slider-exec-ram').value);
            const memFrac = parseFloat(document.getElementById('slider-mem-fraction').value);
            const storeFrac = parseFloat(document.getElementById('slider-storage-fraction').value);

            document.getElementById('lbl-exec-ram').textContent = `${ramGb} GB`;
            document.getElementById('lbl-mem-fraction').textContent = memFrac.toFixed(2);
            document.getElementById('lbl-storage-fraction').textContent = storeFrac.toFixed(2);

            const totalMb = ramGb * 1024;
            const reservedMb = 300;
            const usableMb = totalMb - reservedMb;
            const unifiedMb = usableMb * memFrac;
            const userMb = usableMb * (1 - memFrac);
            const storeMb = unifiedMb * storeFrac;
            const execMb = unifiedMb * (1 - storeFrac);

            const pReserved = (reservedMb / totalMb) * 100;
            const pUser = (userMb / totalMb) * 100;
            const pExec = (execMb / totalMb) * 100;
            const pStore = (storeMb / totalMb) * 100;

            document.getElementById('bar-reserved').style.width = pReserved + '%';
            document.getElementById('bar-user').style.width = pUser + '%';
            document.getElementById('bar-exec').style.width = pExec + '%';
            document.getElementById('bar-store').style.width = pStore + '%';

            document.getElementById('readout-user').textContent = `User: ${(userMb / 1024).toFixed(1)} GB (${pUser.toFixed(0)}%)`;
            document.getElementById('readout-exec').textContent = `Execution: ${(execMb / 1024).toFixed(1)} GB (${pExec.toFixed(0)}%)`;
            document.getElementById('readout-store').textContent = `Storage: ${(storeMb / 1024).toFixed(1)} GB (${pStore.toFixed(0)}%)`;
        }

        function recalcPartitionSim() {
            const dataGb = parseFloat(document.getElementById('slider-data-volume').value);
            const parts = parseInt(document.getElementById('slider-shuffle-parts').value);

            document.getElementById('lbl-data-volume').textContent = `${dataGb} GB`;
            document.getElementById('lbl-shuffle-parts').textContent = parts;

            const sizeMb = (dataGb * 1024) / parts;
            const box = document.getElementById('partition-diagnostic-box');

            let badgeColor = 'var(--accent-emerald)';
            let title = 'Optimal Partition Health';
            let msg = 'Partition size falls precisely within the golden 100 MB – 200 MB window for executor multithreading without shuffle spill.';

            if (sizeMb > 500) {
                badgeColor = 'var(--accent-brick)';
                title = '⚠️ Severe Spill & OOM Hazard';
                msg = `Each partition is ${(sizeMb / 1024).toFixed(2)} GB. This heavily exceeds single-core executor capacity and forces disk spills and OutOfMemory failures. Recommended partition target: ~${(dataGb * 1024 / 150).toFixed(0)}.`;
            } else if (sizeMb < 25) {
                badgeColor = 'var(--accent-amber)';
                title = '⚠️ Small Partitions / High Scheduling Overhead';
                msg = `Each partition is only ${sizeMb.toFixed(1)} MB. Creating ${parts} tasks introduces high driver scheduling latency and task metadata bloat. Coalesce partitions or enable Adaptive Query Execution (AQE).`;
            }

            box.innerHTML = `
                <div style="font-size: 1.05rem; font-weight: 700; color: ${badgeColor}; margin-bottom: 6px;">
                    ${title} (${sizeMb.toFixed(1)} MB per partition)
                </div>
                <div style="color: var(--text-body); font-size: 0.92rem;">
                    ${msg}
                </div>
            `;
        }

        function recalcJoinSim() {
            const tableMb = parseFloat(document.getElementById('slider-table-size').value);
            const pred = document.getElementById('select-join-pred').value;

            document.getElementById('lbl-table-size').textContent = `${tableMb} MB`;
            const box = document.getElementById('join-diagnostic-box');

            if (pred === 'nonequi') {
                box.innerHTML = `
                    <div style="font-size: 1.05rem; font-weight: 700; color: var(--accent-brick); margin-bottom: 6px;">
                        Cartesian Product / Broadcast Nested Loop Join (BNLJ)
                    </div>
                    <div style="color: var(--text-body); font-size: 0.92rem;">
                        Without equality (=) in the join predicate, Spark cannot perform hash partitioning. Time complexity escalates to O(M × N). Rewrite using bucketing or range equality approximations.
                    </div>
                `;
            } else if (tableMb <= 10) {
                box.innerHTML = `
                    <div style="font-size: 1.05rem; font-weight: 700; color: var(--accent-emerald); margin-bottom: 6px;">
                        Broadcast Hash Join (BHJ) Selected
                    </div>
                    <div style="color: var(--text-body); font-size: 0.92rem;">
                        Table size (${tableMb} MB) is below the 10 MB threshold (<code>spark.sql.autoBroadcastJoinThreshold</code>). The driver broadcasts the table to all executors; zero network shuffle occurs across the cluster.
                    </div>
                `;
            } else {
                box.innerHTML = `
                    <div style="font-size: 1.05rem; font-weight: 700; color: var(--accent-cyan); margin-bottom: 6px;">
                        Sort Merge Join (SMJ) Selected
                    </div>
                    <div style="color: var(--text-body); font-size: 0.92rem;">
                        Table size (${tableMb} MB) exceeds broadcast limit. Spark will hash-partition both tables on the join keys, sort individual partitions, and merge in linear O(N + M) time.
                    </div>
                `;
            }
        }

        function recalcLiquidSim() {
            const card = parseInt(document.getElementById('slider-card-val').value);
            const vol = parseInt(document.getElementById('slider-vol-val').value);

            document.getElementById('lbl-card-val').textContent = card.toLocaleString() + ' Keys';
            document.getElementById('lbl-vol-val').textContent = `${vol} GB`;

            const box = document.getElementById('liquid-diagnostic-box');
            let hiveWarning = card > 300
                ? '<span style="color:var(--accent-brick);">Severe Small Files Problem (Creates ' + card.toLocaleString() + ' folders, many sub-megabyte files)</span>'
                : '<span style="color:var(--accent-emerald);">Acceptable static folder count</span>';

            let zorderMsg = card > 2000
                ? '<span style="color:var(--accent-amber);">Expensive Z-Order maintenance; full table rewrite required during OPTIMIZE</span>'
                : '<span style="color:var(--accent-cyan);">Moderate rewrite cost</span>';

            box.innerHTML = `
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 12px;">
                    <div style="background: rgba(255,255,255,0.02); padding: 12px; border-radius: 6px; border: 1px solid var(--border-hairline);">
                        <strong style="color: var(--text-heading); font-size: 0.9rem;">1. Traditional Partitioning:</strong><br>
                        <small style="color: var(--text-body);">${hiveWarning}</small>
                    </div>
                    <div style="background: rgba(255,255,255,0.02); padding: 12px; border-radius: 6px; border: 1px solid var(--border-hairline);">
                        <strong style="color: var(--text-heading); font-size: 0.9rem;">2. Z-Ordering:</strong><br>
                        <small style="color: var(--text-body);">${zorderMsg}</small>
                    </div>
                    <div style="background: var(--accent-emerald-dim); padding: 12px; border-radius: 6px; border: 1px solid rgba(0,230,118,0.25);">
                        <strong style="color: var(--accent-emerald); font-size: 0.9rem;">3. Liquid Clustering (CLUSTER BY):</strong><br>
                        <small style="color: var(--accent-emerald);">✓ Optimal layout. Clusters incrementally on write, avoids small files, supports non-destructive key alterations.</small>
                    </div>
                </div>
            `;
        }

        function recalcDbuSim() {
            const arch = document.getElementById('select-cluster-arch').value;
            const hours = parseFloat(document.getElementById('slider-dbu-hrs').value);
            const workers = parseInt(document.getElementById('slider-dbu-workers').value);

            document.getElementById('lbl-dbu-hrs').textContent = `${hours} Hours/day`;
            document.getElementById('lbl-dbu-workers').textContent = `${workers} Workers`;

            let dbuRate = 0;
            let costPerDbu = 0.40;
            let archName = '';
            let note = '';

            if (arch === 'serverless') {
                archName = 'Serverless SQL Warehouse';
                dbuRate = workers * 2.0;
                costPerDbu = 0.22;
                note = 'Rapid auto-stop (1 min idle) and instant startup (<10s) prevent paying for idle VM compute.';
            } else if (arch === 'job') {
                archName = 'Automated Job Cluster';
                dbuRate = workers * 0.75;
                costPerDbu = 0.15;
                note = 'Discounted DBU tier (~50% cheaper than interactive clusters). Standard for scheduled production ETL.';
            } else {
                archName = 'All-Purpose Interactive Cluster';
                dbuRate = workers * 1.5;
                costPerDbu = 0.40;
                note = '⚠️ Highest cost tier. Intended only for notebook experimentation; avoid for automated cron pipelines.';
            }

            const dailyDbu = dbuRate * hours;
            const monthlyCost = dailyDbu * costPerDbu * 30;

            const box = document.getElementById('dbu-diagnostic-box');
            box.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <div style="font-size: 1.1rem; font-weight: 700; color: var(--text-heading);">${archName}</div>
                    <div style="font-size: 1.25rem; font-weight: 800; color: var(--accent-cyan);">$${monthlyCost.toFixed(2)} / month</div>
                </div>
                <div style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 6px;">
                    Estimated Consumption: <strong>${dailyDbu.toFixed(1)} DBUs/day</strong> (~${(dailyDbu * 30).toFixed(0)} DBUs/month)
                </div>
                <div style="font-size: 0.82rem; color: var(--text-body);">
                    💡 ${note}
                </div>
            `;
        }

        function handleUniversalSearch(val) {
            if (!val) return;
            if (currentDeck !== 'interview') {
                switchDeck('interview');
            }
            renderInterviewConsole('All', 'All', val);
        }

        function copyCode(btn) {
            const pre = btn.closest('.code-terminal').querySelector('pre');
            navigator.clipboard.writeText(pre.innerText).then(() => {
                btn.textContent = 'Copied!';
                btn.style.color = 'var(--accent-emerald)';
                setTimeout(() => {
                    btn.textContent = 'Copy';
                    btn.style.color = '';
                }, 1800);
            });
        }
    </script>
</body>
</html>
