t. If it doesn't fit, spill to disk. Re-read from disk when needed.\n  - `MEMORY_ONLY_SER`: Store as serialized Java/Obj bytes in memory (more compact, faster deserialization).\n  - `MEMORY_AND_DISK_SER`: Serialize and store on disk if memory is insufficient.\n  - `DISK_ONLY`: Store only on disk.\n  - `OFF_HEAP`: Store outside JVM heap (Tungsten-related).\n- **Fractional caching**: `cacheTable(\"table\", \"partition\", 0.5)` caches only 50% of partitions.\n- **Uncache**: `uncacheTable()` removes a cached table.", "body_html": "<ul class=\"bullet-list\">\n<li><strong>Caching</strong>: Persisting a DataFrame in memory so subsequent actions are faster. Spark checks if the data is already cached before recomputing.</li>\n<li><strong>Persistence levels</strong>:</li>\n<li><code class=\"inline-code\">MEMORY_ONLY</code>: Store only in memory. If the dataset doesn't fit, some partitions are evicted and recomputed on demand.</li>\n<li><code class=\"inline-code\">MEMORY_AND_DISK</code>: Store in memory first. If it doesn't fit, spill to disk. Re-read from disk when needed.</li>\n<li><code class=\"inline-code\">MEMORY_ONLY_SER</code>: Store as serialized Java/Obj bytes in memory (more compact, faster deserialization).</li>\n<li><code class=\"inline-code\">MEMORY_AND_DISK_SER</code>: Serialize and store on disk if memory is insufficient.</li>\n<li><code class=\"inline-code\">DISK_ONLY</code>: Store only on disk.</li>\n<li><code class=\"inline-code\">OFF_HEAP</code>: Store outside JVM heap (Tungsten-related).</li>\n<li><strong>Fractional caching</strong>: <code class=\"inline-code\">cacheTable(\"table\", \"partition\", 0.5)</code> caches only 50% of partitions.</li>\n<li><strong>Uncache</strong>: <code class=\"inline-code\">uncacheTable()</code> removes a cached table.</li>\n</ul>"}, {"title": "Join Types", "raw_md": "## Join Types\n\n- **Inner Join**: Returns only rows matching in both sides. Non-matching rows are dropped. Most common join type.\n- **Left Outer Join**: All rows from left table, matched rows from right. Non-matching right rows have NULLs.\n- **Right Outer Join**: All rows from right table, matched rows from left. Non-matching left rows have NULLs.\n- **Full Outer Join**: All rows from both sides. Matches where available, NULLs where no match.\n- **Cross Join (Cartesian Product)**: Every row from left combined with every row from right. `result_size = left_size * right_size`. Extremely expensive; use with broadcast hint if one side is very small.\n- **Broadcast Hash Join**: Optimization where the smaller table is broadcast to all executors and joined locally. Enabled by `spark.sql.autoBroadcastJoinThreshold` (default 10MB). Can be forced with `/*+ BROADCAST(t2) */`.\n- **Shuffle Join**: When both sides are large, data is shuffled across the network so matching keys end up on the same partition, then joined locally.", "body_html": "<ul class=\"bullet-list\">\n<li><strong>Inner Join</strong>: Returns only rows matching in both sides. Non-matching rows are dropped. Most common join type.</li>\n<li><strong>Left Outer Join</strong>: All rows from left table, matched rows from right. Non-matching right rows have NULLs.</li>\n<li><strong>Right Outer Join</strong>: All rows from right table, matched rows from left. Non-matching left rows have NULLs.</li>\n<li><strong>Full Outer Join</strong>: All rows from both sides. Matches where available, NULLs where no match.</li>\n<li><strong>Cross Join (Cartesian Product)</strong>: Every row from left combined with every row from right. <code class=\"inline-code\">result_size = left_size * right_size</code>. Extremely expensive; use with broadcast hint if one side is very small.</li>\n<li><strong>Broadcast Hash Join</strong>: Optimization where the smaller table is broadcast to all executors and joined locally. Enabled by <code class=\"inline-code\">spark.sql.autoBroadcastJoinThreshold</code> (default 10MB). Can be forced with <code class=\"inline-code\">/<em>+ BROADCAST(t2) </em>/</code>.</li>\n<li><strong>Shuffle Join</strong>: When both sides are large, data is shuffled across the network so matching keys end up on the same partition, then joined locally.</li>\n</ul>"}, {"title": "UDF, Pandas UDF / Vectorized UDF", "raw_md": "## UDF, Pandas UDF / Vectorized UDF\n\n- **UDF (User-Defined Function)**: Custom Python function applied to each row (or partition). Wraps the function in a Java UDF wrapper. Can cause performance overhead due to serialization/deserialization between JVM and Python.\n- **Pandas UDF (Vectorized UDF)**: Uses Apache Arrow to transfer data between JVM and Python in batch. Instead of row-by-row, entire columns are sent as pandas Series. Significantly faster for row-wise operations. Two types:\n  - **Map-type**: Takes one DataFrame, returns one DataFrame (e.g., `df.map(lambda p: ...)`).\n  - **Reduce-type**: Takes grouped data, returns aggregated result.\n- **Benefits of Pandas UDF**: Arrow-based columnar transfer, avoids Python serialization overhead, leverages pandas vectorized operations, can be 10x-100x faster than scalar UDFs.", "body_html": "<ul class=\"bullet-list\">\n<li><strong>UDF (User-Defined Function)</strong>: Custom Python function applied to each row (or partition). Wraps the function in a Java UDF wrapper. Can cause performance overhead due to serialization/deserialization between JVM and Python.</li>\n<li><strong>Pandas UDF (Vectorized UDF)</strong>: Uses Apache Arrow to transfer data between JVM and Python in batch. Instead of row-by-row, entire columns are sent as pandas Series. Significantly faster for row-wise operations. Two types:</li>\n<li><strong>Map-type</strong>: Takes one DataFrame, returns one DataFrame (e.g., <code class=\"inline-code\">df.map(lambda p: ...)</code>).</li>\n<li><strong>Reduce-type</strong>: Takes grouped data, returns aggregated result.</li>\n<li><strong>Benefits of Pandas UDF</strong>: Arrow-based columnar transfer, avoids Python serialization overhead, leverages pandas vectorized operations, can be 10x-100x faster than scalar UDFs.</li>\n</ul>"}, {"title": "Window Functions", "raw_md": "## Window Functions\n\n- **Window functions**: Calculate a value across a set of rows related to the current row. Do not collapse rows like `GROUP BY`.\n- **Common functions**:\n  - `ROW_NUMBER()`: Assigns sequential number within partition. Useful for top-N per group.\n  - `RANK()`: Assigns rank with gaps for ties (1, 2, 2, 4...).\n  - `DENSE_RANK()`: Assigns rank without gaps (1, 2, 2, 3...).\n  - `LEAD(column, offset)`: Returns value `offset` rows after the current row.\n  - `LAG(column, offset)`: Returns value `offset` rows before the current row.\n  - `SUM() OVER()`: Running total / cumulative sum.\n  - `AVG() OVER()`: Moving average.\n  - `ROW_NUMBER() OVER (PARTITION BY ... ORDER BY ...)`: Rank within groups.\n- **Window specification**: `Window.partitionBy(\"col\").orderBy(\"col\")` defines the frame of rows for the function.\n- **Frame bounds**: `Window.rowsBetween(Window.unboundedPreceding, Window.currentRow)` defines the physical frame for aggregate windows.", "body_html": "<ul class=\"bullet-list\">\n<li><strong>Window functions</strong>: Calculate a value across a set of rows related to the current row. Do not collapse rows like <code class=\"inline-code\">GROUP BY</code>.</li>\n<li><strong>Common functions</strong>:</li>\n<li><code class=\"inline-code\">ROW_NUMBER()</code>: Assigns sequential number within partition. Useful for top-N per group.</li>\n<li><code class=\"inline-code\">RANK()</code>: Assigns rank with gaps for ties (1, 2, 2, 4...).</li>\n<li><code class=\"inline-code\">DENSE_RANK()</code>: Assigns rank without gaps (1, 2, 2, 3...).</li>\n<li><code class=\"inline-code\">LEAD(column, offset)</code>: Returns value <code class=\"inline-code\">offset</code> rows after the current row.</li>\n<li><code class=\"inline-code\">LAG(column, offset)</code>: Returns value <code class=\"inline-code\">offset</code> rows before the current row.</li>\n<li><code class=\"inline-code\">SUM() OVER()</code>: Running total / cumulative sum.</li>\n<li><code class=\"inline-code\">AVG() OVER()</code>: Moving average.</li>\n<li><code class=\"inline-code\">ROW_NUMBER() OVER (PARTITION BY ... ORDER BY ...)</code>: Rank within groups.</li>\n<li><strong>Window specification</strong>: <code class=\"inline-code\">Window.partitionBy(\"col\").orderBy(\"col\")</code> defines the frame of rows for the function.</li>\n<li><strong>Frame bounds</strong>: <code class=\"inline-code\">Window.rowsBetween(Window.unboundedPreceding, Window.currentRow)</code> defines the physical frame for aggregate windows.</li>\n</ul>"}, {"title": "StructType, StructField, Data Types", "raw_md": "## StructType, StructField, Data Types\n\n- **StructType**: A nested schema type that contains multiple fields. Equivalent to a struct or row in other systems.\n- **StructField**: Individual field within a `StructType`. Has name, data type, and nullable flag.\n- **Example**:\n  ```python\n  from pyspark.sql.types import StructType, StructField, StringType, IntegerType\n  schema = StructType([\n      StructField(\"id\", IntegerType(), False),\n      StructField(\"name\", StringType(), True),\n      StructField(\"address\", StructType([\n          StructField(\"city\", StringType(), True),\n          StructField(\"zip\", StringType(), True)\n      ]), True)\n  ])\n  ```\n- **Common Data Types**:\n  - `StringType()`, `IntegerType()`, `LongType()`, `DoubleType()`, `FloatType()`\n  - `BooleanType()`\n  - `DateType()`, `TimestampType()`\n  - `BinaryType()`\n  - `ArrayType(element_type, contains_null)`\n  - `MapType(key_type, value_type)`\n  - `DecimalType(precision, scale)`\n- **Type casting**: `cast(\"string\")`, `cast(\"integer\")` in SQL or DataFrame API.", "body_html": "<ul class=\"bullet-list\">\n<li><strong>StructType</strong>: A nested schema type that contains multiple fields. Equivalent to a struct or row in other systems.</li>\n<li><strong>StructField</strong>: Individual field within a <code class=\"inline-code\">StructType</code>. Has name, data type, and nullable flag.</li>\n<li><strong>Example</strong>:</li>\n</ul>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">  from pyspark.sql.types import StructType, StructField, StringType, IntegerType\n  schema = StructType([\n      StructField(&quot;id&quot;, IntegerType(), False),\n      StructField(&quot;name&quot;, StringType(), True),\n      StructField(&quot;address&quot;, StructType([\n          StructField(&quot;city&quot;, StringType(), True),\n          StructField(&quot;zip&quot;, StringType(), True)\n      ]), True)\n  ])</code></pre></div>\n<ul class=\"bullet-list\">\n<li><strong>Common Data Types</strong>:</li>\n<li><code class=\"inline-code\">StringType()</code>, <code class=\"inline-code\">IntegerType()</code>, <code class=\"inline-code\">LongType()</code>, <code class=\"inline-code\">DoubleType()</code>, <code class=\"inline-code\">FloatType()</code></li>\n<li><code class=\"inline-code\">BooleanType()</code></li>\n<li><code class=\"inline-code\">DateType()</code>, <code class=\"inline-code\">TimestampType()</code></li>\n<li><code class=\"inline-code\">BinaryType()</code></li>\n<li><code class=\"inline-code\">ArrayType(element_type, contains_null)</code></li>\n<li><code class=\"inline-code\">MapType(key_type, value_type)</code></li>\n<li><code class=\"inline-code\">DecimalType(precision, scale)</code></li>\n<li><strong>Type casting</strong>: <code class=\"inline-code\">cast(\"string\")</code>, <code class=\"inline-code\">cast(\"integer\")</code> in SQL or DataFrame API.</li>\n</ul>"}, {"title": "Reading/Writing (JSON, CSV, Parquet, Hive, JDBC)", "raw_md": "## Reading/Writing (JSON, CSV, Parquet, Hive, JDBC)\n\n- **JSON**: \n  - `spark.read.json(\"path\")` - reads JSON files or directory\n  - `df.write.json(\"path\")` - writes as JSON\n  - Multi-line JSON support\n- **CSV**:\n  - `spark.read.csv(\"path\", header=true, inferSchema=true)` - reads with header and schema inference\n  - `df.write.csv(\"path\")` - writes as CSV\n  - Delimiter, quote, escape characters configurable\n- **Parquet**:\n  - `spark.read.parquet(\"path\")` - columnar, compressed, efficient for analytics\n  - `df.write.parquet(\"path\")` - default format for Spark SQL operations\n  - Supports partition pruning, predicate pushdown\n- **Hive**:\n  - Requires Hive dependencies and `spark.sql.catalogImplementation=hive`\n  - `spark.sql(\"CREATE TABLE ... USING hive\")` / `read.table()`\n  - Hive Metastore integration for managing table schemas\n- **JDBC**:\n  - `spark.read.format(\"jdbc\").option(\"url\", ...).option(\"dbtable\", ...).load()`\n  - Essential for integrating with relational databases\n  - Pushdown predicates: `option(\"pushdown\", \"true\")` filters data at the database level", "body_html": "<ul class=\"bullet-list\">\n<li><strong>JSON</strong>:</li>\n<li><code class=\"inline-code\">spark.read.json(\"path\")</code> - reads JSON files or directory</li>\n<li><code class=\"inline-code\">df.write.json(\"path\")</code> - writes as JSON</li>\n<li>Multi-line JSON support</li>\n<li><strong>CSV</strong>:</li>\n<li><code class=\"inline-code\">spark.read.csv(\"path\", header=true, inferSchema=true)</code> - reads with header and schema inference</li>\n<li><code class=\"inline-code\">df.write.csv(\"path\")</code> - writes as CSV</li>\n<li>Delimiter, quote, escape characters configurable</li>\n<li><strong>Parquet</strong>:</li>\n<li><code class=\"inline-code\">spark.read.parquet(\"path\")</code> - columnar, compressed, efficient for analytics</li>\n<li><code class=\"inline-code\">df.write.parquet(\"path\")</code> - default format for Spark SQL operations</li>\n<li>Supports partition pruning, predicate pushdown</li>\n<li><strong>Hive</strong>:</li>\n<li>Requires Hive dependencies and <code class=\"inline-code\">spark.sql.catalogImplementation=hive</code></li>\n<li><code class=\"inline-code\">spark.sql(\"CREATE TABLE ... USING hive\")</code> / <code class=\"inline-code\">read.table()</code></li>\n<li>Hive Metastore integration for managing table schemas</li>\n<li><strong>JDBC</strong>:</li>\n<li><code class=\"inline-code\">spark.read.format(\"jdbc\").option(\"url\", ...).option(\"dbtable\", ...).load()</code></li>\n<li>Essential for integrating with relational databases</li>\n<li>Pushdown predicates: <code class=\"inline-code\">option(\"pushdown\", \"true\")</code> filters data at the database level</li>\n</ul>"}, {"title": "Handling Nulls, Missing Data", "raw_md": "## Handling Nulls, Missing Data\n\n- **Null handling functions**:\n  - `Na.fill(value)` / `Na.fill({col: value})` - replaces nulls with specified value\n  - `Na.replace(old, new)` / `Na.replace({old: new})` - replaces specific values\n  - `coalesce(col1, col2, ...)` - returns first non-null value\n  - `isNull()` / `isNotNull()` - check for nulls\n  - `fillna(value)` - DataFrame version of Na.fill\n- **Drop rows**:\n  - `dropna()` - drops rows containing any null\n  - `dropna(subset=[\"col1\", \"col2\"])` - drops only if specified columns are null\n  - `dropDuplicates()` - removes duplicate rows\n- **Best practices**:\n  - Distinguish between `null` (missing data) and empty string `\"\"`\n  - Use `coalesce()` to provide defaults\n  - Consider the root cause before dropping or filling\n  - For time series, consider forward/backward fill", "body_html": "<ul class=\"bullet-list\">\n<li><strong>Null handling functions</strong>:</li>\n<li><code class=\"inline-code\">Na.fill(value)</code> / <code class=\"inline-code\">Na.fill({col: value})</code> - replaces nulls with specified value</li>\n<li><code class=\"inline-code\">Na.replace(old, new)</code> / <code class=\"inline-code\">Na.replace({old: new})</code> - replaces specific values</li>\n<li><code class=\"inline-code\">coalesce(col1, col2, ...)</code> - returns first non-null value</li>\n<li><code class=\"inline-code\">isNull()</code> / <code class=\"inline-code\">isNotNull()</code> - check for nulls</li>\n<li><code class=\"inline-code\">fillna(value)</code> - DataFrame version of Na.fill</li>\n<li><strong>Drop rows</strong>:</li>\n<li><code class=\"inline-code\">dropna()</code> - drops rows containing any null</li>\n<li><code class=\"inline-code\">dropna(subset=[\"col1\", \"col2\"])</code> - drops only if specified columns are null</li>\n<li><code class=\"inline-code\">dropDuplicates()</code> - removes duplicate rows</li>\n<li><strong>Best practices</strong>:</li>\n<li>Distinguish between <code class=\"inline-code\">null</code> (missing data) and empty string <code class=\"inline-code\">\"\"</code></li>\n<li>Use <code class=\"inline-code\">coalesce()</code> to provide defaults</li>\n<li>Consider the root cause before dropping or filling</li>\n<li>For time series, consider forward/backward fill</li>\n</ul>"}, {"title": "SparkSession Configuration (spark config options, executor memory, cores)", "raw_md": "## SparkSession Configuration (spark config options, executor memory, cores)\n\n- **SparkSession**: The entry point for PySpark programming (replaces `SparkContext` in Spark 2.x). Created via `SparkSession.builder.appName(\"app\").getOrCreate()`.\n- **Key configuration options**:\n  - `spark.app.name`: Application name\n  - `spark.master`: Cluster mode (`local`, `local[*]\", `yarn`, `k8s://...`)\n  - `spark.sql.shuffle.partitions`: Number of partitions for shuffle operations (default 200)\n  - `spark.sql.autoBroadcastJoinThreshold`: Size threshold for auto-broadcast join (default 10MB)\n  - `spark.executor.memory`: Memory per executor (e.g., `2g`, `512m`)\n  - `spark.executor.cores`: CPU cores per executor (default 1)\n  - `spark.executor.instances`: Number of executors (cluster-dependent)\n  - `spark.driver.memory`: Memory for driver\n  - `spark.driver.cores`: CPU cores for driver\n  - `spark.default.parallelism`: Default parallelism for transformations\n- **Setting configs**: `SparkSession.builder.config(\"key\", \"value\")` or `spark.conf.set(\"key\", \"value\")` at runtime", "body_html": "<ul class=\"bullet-list\">\n<li><strong>SparkSession</strong>: The entry point for PySpark programming (replaces <code class=\"inline-code\">SparkContext</code> in Spark 2.x). Created via <code class=\"inline-code\">SparkSession.builder.appName(\"app\").getOrCreate()</code>.</li>\n<li><strong>Key configuration options</strong>:</li>\n<li><code class=\"inline-code\">spark.app.name</code>: Application name</li>\n<li><code class=\"inline-code\">spark.master</code>: Cluster mode (<code class=\"inline-code\">local</code>, <code class=\"inline-code\">local[*]\", </code>yarn<code class=\"inline-code\">, </code>k8s://...`)</li>\n<li><code class=\"inline-code\">spark.sql.shuffle.partitions</code>: Number of partitions for shuffle operations (default 200)</li>\n<li><code class=\"inline-code\">spark.sql.autoBroadcastJoinThreshold</code>: Size threshold for auto-broadcast join (default 10MB)</li>\n<li><code class=\"inline-code\">spark.executor.memory</code>: Memory per executor (e.g., <code class=\"inline-code\">2g</code>, <code class=\"inline-code\">512m</code>)</li>\n<li><code class=\"inline-code\">spark.executor.cores</code>: CPU cores per executor (default 1)</li>\n<li><code class=\"inline-code\">spark.executor.instances</code>: Number of executors (cluster-dependent)</li>\n<li><code class=\"inline-code\">spark.driver.memory</code>: Memory for driver</li>\n<li><code class=\"inline-code\">spark.driver.cores</code>: CPU cores for driver</li>\n<li><code class=\"inline-code\">spark.default.parallelism</code>: Default parallelism for transformations</li>\n<li><strong>Setting configs</strong>: <code class=\"inline-code\">SparkSession.builder.config(\"key\", \"value\")</code> or <code class=\"inline-code\">spark.conf.set(\"key\", \"value\")</code> at runtime</li>\n</ul>"}, {"title": "Spark UI, Debugging, Skew handling", "raw_md": "## Spark UI, Debugging, Skew handling\n\n- **Spark UI**: Web interface available at `http://<driver-host>:4040` (default). Tabs:\n  - **Stages**: View stage breakdown, task counts, duration, shuffle read/write\n  - **Storage**: Cached/persisted data, memory usage\n  - **Environment**: Spark version, configuration, JVM info\n  - **Executors**: List of executors, memory, cores, status\n  - **SQL (Spark SQL)**: Query plans, executed queries\n- **Debugging techniques**:\n  - `df.explain()` - show logical, optimized, and physical plans\n  - `spark.ui` URL from application logs\n  - Broadcast join threshold adjustments\n  - Reduce `shuffle.partitions` if too many tiny partitions\n  - Check executor logs (`stderr`, `stdout`)\n- **Skew handling**:\n  - **Skew**: Some keys have disproportionately large data volume, causing some tasks to take much longer.\n  - **Techniques**:\n    - **Salting**: Add a random prefix to the join key to distribute load across multiple keys\n    - **Skew join optimization**: Spark can detect skewed keys and handle them specially (create separate paths for frequent vs. infrequent keys)\n    - **Broadcast join**: If one side is small enough, broadcast it instead of shuffling\n    - **Increase shuffle partitions**: More partitions can reduce the load per task\n    - **Custom partitioning**: Ensure even distribution of keys", "body_html": "<ul class=\"bullet-list\">\n<li><strong>Spark UI</strong>: Web interface available at <code class=\"inline-code\">http://&lt;driver-host&gt;:4040</code> (default). Tabs:</li>\n<li><strong>Stages</strong>: View stage breakdown, task counts, duration, shuffle read/write</li>\n<li><strong>Storage</strong>: Cached/persisted data, memory usage</li>\n<li><strong>Environment</strong>: Spark version, configuration, JVM info</li>\n<li><strong>Executors</strong>: List of executors, memory, cores, status</li>\n<li><strong>SQL (Spark SQL)</strong>: Query plans, executed queries</li>\n<li><strong>Debugging techniques</strong>:</li>\n<li><code class=\"inline-code\">df.explain()</code> - show logical, optimized, and physical plans</li>\n<li><code class=\"inline-code\">spark.ui</code> URL from application logs</li>\n<li>Broadcast join threshold adjustments</li>\n<li>Reduce <code class=\"inline-code\">shuffle.partitions</code> if too many tiny partitions</li>\n<li>Check executor logs (<code class=\"inline-code\">stderr</code>, <code class=\"inline-code\">stdout</code>)</li>\n<li><strong>Skew handling</strong>:</li>\n<li><strong>Skew</strong>: Some keys have disproportionately large data volume, causing some tasks to take much longer.</li>\n<li><strong>Techniques</strong>:</li>\n<li><strong>Salting</strong>: Add a random prefix to the join key to distribute load across multiple keys</li>\n<li><strong>Skew join optimization</strong>: Spark can detect skewed keys and handle them specially (create separate paths for frequent vs. infrequent keys)</li>\n<li><strong>Broadcast join</strong>: If one side is small enough, broadcast it instead of shuffling</li>\n<li><strong>Increase shuffle partitions</strong>: More partitions can reduce the load per task</li>\n<li><strong>Custom partitioning</strong>: Ensure even distribution of keys</li>\n</ul>"}];
        const databricksSlides = [{"title": "Databricks Lakehouse Concepts", "raw_md": "# Databricks Lakehouse Concepts", "body_html": ""}, {"title": "Databricks Lakehouse Platform Architecture", "raw_md": "## Databricks Lakehouse Platform Architecture\n\n- **Lakehouse Paradigm**: Combines the flexibility and cost-efficiency of data lakes (object storage) with the ACID transactions, governance, and reliability of data warehouses.\n- **Control Plane vs Data Plane**:\n  - **Control Plane**: Hosted in Databricks cloud account. Manages user interface, notebook metadata, workspace configuration, cluster orchestration, and job scheduling.\n  - **Classic Data Plane**: Resides inside the customer cloud account (AWS, Azure, or GCP). Executes Spark clusters, computes workloads, and stores physical data files.\n  - **Serverless Data Plane**: Managed compute resources running within secure, isolated containers in the Databricks network perimeter. Starts within seconds and removes infrastructure management.\n\n```mermaid\nflowchart TD\n    subgraph CP [Databricks Control Plane]\n        UI[\"Web UI & Notebooks\"]\n        Sched[\"Workflows & Job Scheduler\"]\n        UC_Meta[\"Unity Catalog Metadata Service\"]\n    end\n\n    subgraph DP [Data Plane - Customer VPC or Serverless]\n        Driver[\"Driver Node\"]\n        W1[\"Worker Executor 1 (Photon)\"]\n        W2[\"Worker Executor 2 (Photon)\"]\n        Driver --> W1\n        Driver --> W2\n    end\n\n    subgraph Storage [Cloud Object Storage]\n        S3[\"Delta Lake Storage (S3 / ADLS / GCS)\"]\n    end\n\n    CP -->|Secure RPC / Control Commands| DP\n    DP -->|Read / Write Parquet & Delta Log| Storage\n```\n\n---", "body_html": "<ul class=\"bullet-list\">\n<li><strong>Lakehouse Paradigm</strong>: Combines the flexibility and cost-efficiency of data lakes (object storage) with the ACID transactions, governance, and reliability of data warehouses.</li>\n<li><strong>Control Plane vs Data Plane</strong>:</li>\n<li><strong>Control Plane</strong>: Hosted in Databricks cloud account. Manages user interface, notebook metadata, workspace configuration, cluster orchestration, and job scheduling.</li>\n<li><strong>Classic Data Plane</strong>: Resides inside the customer cloud account (AWS, Azure, or GCP). Executes Spark clusters, computes workloads, and stores physical data files.</li>\n<li><strong>Serverless Data Plane</strong>: Managed compute resources running within secure, isolated containers in the Databricks network perimeter. Starts within seconds and removes infrastructure management.</li>\n</ul>\n<div class=\"diagram-shell\"><pre class=\"mermaid\">\nflowchart TD\n    subgraph CP [Databricks Control Plane]\n        UI[&quot;Web UI &amp; Notebooks&quot;]\n        Sched[&quot;Workflows &amp; Job Scheduler&quot;]\n        UC_Meta[&quot;Unity Catalog Metadata Service&quot;]\n    end\n\n    subgraph DP [Data Plane - Customer VPC or Serverless]\n        Driver[&quot;Driver Node&quot;]\n        W1[&quot;Worker Executor 1 (Photon)&quot;]\n        W2[&quot;Worker Executor 2 (Photon)&quot;]\n        Driver --&gt; W1\n        Driver --&gt; W2\n    end\n\n    subgraph Storage [Cloud Object Storage]\n        S3[&quot;Delta Lake Storage (S3 / ADLS / GCS)&quot;]\n    end\n\n    CP --&gt;|Secure RPC / Control Commands| DP\n    DP --&gt;|Read / Write Parquet &amp; Delta Log| Storage\n</pre></div>\n<div class=\"section-divider\"></div>"}, {"title": "Unity Catalog: Universal Governance", "raw_md": "## Unity Catalog: Universal Governance\n\n- **Unity Catalog**: A unified governance solution across files, tables, ML models, and dashboards on any cloud platform.\n- **3-Level Namespace**:\n  - Format: `<catalog>.<schema>.<table>` (or `<catalog>.<schema>.<volume>`).\n  - Replaces legacy Hive Metastore two-level namespace (`<database>.<table>`).\n  - Enables cross-workspace data sharing and clear environment segregation (`dev`, `staging`, `prod`).\n\n```mermaid\ngraph TD\n    Metastore[\"Unity Catalog Metastore\"] --> Cat1[\"Catalog: prod_sales\"]\n    Metastore --> Cat2[\"Catalog: staging_sales\"]\n    Cat1 --> Sch1[\"Schema: raw\"]\n    Cat1 --> Sch2[\"Schema: gold\"]\n    Sch2 --> T1[\"Table: orders (Managed)\"]\n    Sch2 --> T2[\"Table: customers (External)\"]\n    Sch2 --> V1[\"Volume: raw_invoices (Managed Volume)\"]\n```\n\n- **Managed Tables vs External Tables**:\n  - **Managed Tables**: Unity Catalog manages both metadata and physical Parquet files in default metastore storage. Dropping the table deletes both metadata and underlying storage.\n  - **External Tables**: Table metadata registered in Unity Catalog points to custom storage locations. Dropping the table removes only metadata; files remain intact.\n- **Volumes**:\n  - Governed storage units in Unity Catalog for non-tabular files (CSV, JSON, images, audio, PDF, landing directories).\n  - Managed Volumes (storage managed by Databricks) vs External Volumes (points to customer S3/ADLS bucket location).\n- **Fine-Grained Security**:\n  - **Dynamic Row Filtering**: Restricts visible rows based on user role (`CREATE FUNCTION user_filter ... ROW FILTER user_filter ON table`).\n  - **Column Masking**: Obfuscates sensitive PII columns like credit cards and emails at query runtime (`MASK mask_func ON (ssn)`).\n- **Automated Data Lineage**:\n  - Tracks runtime column-level and table-level lineage across queries, notebooks, DLT pipelines, and dashboards without manual configuration.\n\n---", "body_html": "<ul class=\"bullet-list\">\n<li><strong>Unity Catalog</strong>: A unified governance solution across files, tables, ML models, and dashboards on any cloud platform.</li>\n<li><strong>3-Level Namespace</strong>:</li>\n<li>Format: <code class=\"inline-code\">&lt;catalog&gt;.&lt;schema&gt;.&lt;table&gt;</code> (or <code class=\"inline-code\">&lt;catalog&gt;.&lt;schema&gt;.&lt;volume&gt;</code>).</li>\n<li>Replaces legacy Hive Metastore two-level namespace (<code class=\"inline-code\">&lt;database&gt;.&lt;table&gt;</code>).</li>\n<li>Enables cross-workspace data sharing and clear environment segregation (<code class=\"inline-code\">dev</code>, <code class=\"inline-code\">staging</code>, <code class=\"inline-code\">prod</code>).</li>\n</ul>\n<div class=\"diagram-shell\"><pre class=\"mermaid\">\ngraph TD\n    Metastore[&quot;Unity Catalog Metastore&quot;] --&gt; Cat1[&quot;Catalog: prod_sales&quot;]\n    Metastore --&gt; Cat2[&quot;Catalog: staging_sales&quot;]\n    Cat1 --&gt; Sch1[&quot;Schema: raw&quot;]\n    Cat1 --&gt; Sch2[&quot;Schema: gold&quot;]\n    Sch2 --&gt; T1[&quot;Table: orders (Managed)&quot;]\n    Sch2 --&gt; T2[&quot;Table: customers (External)&quot;]\n    Sch2 --&gt; V1[&quot;Volume: raw_invoices (Managed Volume)&quot;]\n</pre></div>\n<ul class=\"bullet-list\">\n<li><strong>Managed Tables vs External Tables</strong>:</li>\n<li><strong>Managed Tables</strong>: Unity Catalog manages both metadata and physical Parquet files in default metastore storage. Dropping the table deletes both metadata and underlying storage.</li>\n<li><strong>External Tables</strong>: Table metadata registered in Unity Catalog points to custom storage locations. Dropping the table removes only metadata; files remain intact.</li>\n<li><strong>Volumes</strong>:</li>\n<li>Governed storage units in Unity Catalog for non-tabular files (CSV, JSON, images, audio, PDF, landing directories).</li>\n<li>Managed Volumes (storage managed by Databricks) vs External Volumes (points to customer S3/ADLS bucket location).</li>\n<li><strong>Fine-Grained Security</strong>:</li>\n<li><strong>Dynamic Row Filtering</strong>: Restricts visible rows based on user role (<code class=\"inline-code\">CREATE FUNCTION user_filter ... ROW FILTER user_filter ON table</code>).</li>\n<li><strong>Column Masking</strong>: Obfuscates sensitive PII columns like credit cards and emails at query runtime (<code class=\"inline-code\">MASK mask_func ON (ssn)</code>).</li>\n<li><strong>Automated Data Lineage</strong>:</li>\n<li>Tracks runtime column-level and table-level lineage across queries, notebooks, DLT pipelines, and dashboards without manual configuration.</li>\n</ul>\n<div class=\"section-divider\"></div>"}, {"title": "Photon Engine: Vectorized C++ Execution", "raw_md": "## Photon Engine: Vectorized C++ Execution\n\n- **What is Photon**: High-performance, vectorized query engine written in C++, developed to replace JVM execution for Lakehouse SQL and DataFrame workloads.\n- **Key Mechanics**:\n  - **Vectorized SIMD Processing**: Executes operations on CPU registers across multiple data records simultaneously instead of row-by-row iteration.\n  - **Direct Memory Management**: Bypasses JVM Heap completely, eliminating Java Garbage Collection (GC) latency and serialization overhead.\n  - **Seamless Fallback**: Photon detects non-supported Spark operations (such as custom Python RDD transformations) and transparently hands them back to standard Spark JVM engine without pipeline failure.\n- **Best Workloads**:\n  - Aggregations, hash joins, sorting, scanning large Parquet/Delta tables, and SQL Warehouses.\n\n```mermaid\nflowchart LR\n    Query[\"SQL / DataFrame Query\"] --> Planner[\"Catalyst Optimizer\"]\n    Planner --> Decision{\"Supported by Photon?\"}\n    Decision -- Yes --> PhotonEngine[\"Photon C++ Engine (Vectorized SIMD / Off-Heap)\"]\n    Decision -- No --> SparkJVM[\"Standard Spark Engine (JVM / Tungsten)\"]\n```\n\n---", "body_html": "<ul class=\"bullet-list\">\n<li><strong>What is Photon</strong>: High-performance, vectorized query engine written in C++, developed to replace JVM execution for Lakehouse SQL and DataFrame workloads.</li>\n<li><strong>Key Mechanics</strong>:</li>\n<li><strong>Vectorized SIMD Processing</strong>: Executes operations on CPU registers across multiple data records simultaneously instead of row-by-row iteration.</li>\n<li><strong>Direct Memory Management</strong>: Bypasses JVM Heap completely, eliminating Java Garbage Collection (GC) latency and serialization overhead.</li>\n<li><strong>Seamless Fallback</strong>: Photon detects non-supported Spark operations (such as custom Python RDD transformations) and transparently hands them back to standard Spark JVM engine without pipeline failure.</li>\n<li><strong>Best Workloads</strong>:</li>\n<li>Aggregations, hash joins, sorting, scanning large Parquet/Delta tables, and SQL Warehouses.</li>\n</ul>\n<div class=\"diagram-shell\"><pre class=\"mermaid\">\nflowchart LR\n    Query[&quot;SQL / DataFrame Query&quot;] --&gt; Planner[&quot;Catalyst Optimizer&quot;]\n    Planner --&gt; Decision{&quot;Supported by Photon?&quot;}\n    Decision -- Yes --&gt; PhotonEngine[&quot;Photon C++ Engine (Vectorized SIMD / Off-Heap)&quot;]\n    Decision -- No --&gt; SparkJVM[&quot;Standard Spark Engine (JVM / Tungsten)&quot;]\n</pre></div>\n<div class=\"section-divider\"></div>"}, {"title": "Liquid Clustering: Next-Generation Data Clustering", "raw_md": "## Liquid Clustering: Next-Generation Data Clustering\n\n- **The Problem with Traditional Partitioning & Z-Ordering**:\n  - Partitioning requires low-cardinality keys. High cardinality causes the Small Files problem.\n  - Z-Ordering requires rewriting entire datasets upon clustering and degrades performance when data patterns drift.\n- **How Liquid Clustering Works**:\n  - Defined simply with: `CLUSTER BY (column_1, column_2, ...)`.\n  - Dynamically clusters data based on incoming query access patterns.\n  - **Incremental Clustering**: Rewrites only newly arrived data without re-clustering historical table data.\n  - **Non-destructive Key Selection**: You can change clustering keys at any time (`ALTER TABLE ... CLUSTER BY (...)`) without rewriting historical files.\n  - Prevents data skew and eliminates manual partition sizing decisions.\n\n| Feature | Traditional Partitioning | Z-Ordering | Liquid Clustering (`CLUSTER BY`) |\n| :--- | :--- | :--- | :--- |\n| **Cardinality Suitability** | Low cardinality only (< a few hundred) | Moderate cardinality | High & low cardinality |\n| **Maintenance Cost** | High (static folder layout) | High (`OPTIMIZE ZORDER` rewrites all files) | Low (incremental clustering during write/optimize) |\n| **Key Flexibility** | Permanent; requires full table rewrite | Must re-run for all files | Instant; alters metadata immediately |\n| **Small Files Risk** | High if over-partitioned | Moderate | Low (automatically maintained) |\n\n---", "body_html": "<ul class=\"bullet-list\">\n<li><strong>The Problem with Traditional Partitioning &amp; Z-Ordering</strong>:</li>\n<li>Partitioning requires low-cardinality keys. High cardinality causes the Small Files problem.</li>\n<li>Z-Ordering requires rewriting entire datasets upon clustering and degrades performance when data patterns drift.</li>\n<li><strong>How Liquid Clustering Works</strong>:</li>\n<li>Defined simply with: <code class=\"inline-code\">CLUSTER BY (column_1, column_2, ...)</code>.</li>\n<li>Dynamically clusters data based on incoming query access patterns.</li>\n<li><strong>Incremental Clustering</strong>: Rewrites only newly arrived data without re-clustering historical table data.</li>\n<li><strong>Non-destructive Key Selection</strong>: You can change clustering keys at any time (<code class=\"inline-code\">ALTER TABLE ... CLUSTER BY (...)</code>) without rewriting historical files.</li>\n<li>Prevents data skew and eliminates manual partition sizing decisions.</li>\n</ul>\n<div class=\"table-container\"><table class=\"data-table\">\n<thead><tr>\n<th>Feature</th>\n<th>Traditional Partitioning</th>\n<th>Z-Ordering</th>\n<th>Liquid Clustering (<code class=\"inline-code\">CLUSTER BY</code>)</th>\n</tr></thead><tbody>\n<tr>\n<td><strong>Cardinality Suitability</strong></td>\n<td>Low cardinality only (&lt; a few hundred)</td>\n<td>Moderate cardinality</td>\n<td>High &amp; low cardinality</td>\n</tr>\n<tr>\n<td><strong>Maintenance Cost</strong></td>\n<td>High (static folder layout)</td>\n<td>High (<code class=\"inline-code\">OPTIMIZE ZORDER</code> rewrites all files)</td>\n<td>Low (incremental clustering during write/optimize)</td>\n</tr>\n<tr>\n<td><strong>Key Flexibility</strong></td>\n<td>Permanent; requires full table rewrite</td>\n<td>Must re-run for all files</td>\n<td>Instant; alters metadata immediately</td>\n</tr>\n<tr>\n<td><strong>Small Files Risk</strong></td>\n<td>High if over-partitioned</td>\n<td>Moderate</td>\n<td>Low (automatically maintained)</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"section-divider\"></div>"}, {"title": "Delta Live Tables (DLT) & Lakeflow Pipelines", "raw_md": "## Delta Live Tables (DLT) & Lakeflow Pipelines\n\n- **Delta Live Tables (DLT)**: Declarative framework for building reliable, production-grade ETL pipelines.\n- **Core Concepts**:\n  - **Declarative Pipeline Definition**: You define *what* tables to produce, and DLT manages orchestration, DAG calculation, error handling, and cluster autoscaling.\n  - **Streaming Tables vs Materialized Views**:\n    - `dlt.read_stream()`: Ingests data incrementally (append-only) via Auto Loader.\n    - `dlt.read()`: Materializes snapshot aggregations and conformed business metrics.\n  - **Expectations (Data Quality Rules)**:\n    - `@dlt.expect(\"valid_id\", \"id IS NOT NULL\")`: Logs quality violation metrics; retains invalid rows.\n    - `@dlt.expect_or_drop(\"valid_price\", \"price > 0\")`: Drops invalid rows from the target table.\n    - `@dlt.expect_or_fail(\"valid_date\", \"order_date IS NOT NULL\")`: Halts pipeline execution immediately upon invalid record detection.\n\n```python\nimport dlt\nfrom pyspark.sql.functions import col, current_timestamp\n\n# Ingestion: Bronze Streaming Table with Auto Loader\n@dlt.table(\n    comment=\"Raw streaming orders ingested via Auto Loader\",\n    table_properties={\"quality\": \"bronze\"}\n)\ndef orders_raw():\n    return (\n        spark.readStream.format(\"cloudFiles\")\n        .option(\"cloudFiles.format\", \"json\")\n        .load(\"/Volumes/prod/raw/landing_orders/\")\n    )\n\n# Silver Table: Cleaned and validated with Expectations\n@dlt.table(\n    comment=\"Validated orders meeting enterprise quality rules\",\n    table_properties={\"quality\": \"silver\"}\n)\n@dlt.expect_or_drop(\"valid_amount\", \"amount > 0\")\n@dlt.expect_or_fail(\"valid_order_id\", \"order_id IS NOT NULL\")\ndef orders_cleaned():\n    return (\n        dlt.read_stream(\"orders_raw\")\n        .select(\"order_id\", \"customer_id\", \"amount\", current_timestamp().alias(\"processed_at\"))\n    )\n```\n\n---", "body_html": "<ul class=\"bullet-list\">\n<li><strong>Delta Live Tables (DLT)</strong>: Declarative framework for building reliable, production-grade ETL pipelines.</li>\n<li><strong>Core Concepts</strong>:</li>\n<li><strong>Declarative Pipeline Definition</strong>: You define <em>what</em> tables to produce, and DLT manages orchestration, DAG calculation, error handling, and cluster autoscaling.</li>\n<li><strong>Streaming Tables vs Materialized Views</strong>:</li>\n<li><code class=\"inline-code\">dlt.read_stream()</code>: Ingests data incrementally (append-only) via Auto Loader.</li>\n<li><code class=\"inline-code\">dlt.read()</code>: Materializes snapshot aggregations and conformed business metrics.</li>\n<li><strong>Expectations (Data Quality Rules)</strong>:</li>\n<li><code class=\"inline-code\">@dlt.expect(\"valid_id\", \"id IS NOT NULL\")</code>: Logs quality violation metrics; retains invalid rows.</li>\n<li><code class=\"inline-code\">@dlt.expect_or_drop(\"valid_price\", \"price &gt; 0\")</code>: Drops invalid rows from the target table.</li>\n<li><code class=\"inline-code\">@dlt.expect_or_fail(\"valid_date\", \"order_date IS NOT NULL\")</code>: Halts pipeline execution immediately upon invalid record detection.</li>\n</ul>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">import dlt\nfrom pyspark.sql.functions import col, current_timestamp\n\n# Ingestion: Bronze Streaming Table with Auto Loader\n@dlt.table(\n    comment=&quot;Raw streaming orders ingested via Auto Loader&quot;,\n    table_properties={&quot;quality&quot;: &quot;bronze&quot;}\n)\ndef orders_raw():\n    return (\n        spark.readStream.format(&quot;cloudFiles&quot;)\n        .option(&quot;cloudFiles.format&quot;, &quot;json&quot;)\n        .load(&quot;/Volumes/prod/raw/landing_orders/&quot;)\n    )\n\n# Silver Table: Cleaned and validated with Expectations\n@dlt.table(\n    comment=&quot;Validated orders meeting enterprise quality rules&quot;,\n    table_properties={&quot;quality&quot;: &quot;silver&quot;}\n)\n@dlt.expect_or_drop(&quot;valid_amount&quot;, &quot;amount &gt; 0&quot;)\n@dlt.expect_or_fail(&quot;valid_order_id&quot;, &quot;order_id IS NOT NULL&quot;)\ndef orders_cleaned():\n    return (\n        dlt.read_stream(&quot;orders_raw&quot;)\n        .select(&quot;order_id&quot;, &quot;customer_id&quot;, &quot;amount&quot;, current_timestamp().alias(&quot;processed_at&quot;))\n    )</code></pre></div>\n<div class=\"section-divider\"></div>"}, {"title": "Databricks Auto Loader (`cloudFiles`)", "raw_md": "## Databricks Auto Loader (`cloudFiles`)\n\n- **What is Auto Loader**: Efficient, production-ready ingestion mechanism for discovering and reading new files in cloud storage.\n- **Key Mechanics**:\n  - **Directory Listing vs File Notification Mode**:\n    - *Directory Listing*: Scales efficiently up to millions of files via optimized lexical scanning.\n    - *File Notification*: Configures cloud storage event queues (AWS SQS, Azure Event Grid, GCP Pub/Sub) to notify Spark when new files land, avoiding storage scanning costs.\n  - **Automatic Schema Inference & Evolution**:\n    - Detects unexpected columns in new JSON or CSV files without pipeline termination.\n    - Stashes unmapped columns safely inside a designated `_rescued_data` column.\n\n```python\ndf_stream = (\n    spark.readStream.format(\"cloudFiles\")\n    .option(\"cloudFiles.format\", \"json\")\n    .option(\"cloudFiles.schemaLocation\", \"/Volumes/prod/meta/schema_checkpoints/orders\")\n    .option(\"cloudFiles.inferColumnTypes\", \"true\")\n    .option(\"cloudFiles.schemaEvolutionMode\", \"addNewColumns\")\n    .load(\"/mnt/raw-storage/incoming-orders/\")\n)\n```\n\n---", "body_html": "<ul class=\"bullet-list\">\n<li><strong>What is Auto Loader</strong>: Efficient, production-ready ingestion mechanism for discovering and reading new files in cloud storage.</li>\n<li><strong>Key Mechanics</strong>:</li>\n<li><strong>Directory Listing vs File Notification Mode</strong>:</li>\n<li><em>Directory Listing</em>: Scales efficiently up to millions of files via optimized lexical scanning.</li>\n<li><em>File Notification</em>: Configures cloud storage event queues (AWS SQS, Azure Event Grid, GCP Pub/Sub) to notify Spark when new files land, avoiding storage scanning costs.</li>\n<li><strong>Automatic Schema Inference &amp; Evolution</strong>:</li>\n<li>Detects unexpected columns in new JSON or CSV files without pipeline termination.</li>\n<li>Stashes unmapped columns safely inside a designated <code class=\"inline-code\">_rescued_data</code> column.</li>\n</ul>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">df_stream = (\n    spark.readStream.format(&quot;cloudFiles&quot;)\n    .option(&quot;cloudFiles.format&quot;, &quot;json&quot;)\n    .option(&quot;cloudFiles.schemaLocation&quot;, &quot;/Volumes/prod/meta/schema_checkpoints/orders&quot;)\n    .option(&quot;cloudFiles.inferColumnTypes&quot;, &quot;true&quot;)\n    .option(&quot;cloudFiles.schemaEvolutionMode&quot;, &quot;addNewColumns&quot;)\n    .load(&quot;/mnt/raw-storage/incoming-orders/&quot;)\n)</code></pre></div>\n<div class=\"section-divider\"></div>"}, {"title": "Databricks Workflows & Lakeflow Jobs", "raw_md": "## Databricks Workflows & Lakeflow Jobs\n\n- **Databricks Workflows**: Fully managed orchestration engine for data pipelines, dbt models, ML training, and alerts.\n- **Core Capabilities**:\n  - **Multi-Task DAGs**: Connect Notebooks, Python scripts, SQL queries, DLT pipelines, and jar files into complex dependency graphs.\n  - **Conditional Execution**: Add `If/Else` conditional branching and `ForEach` task looping.\n  - **Task Values (`dbutils.jobs.taskValues`)**: Pass runtime dynamic values (e.g. batch counts, timestamps) from an upstream task to downstream tasks.\n  - **Repair and Rerun**: Rerun only failed tasks within a multi-task pipeline without re-executing successful upstream dependencies.\n  - **Job Clusters vs All-Purpose Clusters**:\n    - *Job Clusters*: Created specifically for a scheduled job run and terminated immediately upon completion (costs ~50% fewer DBUs than all-purpose clusters).\n    - *All-Purpose Clusters*: Used for interactive development, notebooks, and ad-hoc exploratory work.\n\n---", "body_html": "<ul class=\"bullet-list\">\n<li><strong>Databricks Workflows</strong>: Fully managed orchestration engine for data pipelines, dbt models, ML training, and alerts.</li>\n<li><strong>Core Capabilities</strong>:</li>\n<li><strong>Multi-Task DAGs</strong>: Connect Notebooks, Python scripts, SQL queries, DLT pipelines, and jar files into complex dependency graphs.</li>\n<li><strong>Conditional Execution</strong>: Add <code class=\"inline-code\">If/Else</code> conditional branching and <code class=\"inline-code\">ForEach</code> task looping.</li>\n<li><strong>Task Values (<code class=\"inline-code\">dbutils.jobs.taskValues</code>)</strong>: Pass runtime dynamic values (e.g. batch counts, timestamps) from an upstream task to downstream tasks.</li>\n<li><strong>Repair and Rerun</strong>: Rerun only failed tasks within a multi-task pipeline without re-executing successful upstream dependencies.</li>\n<li><strong>Job Clusters vs All-Purpose Clusters</strong>:</li>\n<li><em>Job Clusters</em>: Created specifically for a scheduled job run and terminated immediately upon completion (costs ~50% fewer DBUs than all-purpose clusters).</li>\n<li><em>All-Purpose Clusters</em>: Used for interactive development, notebooks, and ad-hoc exploratory work.</li>\n</ul>\n<div class=\"section-divider\"></div>"}, {"title": "Databricks Asset Bundles (DABs) & Modern CI/CD", "raw_md": "## Databricks Asset Bundles (DABs) & Modern CI/CD\n\n- **What are DABs**: Declarative Infrastructure-as-Code (IaC) standard for managing, testing, and deploying Databricks projects.\n- **Structure**:\n  - Configured using YAML configuration files (`databricks.yml`).\n  - Defines resources: jobs, pipelines, experiments, and schemas.\n  - Defines environments: `dev`, `staging`, and `prod` targets.\n- **Key CLI Commands**:\n  - `databricks bundle validate`: Verifies syntax and resource definitions.\n  - `databricks bundle deploy -t staging`: Deploys bundle configuration to the staging workspace.\n  - `databricks bundle run -t prod [job_name]`: Triggers pipeline execution in production.\n\n```yaml\n# Example databricks.yml bundle definition\nbundle:\n  name: sales_analytics_pipeline\n\ntargets:\n  dev:\n    mode: development\n    default: true\n    workspace:\n      host: https://adb-dev.azuredatabricks.net\n\n  prod:\n    mode: production\n    workspace:\n      host: https://adb-prod.azuredatabricks.net\n\nresources:\n  jobs:\n    daily_sales_etl:\n      name: \"[${bundle.target}] Daily Sales Pipeline\"\n      tasks:\n        - task_key: run_dlt_pipeline\n          pipeline_task:\n            pipeline_id: ${resources.pipelines.sales_dlt.id}\n```\n\n---", "body_html": "<ul class=\"bullet-list\">\n<li><strong>What are DABs</strong>: Declarative Infrastructure-as-Code (IaC) standard for managing, testing, and deploying Databricks projects.</li>\n<li><strong>Structure</strong>:</li>\n<li>Configured using YAML configuration files (<code class=\"inline-code\">databricks.yml</code>).</li>\n<li>Defines resources: jobs, pipelines, experiments, and schemas.</li>\n<li>Defines environments: <code class=\"inline-code\">dev</code>, <code class=\"inline-code\">staging</code>, and <code class=\"inline-code\">prod</code> targets.</li>\n<li><strong>Key CLI Commands</strong>:</li>\n<li><code class=\"inline-code\">databricks bundle validate</code>: Verifies syntax and resource definitions.</li>\n<li><code class=\"inline-code\">databricks bundle deploy -t staging</code>: Deploys bundle configuration to the staging workspace.</li>\n<li><code class=\"inline-code\">databricks bundle run -t prod [job_name]</code>: Triggers pipeline execution in production.</li>\n</ul>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">yaml</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-yaml\"># Example databricks.yml bundle definition\nbundle:\n  name: sales_analytics_pipeline\n\ntargets:\n  dev:\n    mode: development\n    default: true\n    workspace:\n      host: https://adb-dev.azuredatabricks.net\n\n  prod:\n    mode: production\n    workspace:\n      host: https://adb-prod.azuredatabricks.net\n\nresources:\n  jobs:\n    daily_sales_etl:\n      name: &quot;[${bundle.target}] Daily Sales Pipeline&quot;\n      tasks:\n        - task_key: run_dlt_pipeline\n          pipeline_task:\n            pipeline_id: ${resources.pipelines.sales_dlt.id}</code></pre></div>\n<div class=\"section-divider\"></div>"}, {"title": "Databricks SQL & Serverless Warehouses", "raw_md": "## Databricks SQL & Serverless Warehouses\n\n- **SQL Warehouses**: Optimized compute resources tailored for SQL analytics, BI reports (Power BI, Tableau), and ad-hoc queries.\n- **Classic vs Pro vs Serverless**:\n  - **Classic**: Standard compute running inside customer VPC.\n  - **Pro**: Enhanced with Photon and query optimization features.\n  - **Serverless**: Instant startup (< 10 seconds), automatic vertical and horizontal autoscaling, managed within Databricks secure network.\n- **AI Functions in Databricks SQL**:\n  - Built-in GenAI integration allowing LLM invocations directly inside standard SQL queries:\n  ```sql\n  SELECT \n      review_id,\n      ai_sentiment(review_text) AS sentiment,\n      ai_summarize(review_text, 20) AS short_summary,\n      ai_classify(review_text, ARRAY('Billing', 'Technical', 'Product Quality')) AS category\n  FROM customer_feedback;\n  ```\n\n---", "body_html": "<ul class=\"bullet-list\">\n<li><strong>SQL Warehouses</strong>: Optimized compute resources tailored for SQL analytics, BI reports (Power BI, Tableau), and ad-hoc queries.</li>\n<li><strong>Classic vs Pro vs Serverless</strong>:</li>\n<li><strong>Classic</strong>: Standard compute running inside customer VPC.</li>\n<li><strong>Pro</strong>: Enhanced with Photon and query optimization features.</li>\n<li><strong>Serverless</strong>: Instant startup (&lt; 10 seconds), automatic vertical and horizontal autoscaling, managed within Databricks secure network.</li>\n<li><strong>AI Functions in Databricks SQL</strong>:</li>\n<li>Built-in GenAI integration allowing LLM invocations directly inside standard SQL queries:</li>\n</ul>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">sql</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-sql\">  SELECT \n      review_id,\n      ai_sentiment(review_text) AS sentiment,\n      ai_summarize(review_text, 20) AS short_summary,\n      ai_classify(review_text, ARRAY(&#x27;Billing&#x27;, &#x27;Technical&#x27;, &#x27;Product Quality&#x27;)) AS category\n  FROM customer_feedback;</code></pre></div>\n<div class=\"section-divider\"></div>"}, {"title": "Databricks Connect & Local Development", "raw_md": "## Databricks Connect & Local Development\n\n- **Databricks Connect (v2)**:\n  - Built upon the open-source **Spark Connect** architecture (decoupled client-server communication using gRPC and Apache Arrow).\n  - Enables developers to write and execute PySpark code in their local IDE (VS Code, PyCharm, Cursor) while computation runs remotely on a Databricks cluster.\n  - Supports local unit testing, step-through line-by-line debugging, and standard Git repository workflows.\n\n```python\n# Local Python script using Databricks Connect\nfrom databricks.connect import DatabricksSession\n\n# Connects to remote cluster via Databricks CLI authentication profile\nspark = DatabricksSession.builder.getOrCreate()\n\ndf = spark.read.table(\"prod_sales.gold.orders\")\nprint(f\"Total row count: {df.count()}\")\n```\n\n---", "body_html": "<ul class=\"bullet-list\">\n<li><strong>Databricks Connect (v2)</strong>:</li>\n<li>Built upon the open-source <strong>Spark Connect</strong> architecture (decoupled client-server communication using gRPC and Apache Arrow).</li>\n<li>Enables developers to write and execute PySpark code in their local IDE (VS Code, PyCharm, Cursor) while computation runs remotely on a Databricks cluster.</li>\n<li>Supports local unit testing, step-through line-by-line debugging, and standard Git repository workflows.</li>\n</ul>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\"># Local Python script using Databricks Connect\nfrom databricks.connect import DatabricksSession\n\n# Connects to remote cluster via Databricks CLI authentication profile\nspark = DatabricksSession.builder.getOrCreate()\n\ndf = spark.read.table(&quot;prod_sales.gold.orders&quot;)\nprint(f&quot;Total row count: {df.count()}&quot;)</code></pre></div>\n<div class=\"section-divider\"></div>"}, {"title": "DBUtils (Databricks Utilities) Reference", "raw_md": "## DBUtils (Databricks Utilities) Reference\n\nEssential utility methods for interacting with environment, files, and secrets:\n\n```python\n# 1. File System Operations (dbutils.fs)\ndbutils.fs.ls(\"/Volumes/prod/raw/invoices/\")\ndbutils.fs.cp(\"file:/tmp/local.csv\", \"dbutils:/mnt/datalake/data.csv\")\ndbutils.fs.rm(\"/mnt/datalake/temp_dir/\", recurse=True)\n\n# 2. Secret Management (dbutils.secrets)\ndb_password = dbutils.secrets.get(scope=\"keyvault-scope\", key=\"postgres-admin-password\")\n\n# 3. Notebook Parameter Passing (dbutils.widgets)\ndbutils.widgets.text(\"execution_date\", \"2026-10-10\", \"Processing Date\")\nrun_date = dbutils.widgets.get(\"execution_date\")\n\n# 4. Multi-Task Job Communication (dbutils.jobs.taskValues)\n# Push value in upstream task:\ndbutils.jobs.taskValues.set(key=\"records_processed\", value=15420)\n# Pull value in downstream task:\nrecords = dbutils.jobs.taskValues.get(taskKey=\"upstream_ingest\", key=\"records_processed\")\n```\n\n---", "body_html": "<p class=\"prose-p\">Essential utility methods for interacting with environment, files, and secrets:</p>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\"># 1. File System Operations (dbutils.fs)\ndbutils.fs.ls(&quot;/Volumes/prod/raw/invoices/&quot;)\ndbutils.fs.cp(&quot;file:/tmp/local.csv&quot;, &quot;dbutils:/mnt/datalake/data.csv&quot;)\ndbutils.fs.rm(&quot;/mnt/datalake/temp_dir/&quot;, recurse=True)\n\n# 2. Secret Management (dbutils.secrets)\ndb_password = dbutils.secrets.get(scope=&quot;keyvault-scope&quot;, key=&quot;postgres-admin-password&quot;)\n\n# 3. Notebook Parameter Passing (dbutils.widgets)\ndbutils.widgets.text(&quot;execution_date&quot;, &quot;2026-10-10&quot;, &quot;Processing Date&quot;)\nrun_date = dbutils.widgets.get(&quot;execution_date&quot;)\n\n# 4. Multi-Task Job Communication (dbutils.jobs.taskValues)\n# Push value in upstream task:\ndbutils.jobs.taskValues.set(key=&quot;records_processed&quot;, value=15420)\n# Pull value in downstream task:\nrecords = dbutils.jobs.taskValues.get(taskKey=&quot;upstream_ingest&quot;, key=&quot;records_processed&quot;)</code></pre></div>\n<div class=\"section-divider\"></div>"}, {"title": "Predictive Optimization & Table Maintenance", "raw_md": "## Predictive Optimization & Table Maintenance\n\n- **Predictive Optimization**: Automated Unity Catalog service that analyzes query patterns and table health to schedule maintenance operations autonomously.\n- **Automated Operations**:\n  - **Auto-Compaction**: Compacts small files into optimal 1 GB files without manual `OPTIMIZE` commands.\n  - **Auto-Vacuum**: Cleans obsolete unreferenced files older than table retention periods without risks of manual `VACUUM` mistakes.\n  - **Auto-Clustering**: Applies incremental clustering maintenance when data distribution changes.\n- **Enable on Catalog / Schema / Table**:\n  ```sql\n  ALTER TABLE prod_sales.gold.orders ENABLE PREDICTIVE OPTIMIZATION;\n  ```", "body_html": "<ul class=\"bullet-list\">\n<li><strong>Predictive Optimization</strong>: Automated Unity Catalog service that analyzes query patterns and table health to schedule maintenance operations autonomously.</li>\n<li><strong>Automated Operations</strong>:</li>\n<li><strong>Auto-Compaction</strong>: Compacts small files into optimal 1 GB files without manual <code class=\"inline-code\">OPTIMIZE</code> commands.</li>\n<li><strong>Auto-Vacuum</strong>: Cleans obsolete unreferenced files older than table retention periods without risks of manual <code class=\"inline-code\">VACUUM</code> mistakes.</li>\n<li><strong>Auto-Clustering</strong>: Applies incremental clustering maintenance when data distribution changes.</li>\n<li><strong>Enable on Catalog / Schema / Table</strong>:</li>\n</ul>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">sql</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-sql\">  ALTER TABLE prod_sales.gold.orders ENABLE PREDICTIVE OPTIMIZATION;</code></pre></div>"}];
        const syntaxSlides = [{"title": "PySpark Syntax Reference", "raw_md": "# PySpark Syntax Reference\n\nEssential PySpark syntax with practical code examples, each commented for building interactive slides.\n\n---", "body_html": "<p class=\"prose-p\">Essential PySpark syntax with practical code examples, each commented for building interactive slides.</p>\n<div class=\"section-divider\"></div>"}, {"title": "1. Basic SparkSession Creation and Logging Configuration", "raw_md": "## 1. Basic SparkSession Creation and Logging Configuration\n\n```python\n# Create a SparkSession - the entry point for PySpark SQL functionality\nfrom pyspark.sql import SparkSession\n\nspark = SparkSession.builder \\\n    .appName(\"DataEngineeringApp\") \\\n    .config(\"spark.sql.adaptive.enabled\", \"true\") \\\n    .config(\"spark.sql.adaptive.coalescePartitions.enabled\", \"true\") \\\n    .getOrCreate()\n\n# Configure logging to reduce console verbosity\nspark.sparkContext.setLogLevel(\"WARN\")\n```\n\n---", "body_html": "<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\"># Create a SparkSession - the entry point for PySpark SQL functionality\nfrom pyspark.sql import SparkSession\n\nspark = SparkSession.builder \\\n    .appName(&quot;DataEngineeringApp&quot;) \\\n    .config(&quot;spark.sql.adaptive.enabled&quot;, &quot;true&quot;) \\\n    .config(&quot;spark.sql.adaptive.coalescePartitions.enabled&quot;, &quot;true&quot;) \\\n    .getOrCreate()\n\n# Configure logging to reduce console verbosity\nspark.sparkContext.setLogLevel(&quot;WARN&quot;)</code></pre></div>\n<div class=\"section-divider\"></div>"}, {"title": "2. Reading Data", "raw_md": "## 2. Reading Data\n\n```python\n# Read CSV with header row and automatic schema inference\ndf_csv = spark.read.csv(\n    \"/path/to/data.csv\",\n    header=True,          # Treat first row as column names\n    inferSchema=True,     # Automatically detect column data types\n    sep=\",\",              # Field delimiter\n    nullValue=\"\",         # Strings to treat as null\n    encoding=\"UTF-8\",     # Character encoding\n    mode=\"PERMISSIVE\"     # How to handle malformed records\n)\n\n# Read CSV with explicit schema for type safety and performance\nfrom pyspark.sql.types import StructType, StructField, StringType, IntegerType, DoubleType\n\nschema = StructType([\n    StructField(\"id\", IntegerType(), True),\n    StructField(\"name\", StringType(), True),\n    StructField(\"age\", IntegerType(), True),\n    StructField(\"salary\", DoubleType(), True)\n])\n\ndf_csv = spark.read.csv(\"/path/to/data.csv\", header=True, schema=schema)\n\n# Read JSON file with encoding and multiline support\ndf_json = spark.read.json(\n    \"/path/to/data.json\",\n    encoding=\"UTF-8\",     # Character encoding of the file\n    multiLine=True,       # Parse JSON records spanning multiple lines\n    lineSep=\"\\n\"          # Separator between records\n)\n\n# Read Parquet - columnar format optimized for analytics workloads\ndf_parquet = spark.read.parquet(\"/path/to/data.parquet\")\n\n# Read from JDBC source (e.g., PostgreSQL) with connection properties\njdbc_url = \"jdbc:postgresql://localhost:5432/mydb\"\ndf_jdbc = spark.read \\\n    .format(\"jdbc\") \\\n    .option(\"url\", jdbc_url) \\\n    .option(\"dbtable\", \"schema.table_name\") \\\n    .option(\"user\", \"username\") \\\n    .option(\"password\", \"password\") \\\n    .option(\"driver\", \"org.postgresql.Driver\") \\\n    .option(\"fetchsize\", \"1000\") \\\n    .load()\n```\n\n---", "body_html": "<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\"># Read CSV with header row and automatic schema inference\ndf_csv = spark.read.csv(\n    &quot;/path/to/data.csv&quot;,\n    header=True,          # Treat first row as column names\n    inferSchema=True,     # Automatically detect column data types\n    sep=&quot;,&quot;,              # Field delimiter\n    nullValue=&quot;&quot;,         # Strings to treat as null\n    encoding=&quot;UTF-8&quot;,     # Character encoding\n    mode=&quot;PERMISSIVE&quot;     # How to handle malformed records\n)\n\n# Read CSV with explicit schema for type safety and performance\nfrom pyspark.sql.types import StructType, StructField, StringType, IntegerType, DoubleType\n\nschema = StructType([\n    StructField(&quot;id&quot;, IntegerType(), True),\n    StructField(&quot;name&quot;, StringType(), True),\n    StructField(&quot;age&quot;, IntegerType(), True),\n    StructField(&quot;salary&quot;, DoubleType(), True)\n])\n\ndf_csv = spark.read.csv(&quot;/path/to/data.csv&quot;, header=True, schema=schema)\n\n# Read JSON file with encoding and multiline support\ndf_json = spark.read.json(\n    &quot;/path/to/data.json&quot;,\n    encoding=&quot;UTF-8&quot;,     # Character encoding of the file\n    multiLine=True,       # Parse JSON records spanning multiple lines\n    lineSep=&quot;\\n&quot;          # Separator between records\n)\n\n# Read Parquet - columnar format optimized for analytics workloads\ndf_parquet = spark.read.parquet(&quot;/path/to/data.parquet&quot;)\n\n# Read from JDBC source (e.g., PostgreSQL) with connection properties\njdbc_url = &quot;jdbc:postgresql://localhost:5432/mydb&quot;\ndf_jdbc = spark.read \\\n    .format(&quot;jdbc&quot;) \\\n    .option(&quot;url&quot;, jdbc_url) \\\n    .option(&quot;dbtable&quot;, &quot;schema.table_name&quot;) \\\n    .option(&quot;user&quot;, &quot;username&quot;) \\\n    .option(&quot;password&quot;, &quot;password&quot;) \\\n    .option(&quot;driver&quot;, &quot;org.postgresql.Driver&quot;) \\\n    .option(&quot;fetchsize&quot;, &quot;1000&quot;) \\\n    .load()</code></pre></div>\n<div class=\"section-divider\"></div>"}, {"title": "3. Writing Data", "raw_md": "## 3. Writing Data\n\n```python\n# Write to CSV in overwrite mode - replaces any existing data at the path\ndf.write \\\n    .mode(\"overwrite\") \\\n    .option(\"header\", True) \\\n    .option(\"compression\", \"snappy\") \\\n    .csv(\"/output/path/csv_output\")\n\n# Write to JSON in append mode - adds data alongside existing files\ndf.write \\\n    .mode(\"append\") \\\n    .json(\"/output/path/json_output\")\n\n# Write in ignore mode - silently does nothing if the output path exists\ndf.write \\\n    .mode(\"ignore\") \\\n    .parquet(\"/output/path/parquet_output\")\n\n# Save as a managed table - data and metadata managed by the Spark catalog\ndf.write \\\n    .mode(\"overwrite\") \\\n    .saveAsTable(\"my_database.my_table\")\n\n# Write with partitioning for improved query performance on partitioned columns\ndf.write \\\n    .mode(\"overwrite\") \\\n    .partitionBy(\"year\", \"month\") \\\n    .parquet(\"/output/path/partitioned_data\")\n```\n\n---", "body_html": "<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\"># Write to CSV in overwrite mode - replaces any existing data at the path\ndf.write \\\n    .mode(&quot;overwrite&quot;) \\\n    .option(&quot;header&quot;, True) \\\n    .option(&quot;compression&quot;, &quot;snappy&quot;) \\\n    .csv(&quot;/output/path/csv_output&quot;)\n\n# Write to JSON in append mode - adds data alongside existing files\ndf.write \\\n    .mode(&quot;append&quot;) \\\n    .json(&quot;/output/path/json_output&quot;)\n\n# Write in ignore mode - silently does nothing if the output path exists\ndf.write \\\n    .mode(&quot;ignore&quot;) \\\n    .parquet(&quot;/output/path/parquet_output&quot;)\n\n# Save as a managed table - data and metadata managed by the Spark catalog\ndf.write \\\n    .mode(&quot;overwrite&quot;) \\\n    .saveAsTable(&quot;my_database.my_table&quot;)\n\n# Write with partitioning for improved query performance on partitioned columns\ndf.write \\\n    .mode(&quot;overwrite&quot;) \\\n    .partitionBy(&quot;year&quot;, &quot;month&quot;) \\\n    .parquet(&quot;/output/path/partitioned_data&quot;)</code></pre></div>\n<div class=\"section-divider\"></div>"}, {"title": "4. Selection and Transformation", "raw_md": "## 4. Selection and Transformation\n\n```python\nfrom pyspark.sql.functions import col, lit\n\n# Select specific columns by name\ndf.select(\"column1\", \"column2\").show()\n\n# Select columns using the col() function for column expressions\ndf.select(col(\"column1\"), col(\"column2\")).show()\n\n# Select all columns using the wildcard\ndf.select(\"*\").show()\n\n# Drop one or more columns\ndf.drop(\"unnecessary_col\").show()\ndf.drop(col(\"col1\"), col(\"col2\")).show()\n\n# Add a new computed column using withColumn\ndf.withColumn(\"total_price\", col(\"quantity\") * col(\"unit_price\")).show()\n\n# Add a literal constant column\ndf.withColumn(\"source_system\", lit(\"batch_processing\")).show()\n\n# Rename a single column\ndf.withColumnRenamed(\"old_name\", \"new_name\").show()\n\n# Filter rows using where() with SQL-like conditions\ndf.where(col(\"age\") > 18).show()\n\n# Filter using filter() - equivalent to where()\ndf.filter(col(\"status\") == \"active\").show()\n\n# Combine multiple filter conditions using bitwise operators\ndf.filter((col(\"age\") > 18) & (col(\"status\") == \"active\")).show()\ndf.filter((col(\"age\") < 18) | (col(\"status\") == \"inactive\")).show()\ndf.filter(~(col(\"status\") == \"deleted\")).show()  # Negation\n```\n\n---", "body_html": "<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">from pyspark.sql.functions import col, lit\n\n# Select specific columns by name\ndf.select(&quot;column1&quot;, &quot;column2&quot;).show()\n\n# Select columns using the col() function for column expressions\ndf.select(col(&quot;column1&quot;), col(&quot;column2&quot;)).show()\n\n# Select all columns using the wildcard\ndf.select(&quot;*&quot;).show()\n\n# Drop one or more columns\ndf.drop(&quot;unnecessary_col&quot;).show()\ndf.drop(col(&quot;col1&quot;), col(&quot;col2&quot;)).show()\n\n# Add a new computed column using withColumn\ndf.withColumn(&quot;total_price&quot;, col(&quot;quantity&quot;) * col(&quot;unit_price&quot;)).show()\n\n# Add a literal constant column\ndf.withColumn(&quot;source_system&quot;, lit(&quot;batch_processing&quot;)).show()\n\n# Rename a single column\ndf.withColumnRenamed(&quot;old_name&quot;, &quot;new_name&quot;).show()\n\n# Filter rows using where() with SQL-like conditions\ndf.where(col(&quot;age&quot;) &gt; 18).show()\n\n# Filter using filter() - equivalent to where()\ndf.filter(col(&quot;status&quot;) == &quot;active&quot;).show()\n\n# Combine multiple filter conditions using bitwise operators\ndf.filter((col(&quot;age&quot;) &gt; 18) &amp; (col(&quot;status&quot;) == &quot;active&quot;)).show()\ndf.filter((col(&quot;age&quot;) &lt; 18) | (col(&quot;status&quot;) == &quot;inactive&quot;)).show()\ndf.filter(~(col(&quot;status&quot;) == &quot;deleted&quot;)).show()  # Negation</code></pre></div>\n<div class=\"section-divider\"></div>"}, {"title": "5. Aggregations", "raw_md": "## 5. Aggregations\n\n```python\nfrom pyspark.sql import functions as F\n\n# Group by a column and compute multiple aggregate metrics\ndf.groupBy(\"department\").agg(\n    F.sum(\"salary\").alias(\"total_salary\"),\n    F.avg(\"salary\").alias(\"avg_salary\"),\n    F.count(\"*\").alias(\"headcount\")\n).show()\n\n# Count distinct values within each group\ndf.groupBy(\"department\").agg(\n    F.countDistinct(\"employee_id\").alias(\"unique_employees\")\n).show()\n\n# Min, max, first, and last with named output columns\ndf.groupBy(\"department\").agg(\n    F.min(\"salary\").alias(\"min_salary\"),\n    F.max(\"salary\").alias(\"max_salary\"),\n    F.first(\"hire_date\").alias(\"earliest_hire\"),\n    F.last(\"hire_date\").alias(\"most_recent_hire\")\n).show()\n\n# Use expr() for SQL expression-based aggregations\ndf.groupBy(\"department\").agg(\n    F.expr(\"sum(salary) as total_salary\"),\n    F.expr(\"avg(salary) as avg_salary\"),\n    F.expr(\"count(*) as employee_count\")\n).show()\n\n# Compute multiple global aggregations across the entire DataFrame\ndf.agg(\n    F.sum(\"revenue\").alias(\"total_revenue\"),\n    F.avg(\"revenue\").alias(\"avg_revenue\"),\n    F.max(\"revenue\").alias(\"max_revenue\"),\n    F.min(\"revenue\").alias(\"min_revenue\")\n).show()\n\n# Count total rows and count non-null values in a specific column\ndf.groupBy(\"department\").agg(\n    F.count(\"*\").alias(\"total_rows\"),\n    F.count(\"salary\").alias(\"non_null_salaries\")\n).show()\n```\n\n---", "body_html": "<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">from pyspark.sql import functions as F\n\n# Group by a column and compute multiple aggregate metrics\ndf.groupBy(&quot;department&quot;).agg(\n    F.sum(&quot;salary&quot;).alias(&quot;total_salary&quot;),\n    F.avg(&quot;salary&quot;).alias(&quot;avg_salary&quot;),\n    F.count(&quot;*&quot;).alias(&quot;headcount&quot;)\n).show()\n\n# Count distinct values within each group\ndf.groupBy(&quot;department&quot;).agg(\n    F.countDistinct(&quot;employee_id&quot;).alias(&quot;unique_employees&quot;)\n).show()\n\n# Min, max, first, and last with named output columns\ndf.groupBy(&quot;department&quot;).agg(\n    F.min(&quot;salary&quot;).alias(&quot;min_salary&quot;),\n    F.max(&quot;salary&quot;).alias(&quot;max_salary&quot;),\n    F.first(&quot;hire_date&quot;).alias(&quot;earliest_hire&quot;),\n    F.last(&quot;hire_date&quot;).alias(&quot;most_recent_hire&quot;)\n).show()\n\n# Use expr() for SQL expression-based aggregations\ndf.groupBy(&quot;department&quot;).agg(\n    F.expr(&quot;sum(salary) as total_salary&quot;),\n    F.expr(&quot;avg(salary) as avg_salary&quot;),\n    F.expr(&quot;count(*) as employee_count&quot;)\n).show()\n\n# Compute multiple global aggregations across the entire DataFrame\ndf.agg(\n    F.sum(&quot;revenue&quot;).alias(&quot;total_revenue&quot;),\n    F.avg(&quot;revenue&quot;).alias(&quot;avg_revenue&quot;),\n    F.max(&quot;revenue&quot;).alias(&quot;max_revenue&quot;),\n    F.min(&quot;revenue&quot;).alias(&quot;min_revenue&quot;)\n).show()\n\n# Count total rows and count non-null values in a specific column\ndf.groupBy(&quot;department&quot;).agg(\n    F.count(&quot;*&quot;).alias(&quot;total_rows&quot;),\n    F.count(&quot;salary&quot;).alias(&quot;non_null_salaries&quot;)\n).show()</code></pre></div>\n<div class=\"section-divider\"></div>"}, {"title": "6. Window Functions", "raw_md": "## 6. Window Functions\n\n```python\nfrom pyspark.sql.window import Window\nfrom pyspark.sql import functions as F\n\n# Define a window: partitioned by department, ordered by salary descending\nwindow_spec = Window \\\n    .partitionBy(\"department\") \\\n    .orderBy(F.desc(\"salary\"))\n\n# Apply ranking functions over the window\ndf.withColumn(\"row_number\", F.row_number().over(window_spec)) \\\n  .withColumn(\"rank\", F.rank().over(window_spec)) \\\n  .withColumn(\"dense_rank\", F.dense_rank().over(window_spec)) \\\n  .show()\n\n# Sliding window: 3 rows before and 3 rows after the current row\nwindow_rows = Window \\\n    .partitionBy(\"department\") \\\n    .orderBy(\"hire_date\") \\\n    .rowsBetween(-3, 3)    # 3 preceding to 3 following rows\n\ndf.withColumn(\"rolling_avg_salary\", F.avg(\"salary\").over(window_rows)).show()\n\n# Range-based window: within 30 days before the current row\nwindow_range = Window \\\n    .partitionBy(\"department\") \\\n    .orderBy(F.col(\"hire_date\").cast(\"long\")) \\\n    .rangeBetween(-30 * 86400, 0)   # 30 days in seconds (unix timestamp)\n\ndf.withColumn(\"monthly_avg_salary\", F.avg(\"salary\").over(window_range)).show()\n\n# Cumulative sum from the start of the partition to the current row\nwindow_cumsum = Window \\\n    .partitionBy(\"department\") \\\n    .orderBy(\"salary\") \\\n    .rowsBetween(Window.unboundedPreceding, 0)\n\ndf.withColumn(\"cumulative_salary\", F.sum(\"salary\").over(window_cumsum)).show()\n\n# Lag and lead functions for comparing rows within a window\nwindow_ordered = Window.partitionBy(\"department\").orderBy(\"hire_date\")\ndf.withColumn(\"prev_salary\", F.lag(\"salary\", 1).over(window_ordered)) \\\n  .withColumn(\"next_salary\", F.lead(\"salary\", 1).over(window_ordered)) \\\n  .show()\n```\n\n---", "body_html": "<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">from pyspark.s
