ql.window import Window\nfrom pyspark.sql import functions as F\n\n# Define a window: partitioned by department, ordered by salary descending\nwindow_spec = Window \\\n    .partitionBy(&quot;department&quot;) \\\n    .orderBy(F.desc(&quot;salary&quot;))\n\n# Apply ranking functions over the window\ndf.withColumn(&quot;row_number&quot;, F.row_number().over(window_spec)) \\\n  .withColumn(&quot;rank&quot;, F.rank().over(window_spec)) \\\n  .withColumn(&quot;dense_rank&quot;, F.dense_rank().over(window_spec)) \\\n  .show()\n\n# Sliding window: 3 rows before and 3 rows after the current row\nwindow_rows = Window \\\n    .partitionBy(&quot;department&quot;) \\\n    .orderBy(&quot;hire_date&quot;) \\\n    .rowsBetween(-3, 3)    # 3 preceding to 3 following rows\n\ndf.withColumn(&quot;rolling_avg_salary&quot;, F.avg(&quot;salary&quot;).over(window_rows)).show()\n\n# Range-based window: within 30 days before the current row\nwindow_range = Window \\\n    .partitionBy(&quot;department&quot;) \\\n    .orderBy(F.col(&quot;hire_date&quot;).cast(&quot;long&quot;)) \\\n    .rangeBetween(-30 * 86400, 0)   # 30 days in seconds (unix timestamp)\n\ndf.withColumn(&quot;monthly_avg_salary&quot;, F.avg(&quot;salary&quot;).over(window_range)).show()\n\n# Cumulative sum from the start of the partition to the current row\nwindow_cumsum = Window \\\n    .partitionBy(&quot;department&quot;) \\\n    .orderBy(&quot;salary&quot;) \\\n    .rowsBetween(Window.unboundedPreceding, 0)\n\ndf.withColumn(&quot;cumulative_salary&quot;, F.sum(&quot;salary&quot;).over(window_cumsum)).show()\n\n# Lag and lead functions for comparing rows within a window\nwindow_ordered = Window.partitionBy(&quot;department&quot;).orderBy(&quot;hire_date&quot;)\ndf.withColumn(&quot;prev_salary&quot;, F.lag(&quot;salary&quot;, 1).over(window_ordered)) \\\n  .withColumn(&quot;next_salary&quot;, F.lead(&quot;salary&quot;, 1).over(window_ordered)) \\\n  .show()</code></pre></div>\n<div class=\"section-divider\"></div>"}, {"title": "7. Joins", "raw_md": "## 7. Joins\n\n```python\n# Inner join - only rows with matching keys in both DataFrames\ndf_inner = df1.join(df2, on=\"id\", how=\"inner\")\n\n# Left (left_outer) join - all rows from left, matching from right\ndf_left = df1.join(df2, on=\"id\", how=\"left\")\ndf_left_outer = df1.join(df2, on=\"id\", how=\"left_outer\")\n\n# Right (right_outer) join - all rows from right, matching from left\ndf_right = df1.join(df2, on=\"id\", how=\"right\")\ndf_right_outer = df1.join(df2, on=\"id\", how=\"right_outer\")\n\n# Full (full_outer) join - all rows from both sides, nulls where no match\ndf_full = df1.join(df2, on=\"id\", how=\"full\")\ndf_full_outer = df1.join(df2, on=\"id\", how=\"full_outer\")\n\n# Cross join - Cartesian product (use cautiously; can produce very large results)\ndf_cross = df1.crossJoin(df2)  # No join condition needed\n\n# Semi join - returns left rows where at least one match exists in right\ndf_semi = df1.join(df2, on=\"id\", how=\"left_semi\")\n\n# Anti join - returns left rows where no match exists in right\ndf_anti = df1.join(df2, on=\"id\", how=\"left_anti\")\n\n# Join using multiple conditions with Column objects\ndf_multi = df1.join(\n    df2,\n    (df1[\"id\"] == df2[\"id\"]) & (df1[\"date\"] == df2[\"date\"]),\n    how=\"inner\"\n)\n\n# Join using a list of column names\ndf_cols = df1.join(df2, [\"id\", \"date\"], how=\"inner\")\n```\n\n---", "body_html": "<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\"># Inner join - only rows with matching keys in both DataFrames\ndf_inner = df1.join(df2, on=&quot;id&quot;, how=&quot;inner&quot;)\n\n# Left (left_outer) join - all rows from left, matching from right\ndf_left = df1.join(df2, on=&quot;id&quot;, how=&quot;left&quot;)\ndf_left_outer = df1.join(df2, on=&quot;id&quot;, how=&quot;left_outer&quot;)\n\n# Right (right_outer) join - all rows from right, matching from left\ndf_right = df1.join(df2, on=&quot;id&quot;, how=&quot;right&quot;)\ndf_right_outer = df1.join(df2, on=&quot;id&quot;, how=&quot;right_outer&quot;)\n\n# Full (full_outer) join - all rows from both sides, nulls where no match\ndf_full = df1.join(df2, on=&quot;id&quot;, how=&quot;full&quot;)\ndf_full_outer = df1.join(df2, on=&quot;id&quot;, how=&quot;full_outer&quot;)\n\n# Cross join - Cartesian product (use cautiously; can produce very large results)\ndf_cross = df1.crossJoin(df2)  # No join condition needed\n\n# Semi join - returns left rows where at least one match exists in right\ndf_semi = df1.join(df2, on=&quot;id&quot;, how=&quot;left_semi&quot;)\n\n# Anti join - returns left rows where no match exists in right\ndf_anti = df1.join(df2, on=&quot;id&quot;, how=&quot;left_anti&quot;)\n\n# Join using multiple conditions with Column objects\ndf_multi = df1.join(\n    df2,\n    (df1[&quot;id&quot;] == df2[&quot;id&quot;]) &amp; (df1[&quot;date&quot;] == df2[&quot;date&quot;]),\n    how=&quot;inner&quot;\n)\n\n# Join using a list of column names\ndf_cols = df1.join(df2, [&quot;id&quot;, &quot;date&quot;], how=&quot;inner&quot;)</code></pre></div>\n<div class=\"section-divider\"></div>"}, {"title": "8. Distinct and Missing Data Handling", "raw_md": "## 8. Distinct and Missing Data Handling\n\n```python\n# Select all distinct rows - removes duplicate rows entirely\ndf_distinct = df.distinct()\n\n# Drop duplicate rows based on specific columns only\ndf_drop_dups = df.dropDuplicates([\"col1\", \"col2\"])\n\n# Fill null values with specified replacement values\ndf_filled = df.na.fill({\n    \"age\": 0,\n    \"name\": \"Unknown\",\n    \"salary\": 50000\n})\n\n# Drop rows containing null values\ndf_drop_any = df.na.drop(how=\"any\")                          # Any null drops the row\ndf_drop_subset = df.na.drop(how=\"any\", subset=[\"critical_col1\", \"critical_col2\"])\ndf_drop_thresh = df.na.drop(thresh=2)                       # Keep rows with at least 2 non-null\n\n# Replace specific values in a column\ndf_replaced = df.na.replace(\"old_value\", \"new_value\", \"column_name\")\n\n# Replace multiple values at once\ndf_replace_multi = df.na.replace(\n    [\"val1\", \"val2\"],\n    [\"new_val1\", \"new_val2\"],\n    \"status\"\n)\n\n# Fill with a simple value across all columns of a given type\ndf_fill_simple = df.na.fill(\"N/A\")  # Fill all string columns with \"N/A\"\ndf_fill_int = df.na.fill(0, [\"age\", \"count\", \"score\"])  # Fill specific numeric columns\n```\n\n---", "body_html": "<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\"># Select all distinct rows - removes duplicate rows entirely\ndf_distinct = df.distinct()\n\n# Drop duplicate rows based on specific columns only\ndf_drop_dups = df.dropDuplicates([&quot;col1&quot;, &quot;col2&quot;])\n\n# Fill null values with specified replacement values\ndf_filled = df.na.fill({\n    &quot;age&quot;: 0,\n    &quot;name&quot;: &quot;Unknown&quot;,\n    &quot;salary&quot;: 50000\n})\n\n# Drop rows containing null values\ndf_drop_any = df.na.drop(how=&quot;any&quot;)                          # Any null drops the row\ndf_drop_subset = df.na.drop(how=&quot;any&quot;, subset=[&quot;critical_col1&quot;, &quot;critical_col2&quot;])\ndf_drop_thresh = df.na.drop(thresh=2)                       # Keep rows with at least 2 non-null\n\n# Replace specific values in a column\ndf_replaced = df.na.replace(&quot;old_value&quot;, &quot;new_value&quot;, &quot;column_name&quot;)\n\n# Replace multiple values at once\ndf_replace_multi = df.na.replace(\n    [&quot;val1&quot;, &quot;val2&quot;],\n    [&quot;new_val1&quot;, &quot;new_val2&quot;],\n    &quot;status&quot;\n)\n\n# Fill with a simple value across all columns of a given type\ndf_fill_simple = df.na.fill(&quot;N/A&quot;)  # Fill all string columns with &quot;N/A&quot;\ndf_fill_int = df.na.fill(0, [&quot;age&quot;, &quot;count&quot;, &quot;score&quot;])  # Fill specific numeric columns</code></pre></div>\n<div class=\"section-divider\"></div>"}, {"title": "9. User Defined Functions (UDFs)", "raw_md": "## 9. User Defined Functions (UDFs)\n\n```python\nfrom pyspark.sql.functions import udf, pandas_udf\nfrom pyspark.sql.types import StringType, IntegerType\nimport pandas as pd\n\n# Create a simple Python UDF to categorize age groups\ndef categorize_age(age):\n    \"\"\"Return an age group label based on the numeric age.\"\"\"\n    if age is None:\n        return \"Unknown\"\n    elif age < 18:\n        return \"Minor\"\n    elif age < 65:\n        return \"Adult\"\n    else:\n        return \"Senior\"\n\n# Register the function as a UDF with its return type\nage_udf = udf(categorize_age, StringType())\n\n# Apply the UDF to a DataFrame column\ndf.withColumn(\"age_group\", age_udf(col(\"age\"))).show()\n\n# Pandas UDF (vectorized) - much more efficient than standard Python UDFs\n@pandas_udf(\"double\")\ndef pandas_double_age(age_series: pd.Series) -> pd.Series:\n    \"\"\"Vectorized transformation using pandas Series operations.\"\"\"\n    return age_series * 2\n\ndf.withColumn(\"doubled_age\", pandas_double_age(col(\"age\"))).show()\n\n# Pandas UDF for grouped map operations - process each group as a pandas DataFrame\n@pandas_udf(\"int double_age\")\ndef pandas_process_group(df: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"Apply a transformation to each group and return a new DataFrame.\"\"\"\n    df[\"double_age\"] = df[\"age\"] * 2\n    return df\n\ndf.groupBy(\"department\").applyInPandas(\n    pandas_process_group,\n    schema=\"int double_age\"\n).show()\n```\n\n---", "body_html": "<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">from pyspark.sql.functions import udf, pandas_udf\nfrom pyspark.sql.types import StringType, IntegerType\nimport pandas as pd\n\n# Create a simple Python UDF to categorize age groups\ndef categorize_age(age):\n    &quot;&quot;&quot;Return an age group label based on the numeric age.&quot;&quot;&quot;\n    if age is None:\n        return &quot;Unknown&quot;\n    elif age &lt; 18:\n        return &quot;Minor&quot;\n    elif age &lt; 65:\n        return &quot;Adult&quot;\n    else:\n        return &quot;Senior&quot;\n\n# Register the function as a UDF with its return type\nage_udf = udf(categorize_age, StringType())\n\n# Apply the UDF to a DataFrame column\ndf.withColumn(&quot;age_group&quot;, age_udf(col(&quot;age&quot;))).show()\n\n# Pandas UDF (vectorized) - much more efficient than standard Python UDFs\n@pandas_udf(&quot;double&quot;)\ndef pandas_double_age(age_series: pd.Series) -&gt; pd.Series:\n    &quot;&quot;&quot;Vectorized transformation using pandas Series operations.&quot;&quot;&quot;\n    return age_series * 2\n\ndf.withColumn(&quot;doubled_age&quot;, pandas_double_age(col(&quot;age&quot;))).show()\n\n# Pandas UDF for grouped map operations - process each group as a pandas DataFrame\n@pandas_udf(&quot;int double_age&quot;)\ndef pandas_process_group(df: pd.DataFrame) -&gt; pd.DataFrame:\n    &quot;&quot;&quot;Apply a transformation to each group and return a new DataFrame.&quot;&quot;&quot;\n    df[&quot;double_age&quot;] = df[&quot;age&quot;] * 2\n    return df\n\ndf.groupBy(&quot;department&quot;).applyInPandas(\n    pandas_process_group,\n    schema=&quot;int double_age&quot;\n).show()</code></pre></div>\n<div class=\"section-divider\"></div>"}, {"title": "10. Partitioning: repartition and coalesce", "raw_md": "## 10. Partitioning: repartition and coalesce\n\n```python\n# Repartition into a specific number of partitions\ndf_repart = df.repartition(200)\n\n# Repartition by a column value (hash partitioning)\ndf_by_col = df.repartition(\"department\")\n\n# Repartition with a specific count and column\ndf_by_cols = df.repartition(10, \"year\")\n\n# Coalesce - reduces the number of partitions without a full shuffle\ndf_coalesce = df.coalesce(1)  # Often used to write a single output file\n\n# Repartition by range on a specific column\ndf_range = df.repartitionByRange(10, \"salary\")\n```\n\n---", "body_html": "<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\"># Repartition into a specific number of partitions\ndf_repart = df.repartition(200)\n\n# Repartition by a column value (hash partitioning)\ndf_by_col = df.repartition(&quot;department&quot;)\n\n# Repartition with a specific count and column\ndf_by_cols = df.repartition(10, &quot;year&quot;)\n\n# Coalesce - reduces the number of partitions without a full shuffle\ndf_coalesce = df.coalesce(1)  # Often used to write a single output file\n\n# Repartition by range on a specific column\ndf_range = df.repartitionByRange(10, &quot;salary&quot;)</code></pre></div>\n<div class=\"section-divider\"></div>"}, {"title": "11. Collection Functions: collect, collect_list, collect_set", "raw_md": "## 11. Collection Functions: collect, collect_list, collect_set\n\n```python\nfrom pyspark.sql import functions as F\n\n# collect_list - gathers all values into an array (includes duplicates)\ndf.groupBy(\"department\").agg(\n    F.collect_list(\"employee_name\").alias(\"all_employees\")\n).show()\n\n# collect_set - gathers unique values into an array (excludes duplicates)\ndf.groupBy(\"department\").agg(\n    F.collect_set(\"project_name\").alias(\"unique_projects\")\n).show()\n\n# Sort the collected array elements\ndf.groupBy(\"department\").agg(\n    F.sort_array(F.collect_list(\"employee_name\")).alias(\"sorted_employees\")\n).show()\n\n# collect() on a DataFrame returns data to the driver as a list of Row objects\n# Use with caution - brings all data into driver memory\nrows = df.limit(100).collect()  # Safely collect a limited number of rows\nfor row in rows:\n    print(row[\"name\"], row[\"age\"])\n```\n\n---", "body_html": "<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">from pyspark.sql import functions as F\n\n# collect_list - gathers all values into an array (includes duplicates)\ndf.groupBy(&quot;department&quot;).agg(\n    F.collect_list(&quot;employee_name&quot;).alias(&quot;all_employees&quot;)\n).show()\n\n# collect_set - gathers unique values into an array (excludes duplicates)\ndf.groupBy(&quot;department&quot;).agg(\n    F.collect_set(&quot;project_name&quot;).alias(&quot;unique_projects&quot;)\n).show()\n\n# Sort the collected array elements\ndf.groupBy(&quot;department&quot;).agg(\n    F.sort_array(F.collect_list(&quot;employee_name&quot;)).alias(&quot;sorted_employees&quot;)\n).show()\n\n# collect() on a DataFrame returns data to the driver as a list of Row objects\n# Use with caution - brings all data into driver memory\nrows = df.limit(100).collect()  # Safely collect a limited number of rows\nfor row in rows:\n    print(row[&quot;name&quot;], row[&quot;age&quot;])</code></pre></div>\n<div class=\"section-divider\"></div>"}, {"title": "12. Explode and Inline", "raw_md": "## 12. Explode and Inline\n\n```python\nfrom pyspark.sql import functions as F\n\n# Create a sample DataFrame with an array column\ndf_array = spark.createDataFrame(\n    [(1, [\"a\", \"b\", \"c\"]), (2, [\"x\", \"y\"])],\n    [\"id\", \"letters\"]\n)\n\n# explode - transforms each array element into a separate row\ndf_exploded = df_array.select(\n    \"id\",\n    F.explode(\"letters\").alias(\"letter\")\n)\ndf_exploded.show()\n\n# explode_outer - like explode, but preserves rows with null or empty arrays\ndf_exploded_outer = df_array.select(\n    \"id\",\n    F.explode_outer(\"letters\").alias(\"letter\")\n)\n\n# inline / inline_outer - explode multiple array or map columns at once\ndf_multi = spark.createDataFrame(\n    [(1, {\"a\": 1, \"b\": 2}, {\"x\": 10}), (2, {\"c\": 3}, {\"y\": 20})],\n    [\"id\", \"map1\", \"map2\"]\n)\ndf_inlined = df_multi.select(\n    \"id\",\n    F.inline(\"map1\").alias(\"k1\", \"v1\"),\n    F.inline(\"map2\").alias(\"k2\", \"v2\")\n)\n```\n\n---", "body_html": "<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">from pyspark.sql import functions as F\n\n# Create a sample DataFrame with an array column\ndf_array = spark.createDataFrame(\n    [(1, [&quot;a&quot;, &quot;b&quot;, &quot;c&quot;]), (2, [&quot;x&quot;, &quot;y&quot;])],\n    [&quot;id&quot;, &quot;letters&quot;]\n)\n\n# explode - transforms each array element into a separate row\ndf_exploded = df_array.select(\n    &quot;id&quot;,\n    F.explode(&quot;letters&quot;).alias(&quot;letter&quot;)\n)\ndf_exploded.show()\n\n# explode_outer - like explode, but preserves rows with null or empty arrays\ndf_exploded_outer = df_array.select(\n    &quot;id&quot;,\n    F.explode_outer(&quot;letters&quot;).alias(&quot;letter&quot;)\n)\n\n# inline / inline_outer - explode multiple array or map columns at once\ndf_multi = spark.createDataFrame(\n    [(1, {&quot;a&quot;: 1, &quot;b&quot;: 2}, {&quot;x&quot;: 10}), (2, {&quot;c&quot;: 3}, {&quot;y&quot;: 20})],\n    [&quot;id&quot;, &quot;map1&quot;, &quot;map2&quot;]\n)\ndf_inlined = df_multi.select(\n    &quot;id&quot;,\n    F.inline(&quot;map1&quot;).alias(&quot;k1&quot;, &quot;v1&quot;),\n    F.inline(&quot;map2&quot;).alias(&quot;k2&quot;, &quot;v2&quot;)\n)</code></pre></div>\n<div class=\"section-divider\"></div>"}, {"title": "13. Conditional Expressions: when and otherwise", "raw_md": "## 13. Conditional Expressions: when and otherwise\n\n```python\nfrom pyspark.sql import functions as F\n\n# Simple conditional: categorize salary tiers\ndf_tiered = df.withColumn(\n    \"salary_tier\",\n    F.when(col(\"salary\") < 50000, \"Low\")\n     .when(col(\"salary\") < 100000, \"Medium\")\n     .when(col(\"salary\") < 200000, \"High\")\n     .otherwise(\"Executive\")\n)\n\n# Conditional with multiple combined conditions\ndf_performance = df.withColumn(\n    \"performance\",\n    F.when((col(\"score\") >= 90) & (col(\"attendance\") == \"excellent\"), \"Outstanding\")\n     .when((col(\"score\") >= 90) | (col(\"attendance\") == \"excellent\"), \"Good\")\n     .otherwise(\"Needs Improvement\")\n)\n\n# Using when() inside filter() for conditional row selection\ndf_filtered = df.filter(\n    F.when(col(\"status\") == \"active\", True)\n     .otherwise(col(\"priority\") > 5)\n)\n\n# Build a conditional column that returns different expressions based on test\ndf_bonus = df.withColumn(\n    \"bonus\",\n    F.when(col(\"dept\") == \"Sales\", col(\"salary\") * 0.15)\n     .when(col(\"dept\") == \"Engineering\", col(\"salary\") * 0.10)\n     .otherwise(col(\"salary\") * 0.05)\n)\n```\n\n---", "body_html": "<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">from pyspark.sql import functions as F\n\n# Simple conditional: categorize salary tiers\ndf_tiered = df.withColumn(\n    &quot;salary_tier&quot;,\n    F.when(col(&quot;salary&quot;) &lt; 50000, &quot;Low&quot;)\n     .when(col(&quot;salary&quot;) &lt; 100000, &quot;Medium&quot;)\n     .when(col(&quot;salary&quot;) &lt; 200000, &quot;High&quot;)\n     .otherwise(&quot;Executive&quot;)\n)\n\n# Conditional with multiple combined conditions\ndf_performance = df.withColumn(\n    &quot;performance&quot;,\n    F.when((col(&quot;score&quot;) &gt;= 90) &amp; (col(&quot;attendance&quot;) == &quot;excellent&quot;), &quot;Outstanding&quot;)\n     .when((col(&quot;score&quot;) &gt;= 90) | (col(&quot;attendance&quot;) == &quot;excellent&quot;), &quot;Good&quot;)\n     .otherwise(&quot;Needs Improvement&quot;)\n)\n\n# Using when() inside filter() for conditional row selection\ndf_filtered = df.filter(\n    F.when(col(&quot;status&quot;) == &quot;active&quot;, True)\n     .otherwise(col(&quot;priority&quot;) &gt; 5)\n)\n\n# Build a conditional column that returns different expressions based on test\ndf_bonus = df.withColumn(\n    &quot;bonus&quot;,\n    F.when(col(&quot;dept&quot;) == &quot;Sales&quot;, col(&quot;salary&quot;) * 0.15)\n     .when(col(&quot;dept&quot;) == &quot;Engineering&quot;, col(&quot;salary&quot;) * 0.10)\n     .otherwise(col(&quot;salary&quot;) * 0.05)\n)</code></pre></div>\n<div class=\"section-divider\"></div>"}, {"title": "14. Date and Time Functions", "raw_md": "## 14. Date and Time Functions\n\n```python\nfrom pyspark.sql import functions as F\n\n# Convert a string column to a DateType with the default format (yyyy-MM-dd)\ndf_dates = df.withColumn(\"parsed_date\", F.to_date(col(\"date_string\")))\n\n# Convert a string to a date with an explicit format pattern\ndf_formatted = df.withColumn(\n    \"parsed_date\",\n    F.to_date(col(\"date_string\"), \"dd/MM/yyyy\")\n)\n\n# Calculate the difference in days between two date columns\ndf_diff = df.withColumn(\n    \"days_since_start\",\n    F.datediff(col(\"end_date\"), col(\"start_date\"))\n)\n\n# Add or subtract months/days from a date\ndf_add_months = df.withColumn(\"next_quarter\", F.add_months(col(\"date_col\"), 3))\ndf_sub_months = df.withColumn(\"three_months_ago\", F.add_months(col(\"date_col\"), -3))\ndf_sub_days = df.withColumn(\"week_ago\", F.date_sub(col(\"date_col\"), 7))\n\n# Extract parts of a date (month number, month name, year, day)\ndf_parts = df.withColumn(\"month_num\", F.month(col(\"date_col\"))) \\\n             .withColumn(\"month_name\", F.monthname(col(\"date_col\"))) \\\n             .withColumn(\"year_num\", F.year(col(\"date_col\")))\n\n# Current date and timestamp\ndf_current = df.withColumn(\"today\", F.current_date()) \\\n               .withColumn(\"now\", F.current_timestamp())\n```\n\n---", "body_html": "<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">from pyspark.sql import functions as F\n\n# Convert a string column to a DateType with the default format (yyyy-MM-dd)\ndf_dates = df.withColumn(&quot;parsed_date&quot;, F.to_date(col(&quot;date_string&quot;)))\n\n# Convert a string to a date with an explicit format pattern\ndf_formatted = df.withColumn(\n    &quot;parsed_date&quot;,\n    F.to_date(col(&quot;date_string&quot;), &quot;dd/MM/yyyy&quot;)\n)\n\n# Calculate the difference in days between two date columns\ndf_diff = df.withColumn(\n    &quot;days_since_start&quot;,\n    F.datediff(col(&quot;end_date&quot;), col(&quot;start_date&quot;))\n)\n\n# Add or subtract months/days from a date\ndf_add_months = df.withColumn(&quot;next_quarter&quot;, F.add_months(col(&quot;date_col&quot;), 3))\ndf_sub_months = df.withColumn(&quot;three_months_ago&quot;, F.add_months(col(&quot;date_col&quot;), -3))\ndf_sub_days = df.withColumn(&quot;week_ago&quot;, F.date_sub(col(&quot;date_col&quot;), 7))\n\n# Extract parts of a date (month number, month name, year, day)\ndf_parts = df.withColumn(&quot;month_num&quot;, F.month(col(&quot;date_col&quot;))) \\\n             .withColumn(&quot;month_name&quot;, F.monthname(col(&quot;date_col&quot;))) \\\n             .withColumn(&quot;year_num&quot;, F.year(col(&quot;date_col&quot;)))\n\n# Current date and timestamp\ndf_current = df.withColumn(&quot;today&quot;, F.current_date()) \\\n               .withColumn(&quot;now&quot;, F.current_timestamp())</code></pre></div>\n<div class=\"section-divider\"></div>"}, {"title": "15. Limit and Order By", "raw_md": "## 15. Limit and Order By\n\n```python\n# Return the first N rows - fast but order is not guaranteed without orderBy\ndf_top10 = df.limit(10)\ndf_top10.show()\n\n# Order by one or more columns (ascending by default)\ndf_sorted = df.orderBy(\"column1\", \"column2\")\n\n# Order by with explicit ascending or descending direction\ndf_desc = df.orderBy(F.desc(\"salary\"))   # Highest salary first\ndf_asc = df.orderBy(F.asc(\"hire_date\"))  # Earliest hire date first\n\n# Order by multiple columns with mixed directions\ndf_mixed = df.orderBy(\n    F.desc(\"department\"),\n    F.asc(\"salary\")\n)\n\n# Combine orderBy with limit to get top-N records efficiently\ndf_top5 = df.orderBy(F.desc(\"salary\")).limit(5)\n\n# Use repartition before ordering for large datasets to improve performance\ndf_sorted_large = df.repartition(\"department\").orderBy(\"department\", \"salary\")\n```", "body_html": "<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\"># Return the first N rows - fast but order is not guaranteed without orderBy\ndf_top10 = df.limit(10)\ndf_top10.show()\n\n# Order by one or more columns (ascending by default)\ndf_sorted = df.orderBy(&quot;column1&quot;, &quot;column2&quot;)\n\n# Order by with explicit ascending or descending direction\ndf_desc = df.orderBy(F.desc(&quot;salary&quot;))   # Highest salary first\ndf_asc = df.orderBy(F.asc(&quot;hire_date&quot;))  # Earliest hire date first\n\n# Order by multiple columns with mixed directions\ndf_mixed = df.orderBy(\n    F.desc(&quot;department&quot;),\n    F.asc(&quot;salary&quot;)\n)\n\n# Combine orderBy with limit to get top-N records efficiently\ndf_top5 = df.orderBy(F.desc(&quot;salary&quot;)).limit(5)\n\n# Use repartition before ordering for large datasets to improve performance\ndf_sorted_large = df.repartition(&quot;department&quot;).orderBy(&quot;department&quot;, &quot;salary&quot;)</code></pre></div>"}];
        const interviewQuestions = [{"id": 1, "question": "What is Apache Spark, and how does its architecture work?", "difficulty": "Beginner", "category": "Core Architecture & Fundamentals", "answer_html": "<p class=\"prose-p\">Apache Spark is a distributed computing engine for large-scale data processing. It uses master-slave architecture with one Driver node and multiple Worker nodes.</p>\n<p class=\"prose-p\"><strong>Key Architecture Components:</strong></p>\n<ol class=\"ordered-list\">\n<li><strong>Driver Program</strong>: Runs the <code class=\"inline-code\">main()</code> method, instantiates <code class=\"inline-code\">SparkContext</code>/<code class=\"inline-code\">SparkSession</code>, transforms user code into a Directed Acyclic Graph (DAG), and coordinates task scheduling via the DAGScheduler and TaskScheduler.</li>\n<li><strong>Cluster Manager</strong>: Allocates physical resources across applications (Standalone, YARN, Kubernetes, or Mesos).</li>\n<li><strong>Worker Nodes</strong>: Physical or virtual machines hosting executor processes.</li>\n<li><strong>Executors</strong>: Worker processes that execute tasks in parallel threads and keep data in memory or on disk.</li>\n</ol>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">code</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-\">+-------------------------------------------------+\n|                  Driver Node                    |\n|  [SparkSession] -&gt; [DAGScheduler] -&gt; [TaskScheduler]\n+-----------------------+-------------------------+\n                        | Coordinates\n         +--------------+--------------+\n         | Resource Allocation         | Resource Allocation\n         v                             v\n+------------------+          +------------------+\n|  Worker Node 1   |          |  Worker Node 2   |\n| [Executor 1]     |          | [Executor 2]     |\n| (Tasks, Storage) |          | (Tasks, Storage) |\n+------------------+          +------------------+</code></pre></div>", "raw_answer": "Apache Spark is a distributed computing engine for large-scale data processing. It uses master-slave architecture with one Driver node and multiple Worker nodes.\n\n**Key Architecture Components:**\n1. **Driver Program**: Runs the `main()` method, instantiates `SparkContext`/`SparkSession`, transforms user code into a Directed Acyclic Graph (DAG), and coordinates task scheduling via the DAGScheduler and TaskScheduler.\n2. **Cluster Manager**: Allocates physical resources across applications (Standalone, YARN, Kubernetes, or Mesos).\n3. **Worker Nodes**: Physical or virtual machines hosting executor processes.\n4. **Executors**: Worker processes that execute tasks in parallel threads and keep data in memory or on disk.\n\n```\n+-------------------------------------------------+\n|                  Driver Node                    |\n|  [SparkSession] -> [DAGScheduler] -> [TaskScheduler]\n+-----------------------+-------------------------+\n                        | Coordinates\n         +--------------+--------------+\n         | Resource Allocation         | Resource Allocation\n         v                             v\n+------------------+          +------------------+\n|  Worker Node 1   |          |  Worker Node 2   |\n| [Executor 1]     |          | [Executor 2]     |\n| (Tasks, Storage) |          | (Tasks, Storage) |\n+------------------+          +------------------+\n```"}, {"id": 2, "question": "What is the difference between RDD, DataFrame, and Dataset?", "difficulty": "Beginner", "category": "Core Architecture & Fundamentals", "answer_html": "<p class=\"prose-p\">Spark provides three primary data abstractions:</p>\n<div class=\"table-container\"><table class=\"data-table\">\n<thead><tr>\n<th>Feature</th>\n<th>RDD (Resilient Distributed Dataset)</th>\n<th>DataFrame</th>\n<th>Dataset</th>\n</tr></thead><tbody>\n<tr>\n<td><strong>Type Safety</strong></td>\n<td>Compile-time (Scala/Java)</td>\n<td>Untyped (<code class=\"inline-code\">Row</code> objects)</td>\n<td>Compile-time type safe</td>\n</tr>\n<tr>\n<td><strong>Optimization</strong></td>\n<td>None (manual developer optimization)</td>\n<td>Catalyst Optimizer + Tungsten</td>\n<td>Catalyst Optimizer + Tungsten</td>\n</tr>\n<tr>\n<td><strong>Serialization</strong></td>\n<td>Java/Kryo serialization (high overhead)</td>\n<td>Tungsten binary off-heap format</td>\n<td>Encoders (Tungsten binary format)</td>\n</tr>\n<tr>\n<td><strong>Schema</strong></td>\n<td>Unstructured, no schema awareness</td>\n<td>Explicit schema (<code class=\"inline-code\">StructType</code>)</td>\n<td>Explicit schema</td>\n</tr>\n<tr>\n<td><strong>Language Support</strong></td>\n<td>Python, Scala, Java, R</td>\n<td>Python, Scala, Java, R</td>\n<td>Scala, Java (not Python)</td>\n</tr>\n</tbody>\n</table></div>\n<p class=\"prose-p\"><em>Note on Python</em>: In PySpark, <code class=\"inline-code\">DataFrame</code> is an alias for <code class=\"inline-code\">Dataset[Row]</code>. Python cannot support typed Datasets because Python is dynamically typed.</p>", "raw_answer": "Spark provides three primary data abstractions:\n\n| Feature | RDD (Resilient Distributed Dataset) | DataFrame | Dataset |\n| :--- | :--- | :--- | :--- |\n| **Type Safety** | Compile-time (Scala/Java) | Untyped (`Row` objects) | Compile-time type safe |\n| **Optimization** | None (manual developer optimization) | Catalyst Optimizer + Tungsten | Catalyst Optimizer + Tungsten |\n| **Serialization** | Java/Kryo serialization (high overhead) | Tungsten binary off-heap format | Encoders (Tungsten binary format) |\n| **Schema** | Unstructured, no schema awareness | Explicit schema (`StructType`) | Explicit schema |\n| **Language Support** | Python, Scala, Java, R | Python, Scala, Java, R | Scala, Java (not Python) |\n\n*Note on Python*: In PySpark, `DataFrame` is an alias for `Dataset[Row]`. Python cannot support typed Datasets because Python is dynamically typed."}, {"id": 3, "question": "What is Lazy Evaluation in Spark, and why is it beneficial?", "difficulty": "Beginner", "category": "Core Architecture & Fundamentals", "answer_html": "<p class=\"prose-p\"><strong>Lazy evaluation</strong> means Spark does not compute transformations immediately. Instead, Spark registers operations in a lineage graph (Directed Acyclic Graph or DAG). Spark only triggers execution when an <strong>Action</strong> (such as <code class=\"inline-code\">count()</code>, <code class=\"inline-code\">collect()</code>, <code class=\"inline-code\">show()</code>, or <code class=\"inline-code\">write</code>) is called.</p>\n<p class=\"prose-p\"><strong>Benefits:</strong></p>\n<ul class=\"bullet-list\">\n<li><strong>Optimization</strong>: The Catalyst optimizer inspects the entire DAG before running. It pushes filters down to the storage layer (predicate pushdown) and prunes unnecessary columns.</li>\n<li><strong>Avoids Intermediate Writes</strong>: Intermediate transformation steps run inside memory pipelines without writing intermediate results to disk.</li>\n<li><strong>Fault Recovery</strong>: If a partition fails, Spark recomputes only the lost partition using the DAG lineage rather than re-running the entire pipeline.</li>\n</ul>", "raw_answer": "**Lazy evaluation** means Spark does not compute transformations immediately. Instead, Spark registers operations in a lineage graph (Directed Acyclic Graph or DAG). Spark only triggers execution when an **Action** (such as `count()`, `collect()`, `show()`, or `write`) is called.\n\n**Benefits:**\n- **Optimization**: The Catalyst optimizer inspects the entire DAG before running. It pushes filters down to the storage layer (predicate pushdown) and prunes unnecessary columns.\n- **Avoids Intermediate Writes**: Intermediate transformation steps run inside memory pipelines without writing intermediate results to disk.\n- **Fault Recovery**: If a partition fails, Spark recomputes only the lost partition using the DAG lineage rather than re-running the entire pipeline."}, {"id": 4, "question": "What is the difference between Transformations and Actions?", "difficulty": "Beginner", "category": "Core Architecture & Fundamentals", "answer_html": "<p class=\"prose-p\">Operations in Spark belong to two categories:</p>\n<ol class=\"ordered-list\">\n<li><strong>Transformations</strong>: Create a new DataFrame/RDD from an existing one without immediate calculation (Lazy).</li>\n</ol>\n<ul class=\"bullet-list\">\n<li><em>Examples</em>: <code class=\"inline-code\">filter()</code>, <code class=\"inline-code\">select()</code>, <code class=\"inline-code\">groupBy()</code>, <code class=\"inline-code\">join()</code>, <code class=\"inline-code\">withColumn()</code>, <code class=\"inline-code\">repartition()</code>.</li>\n</ul>\n<ol class=\"ordered-list\">\n<li><strong>Actions</strong>: Trigger the evaluation of the DAG and return results to the driver or write output to external storage (Eager).</li>\n</ol>\n<ul class=\"bullet-list\">\n<li><em>Examples</em>: <code class=\"inline-code\">count()</code>, <code class=\"inline-code\">collect()</code>, <code class=\"inline-code\">first()</code>, <code class=\"inline-code\">take(n)</code>, <code class=\"inline-code\">save()</code>, <code class=\"inline-code\">write.parquet()</code>.</li>\n</ul>\n<p class=\"prose-p\"><strong>Rule of Thumb</strong>: If the method returns a new DataFrame or RDD, it is a transformation. If it returns values to the driver or saves files, it is an action.</p>", "raw_answer": "Operations in Spark belong to two categories:\n\n1. **Transformations**: Create a new DataFrame/RDD from an existing one without immediate calculation (Lazy).\n   - *Examples*: `filter()`, `select()`, `groupBy()`, `join()`, `withColumn()`, `repartition()`.\n2. **Actions**: Trigger the evaluation of the DAG and return results to the driver or write output to external storage (Eager).\n   - *Examples*: `count()`, `collect()`, `first()`, `take(n)`, `save()`, `write.parquet()`.\n\n**Rule of Thumb**: If the method returns a new DataFrame or RDD, it is a transformation. If it returns values to the driver or saves files, it is an action."}, {"id": 5, "question": "What is the difference between Narrow and Wide Transformations?", "difficulty": "Intermediate", "category": "Core Architecture & Fundamentals", "answer_html": "<p class=\"prose-p\">Transformations split into Narrow and Wide based on data movement across partitions:</p>\n<ol class=\"ordered-list\">\n<li><strong>Narrow Transformations</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>Each input partition contributes to at most one output partition.</li>\n<li>Operations execute in-memory on the same worker node without network transfer (no shuffle).</li>\n<li><em>Examples</em>: <code class=\"inline-code\">map()</code>, <code class=\"inline-code\">flatMap()</code>, <code class=\"inline-code\">filter()</code>, <code class=\"inline-code\">select()</code>.</li>\n</ul>\n<ol class=\"ordered-list\">\n<li><strong>Wide Transformations</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>Input partitions contribute data to multiple output partitions.</li>\n<li>Requires moving data across cluster nodes over the network (a <strong>Shuffle</strong>).</li>\n<li>Divides a Spark Job into distinct <strong>Stages</strong>.</li>\n<li><em>Examples</em>: <code class=\"inline-code\">groupBy()</code>, <code class=\"inline-code\">join()</code>, <code class=\"inline-code\">distinct()</code>, <code class=\"inline-code\">repartition()</code>, <code class=\"inline-code\">reduceByKey()</code>.</li>\n</ul>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">code</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-\">Narrow (No Shuffle):            Wide (Shuffle Required):\nPartition 1 ---&gt; Output 1       Partition 1 ---\\ /---&gt; Output 1\nPartition 2 ---&gt; Output 2       Partition 2 --- X ---&gt; Output 2\nPartition 3 ---&gt; Output 3       Partition 3 ---/ \\---&gt; Output 3</code></pre></div>", "raw_answer": "Transformations split into Narrow and Wide based on data movement across partitions:\n\n1. **Narrow Transformations**:\n   - Each input partition contributes to at most one output partition.\n   - Operations execute in-memory on the same worker node without network transfer (no shuffle).\n   - *Examples*: `map()`, `flatMap()`, `filter()`, `select()`.\n\n2. **Wide Transformations**:\n   - Input partitions contribute data to multiple output partitions.\n   - Requires moving data across cluster nodes over the network (a **Shuffle**).\n   - Divides a Spark Job into distinct **Stages**.\n   - *Examples*: `groupBy()`, `join()`, `distinct()`, `repartition()`, `reduceByKey()`.\n\n```\nNarrow (No Shuffle):            Wide (Shuffle Required):\nPartition 1 ---> Output 1       Partition 1 ---\\ /---> Output 1\nPartition 2 ---> Output 2       Partition 2 --- X ---> Output 2\nPartition 3 ---> Output 3       Partition 3 ---/ \\---> Output 3\n```"}, {"id": 6, "question": "How does Spark divide work into Jobs, Stages, and Tasks?", "difficulty": "Intermediate", "category": "Core Architecture & Fundamentals", "answer_html": "<p class=\"prose-p\">Spark executes programs through a four-tier execution hierarchy:</p>\n<ol class=\"ordered-list\">\n<li><strong>Application</strong>: The entire Spark program lifecycle managed by a <code class=\"inline-code\">SparkSession</code>.</li>\n<li><strong>Job</strong>: Created every time an <strong>Action</strong> is invoked. A single application can contain multiple jobs.</li>\n<li><strong>Stage</strong>: A job is divided into stages at <strong>Shuffle boundaries</strong> (wide transformations). If a job has 2 shuffles, it will have at least 3 stages. Stages can run in parallel if they do not depend on each other.</li>\n<li><strong>Task</strong>: The smallest unit of execution. A task applies a set of operations to a single partition of data within an executor core. If Stage 1 processes 200 partitions, Spark creates 200 tasks for that stage.</li>\n</ol>", "raw_answer": "Spark executes programs through a four-tier execution hierarchy:\n\n1. **Application**: The entire Spark program lifecycle managed by a `SparkSession`.\n2. **Job**: Created every time an **Action** is invoked. A single application can contain multiple jobs.\n3. **Stage**: A job is divided into stages at **Shuffle boundaries** (wide transformations). If a job has 2 shuffles, it will have at least 3 stages. Stages can run in parallel if they do not depend on each other.\n4. **Task**: The smallest unit of execution. A task applies a set of operations to a single partition of data within an executor core. If Stage 1 processes 200 partitions, Spark creates 200 tasks for that stage."}, {"id": 7, "question": "What is a DAG (Directed Acyclic Graph) in Spark?", "difficulty": "Intermediate", "category": "Core Architecture & Fundamentals", "answer_html": "<p class=\"prose-p\">A <strong>DAG</strong> is a graph of computation stages where:</p>\n<ul class=\"bullet-list\">\n<li><strong>Directed</strong>: Execution proceeds in one direction from input to output.</li>\n<li><strong>Acyclic</strong>: No computational loops or cycles exist.</li>\n<li><strong>Vertices (Nodes)</strong>: Represent RDDs/DataFrames at different states.</li>\n<li><strong>Edges</strong>: Represent operations or transformations applied to the data.</li>\n</ul>\n<p class=\"prose-p\"><strong>How the DAGScheduler works:</strong></p>\n<ol class=\"ordered-list\">\n<li>Tracks operations applied to DataFrames.</li>\n<li>Identifies shuffle dependencies to divide the graph into stages.</li>\n<li>Submits stage task sets to the <code class=\"inline-code\">TaskScheduler</code>.</li>\n<li>Visualizable in real-time in the <strong>Spark UI DAG Visualization</strong> tab.</li>\n</ol>", "raw_answer": "A **DAG** is a graph of computation stages where:\n- **Directed**: Execution proceeds in one direction from input to output.\n- **Acyclic**: No computational loops or cycles exist.\n- **Vertices (Nodes)**: Represent RDDs/DataFrames at different states.\n- **Edges**: Represent operations or transformations applied to the data.\n\n**How the DAGScheduler works:**\n1. Tracks operations applied to DataFrames.\n2. Identifies shuffle dependencies to divide the graph into stages.\n3. Submits stage task sets to the `TaskScheduler`.\n4. Visualizable in real-time in the **Spark UI DAG Visualization** tab."}, {"id": 8, "question": "What is the difference between SparkContext, SQLContext, HiveContext, and SparkSession?", "difficulty": "Beginner", "category": "Core Architecture & Fundamentals", "answer_html": "<p class=\"prose-p\"><strong>Evolution across Spark versions:</strong></p>\n<ul class=\"bullet-list\">\n<li><strong>SparkContext (Spark 1.x)</strong>: Main entry point for core Spark functionality (RDDs, cluster connection, job submission).</li>\n<li><strong>SQLContext (Spark 1.x)</strong>: Entry point for Spark SQL and DataFrame queries.</li>\n<li><strong>HiveContext (Spark 1.x)</strong>: Extension of SQLContext to query tables stored in Apache Hive metastore.</li>\n<li><strong>SparkSession (Spark 2.0+)</strong>: Unified entry point that encapsulates <code class=\"inline-code\">SparkContext</code>, <code class=\"inline-code\">SQLContext</code>, and <code class=\"inline-code\">HiveContext</code> under one object.</li>\n</ul>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\"># Modern Spark 3.x initialization:\nfrom pyspark.sql import SparkSession\n\nspark = SparkSession.builder \\\n    .appName(&quot;ModernDE&quot;) \\\n    .enableHiveSupport() \\\n    .getOrCreate()\n\n# Access underlying SparkContext if needed:\nsc = spark.sparkContext</code></pre></div>", "raw_answer": "**Evolution across Spark versions:**\n- **SparkContext (Spark 1.x)**: Main entry point for core Spark functionality (RDDs, cluster connection, job submission).\n- **SQLContext (Spark 1.x)**: Entry point for Spark SQL and DataFrame queries.\n- **HiveContext (Spark 1.x)**: Extension of SQLContext to query tables stored in Apache Hive metastore.\n- **SparkSession (Spark 2.0+)**: Unified entry point that encapsulates `SparkContext`, `SQLContext`, and `HiveContext` under one object.\n\n```python\n# Modern Spark 3.x initialization:\nfrom pyspark.sql import SparkSession\n\nspark = SparkSession.builder \\\n    .appName(\"ModernDE\") \\\n    .enableHiveSupport() \\\n    .getOrCreate()\n\n# Access underlying SparkContext if needed:\nsc = spark.sparkContext\n```"}, {"id": 9, "question": "What are Broadcast Variables and Accumulators?", "difficulty": "Intermediate", "category": "Core Architecture & Fundamentals", "answer_html": "<p class=\"prose-p\">Both are distributed shared variables used across executor nodes:</p>\n<ol class=\"ordered-list\">\n<li><strong>Broadcast Variables</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>Read-only cached variables sent to every executor node once (instead of shipping a copy with every task).</li>\n<li>Use case: Distributing small lookup tables or configuration dictionaries across workers to avoid network traffic.</li>\n</ul>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">   lookup = {&quot;US&quot;: &quot;United States&quot;, &quot;IN&quot;: &quot;India&quot;}\n   broadcast_lookup = spark.sparkContext.broadcast(lookup)</code></pre></div>\n<ol class=\"ordered-list\">\n<li><strong>Accumulators</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>Write-only variables where worker nodes can only add values (associative and commutative operations), and only the driver can read the accumulated result.</li>\n<li>Use case: Global counters, monitoring dirty/corrupt records, custom metric tracking.</li>\n</ul>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">   error_count = spark.sparkContext.accumulator(0)</code></pre></div>", "raw_answer": "Both are distributed shared variables used across executor nodes:\n\n1. **Broadcast Variables**:\n   - Read-only cached variables sent to every executor node once (instead of shipping a copy with every task).\n   - Use case: Distributing small lookup tables or configuration dictionaries across workers to avoid network traffic.\n   ```python\n   lookup = {\"US\": \"United States\", \"IN\": \"India\"}\n   broadcast_lookup = spark.sparkContext.broadcast(lookup)\n   ```\n\n2. **Accumulators**:\n   - Write-only variables where worker nodes can only add values (associative and commutative operations), and only the driver can read the accumulated result.\n   - Use case: Global counters, monitoring dirty/corrupt records, custom metric tracking.\n   ```python\n   error_count = spark.sparkContext.accumulator(0)\n   ```"}, {"id": 10, "question": "What is the Catalyst Optimizer, and what are its four main phases?", "difficulty": "Intermediate", "category": "Core Architecture & Fundamentals", "answer_html": "<p class=\"prose-p\">The <strong>Catalyst Optimizer</strong> is the core query optimization engine for Spark SQL and DataFrames. It translates code into physical machine instructions through four phases:</p>\n<ol class=\"ordered-list\">\n<li><strong>Analysis</strong>: Resolves column names and table references against an internal catalog (Metastore). Produces an <em>Analyzed Logical Plan</em>.</li>\n<li><strong>Logical Optimization</strong>: Applies rule-based optimizations, such as:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li><strong>Predicate Pushdown</strong>: Filters rows before reading files.</li>\n<li><strong>Projection Pruning</strong>: Reads only necessary columns.</li>\n<li><strong>Constant Folding</strong>: Pre-evaluates constant expressions (e.g., <code class=\"inline-code\">1 + 1</code> becomes <code class=\"inline-code\">2</code>).</li>\n</ul>\n<ol class=\"ordered-list\">\n<li><strong>Physical Planning</strong>: Generates multiple physical execution strategies (e.g., choosing Broadcast Hash Join vs Sort-Merge Join) and uses a Cost-Based Optimizer (CBO) to select the optimal physical plan.</li>\n<li><strong>Code Generation (Tungsten)</strong>: Compiles the selected physical plan into optimized Java bytecode via Whole-Stage Code Generation.</li>\n</ol>", "raw_answer": "The **Catalyst Optimizer** is the core query optimization engine for Spark SQL and DataFrames. It translates code into physical machine instructions through four phases:\n\n1. **Analysis**: Resolves column names and table references against an internal catalog (Metastore). Produces an *Analyzed Logical Plan*.\n2. **Logical Optimization**: Applies rule-based optimizations, such as:\n   - **Predicate Pushdown**: Filters rows before reading files.\n   - **Projection Pruning**: Reads only necessary columns.\n   - **Constant Folding**: Pre-evaluates constant expressions (e.g., `1 + 1` becomes `2`).\n3. **Physical Planning**: Generates multiple physical execution strategies (e.g., choosing Broadcast Hash Join vs Sort-Merge Join) and uses a Cost-Based Optimizer (CBO) to select the optimal physical plan.\n4. **Code Generation (Tungsten)**: Compiles the selected physical plan into optimized Java bytecode via Whole-Stage Code Generation."}, {"id": 11, "question": "How is Executor Memory partitioned in Spark?", "difficulty": "Advanced", "category": "Memory Management & Tungsten", "answer_html": "<p class=\"prose-p\">Executor memory consists of JVM Heap and Off-heap memory divided into distinct regions:</p>\n<ol class=\"ordered-list\">\n<li><strong>Reserved Memory (300 MB fixed)</strong>: Reserved for Spark internal processes and safety buffer.</li>\n<li><strong>Spark Unified Memory (Default 60% of <code class=\"inline-code\">Total - 300MB</code>)</strong>: Managed by UnifiedMemoryManager:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li><strong>Storage Memory (Default 50%)</strong>: Stores cached data (<code class=\"inline-code\">cache()</code>, <code class=\"inline-code\">persist()</code>) and broadcast variables.</li>\n<li><strong>Execution Memory (Default 50%)</strong>: Used during shuffles, joins, aggregations, and sorting.</li>\n</ul>\n<p class=\"prose-p\"><em>Dynamic Borrowing</em>: If Storage memory is free, Execution can borrow it, and vice versa. If Execution requires memory occupied by Storage, Storage gets evicted to disk.</p>\n<ol class=\"ordered-list\">\n<li><strong>User Memory (Default 40% of <code class=\"inline-code\">Total - 300MB</code>)</strong>: Stores user data structures, internal metadata, and Python worker serialization buffers.</li>\n<li><strong>Off-Heap Memory (<code class=\"inline-code\">spark.memory.offHeap.size</code>)</strong>: Allocated outside JVM garbage collection for Tungsten memory management.</li>\n</ol>", "raw_answer": "Executor memory consists of JVM Heap and Off-heap memory divided into distinct regions:\n\n1. **Reserved Memory (300 MB fixed)**: Reserved for Spark internal processes and safety buffer.\n2. **Spark Unified Memory (Default 60% of `Total - 300MB`)**: Managed by UnifiedMemoryManager:\n   - **Storage Memory (Default 50%)**: Stores cached data (`cache()`, `persist()`) and broadcast variables.\n   - **Execution Memory (Default 50%)**: Used during shuffles, joins, aggregations, and sorting.\n   *Dynamic Borrowing*: If Storage memory is free, Execution can borrow it, and vice versa. If Execution requires memory occupied by Storage, Storage gets evicted to disk.\n3. **User Memory (Default 40% of `Total - 300MB`)**: Stores user data structures, internal metadata, and Python worker serialization buffers.\n4. **Off-Heap Memory (`spark.memory.offHeap.size`)**: Allocated outside JVM garbage collection for Tungsten memory management."}, {"id": 12, "question": "What is Tungsten Execution Engine, and why was it introduced?", "difficulty": "Advanced", "category": "Memory Management & Tungsten", "answer_html": "<p class=\"prose-p\">Project <strong>Tungsten</strong> is an optimization engine under Spark SQL focused on hardware-level CPU and memory efficiency.</p>\n<p class=\"prose-p\"><strong>Core Pillars of Tungsten:</strong></p>\n<ol class=\"ordered-list\">\n<li><strong>Off-Heap Memory Management</strong>: Bypasses JVM object creation and Garbage Collection (GC) pauses by managing binary memory layouts directly (using <code class=\"inline-code\">sun.misc.Unsafe</code>).</li>\n<li><strong>Compact Binary Format</strong>: Stores data as raw byte arrays without JVM object headers (which otherwise consume 16-24 bytes per object in Java).</li>\n<li><strong>Cache-Aware Computation</strong>: Organizes data structures to fit CPU L1/L2/L3 cache lines, eliminating CPU memory stalls during sorting and hashing.</li>\n<li><strong>Whole-Stage Code Generation</strong>: Collapses multiple physical operators into a single Java function, eliminating virtual function calls and leveraging CPU registers.</li>\n</ol>", "raw_answer": "Project **Tungsten** is an optimization engine under Spark SQL focused on hardware-level CPU and memory efficiency.\n\n**Core Pillars of Tungsten:**\n1. **Off-Heap Memory Management**: Bypasses JVM object creation and Garbage Collection (GC) pauses by managing binary memory layouts directly (using `sun.misc.Unsafe`).\n2. **Compact Binary Format**: Stores data as raw byte arrays without JVM object headers (which otherwise consume 16-24 bytes per object in Java).\n3. **Cache-Aware Computation**: Organizes data structures to fit CPU L1/L2/L3 cache lines, eliminating CPU memory stalls during sorting and hashing.\n4. **Whole-Stage Code Generation**: Collapses multiple physical operators into a single Java function, eliminating virtual function calls and leveraging CPU registers."}, {"id": 13, "question": "What causes Out of Memory (OOM) errors in Spark, and how do you resolve them?", "difficulty": "Advanced", "category": "Memory Management & Tungsten", "answer_html": "<p class=\"prose-p\">OOM errors occur either on the <strong>Driver</strong> or on the <strong>Executors</strong>:</p>\n<p class=\"prose-p\"><strong>1. Driver OOM (<code class=\"inline-code\">java.lang.OutOfMemoryError: Java heap space</code>):</strong></p>\n<ul class=\"bullet-list\">\n<li><em>Causes</em>: Calling <code class=\"inline-code\">.collect()</code> or <code class=\"inline-code\">.toPandas()</code> on massive datasets; broadcast joins with tables exceeding driver memory.</li>\n<li><em>Solutions</em>: Increase <code class=\"inline-code\">spark.driver.memory</code>; use <code class=\"inline-code\">.take(n)</code> instead of <code class=\"inline-code\">.collect()</code>; avoid collecting data to driver.</li>\n</ul>\n<p class=\"prose-p\"><strong>2. Executor OOM (<code class=\"inline-code\">Container killed by YARN for exceeding memory limits</code> / <code class=\"inline-code\">ExecutorLostFailure</code>):</strong></p>\n<ul class=\"bullet-list\">\n<li><em>Causes</em>: Data skew causing a single task to process disproportionate volumes; high concurrency per core (<code class=\"inline-code\">executor-cores</code> set too high); insufficient off-heap memory during heavy Python UDF execution.</li>\n<li><em>Solutions</em>:</li>\n<li>Increase <code class=\"inline-code\">spark.executor.memory</code> and <code class=\"inline-code\">spark.memory.fraction</code>.</li>\n<li>Increase overhead memory: <code class=\"inline-code\">spark.executor.memoryOverhead</code> (default is <code class=\"inline-code\">max(384MB, 10% of executor memory)</code>).</li>\n<li>Remediate data skew using salting or Adaptive Query Execution (AQE).</li>\n<li>Reduce cores per executor (recommended: 4 to 5 cores per executor).</li>\n</ul>", "raw_answer": "OOM errors occur either on the **Driver** or on the **Executors**:\n\n**1. Driver OOM (`java.lang.OutOfMemoryError: Java heap space`):**\n- *Causes*: Calling `.collect()` or `.toPandas()` on massive datasets; broadcast joins with tables exceeding driver memory.\n- *Solutions*: Increase `spark.driver.memory`; use `.take(n)` instead of `.collect()`; avoid collecting data to driver.\n\n**2. Executor OOM (`Container killed by YARN for exceeding memory limits` / `ExecutorLostFailure`):**\n- *Causes*: Data skew causing a single task to process disproportionate volumes; high concurrency per core (`executor-cores` set too high); insufficient off-heap memory during heavy Python UDF execution.\n- *Solutions*:\n  - Increase `spark.executor.memory` and `spark.memory.fraction`.\n  - Increase overhead memory: `spark.executor.memoryOverhead` (default is `max(384MB, 10% of executor memory)`).\n  - Remediate data skew using salting or Adaptive Query Execution (AQE).\n  - Reduce cores per executor (recommended: 4 to 5 cores per executor)."}, {"id": 14, "question": "What is Whole-Stage Code Generation in Spark?", "difficulty": "Advanced", "category": "Memory Management & Tungsten", "answer_html": "<p class=\"prose-p\">In traditional database engines, query execution follows the <strong>Volcano Iterator Model</strong>: each operator calls <code class=\"inline-code\">.next()</code> on its child operator. This introduces high CPU overhead due to frequent virtual method calls and poor CPU register utilization.</p>\n<p class=\"prose-p\"><strong>Whole-Stage Code Generation:</strong></p>\n<ul class=\"bullet-list\">\n<li>Analyzes an entire pipeline of physical transformations (e.g., Scan -&gt; Filter -&gt; Project -&gt; Aggregate).</li>\n<li>Generates a single compact Java bytecode loop at runtime.</li>\n<li>Keeps intermediate variables directly in CPU registers rather than writing to JVM heap.</li>\n<li>Indicated in the physical plan by an asterisk <code class=\"inline-code\"><em></code> next to operator names (e.g., <code class=\"inline-code\"></em>(1) Filter</code>, <code class=\"inline-code\">*(1) Project</code>).</li>\n</ul>", "raw_answer": "In traditional database engines, query execution follows the **Volcano Iterator Model**: each operator calls `.next()` on its child operator. This introduces high CPU overhead due to frequent virtual method calls and poor CPU register utilization.\n\n**Whole-Stage Code Generation:**\n- Analyzes an entire pipeline of physical transformations (e.g., Scan -> Filter -> Project -> Aggregate).\n- Generates a single compact Java bytecode loop at runtime.\n- Keeps intermediate variables directly in CPU registers rather than writing to JVM heap.\n- Indicated in the physical plan by an asterisk `*` next to operator names (e.g., `*(1) Filter`, `*(1) Project`)."}, {"id": 15, "question": "What is Garbage Collection (GC) tuning in Spark, and how do you inspect GC pauses?", "difficulty": "Intermediate", "category": "Memory Management & Tungsten", "answer_html": "<p class=\"prose-p\">Garbage Collection pauses can freeze Spark executor threads, causing task timeouts or executor heartbeats to fail.</p>\n<p class=\"prose-p\"><strong>How to Inspect:</strong></p>\n<ul class=\"bullet-list\">\n<li>Check the <strong>Spark UI -&gt; Executors Tab</strong>: Observe the <strong>Task Time (GC Time)</strong> column. If GC time exceeds 10% of task execution time, GC tuning is required.</li>\n</ul>\n<p class=\"prose-p\"><strong>How to Mitigate GC Pauses:</strong></p>\n<ol class=\"ordered-list\">\n<li>Switch from Parallel GC to <strong>G1GC (Garbage-First Collector)</strong>:</li>\n</ol>\n<p class=\"prose-p\"><code class=\"inline-code\">-XX:+UseG1GC -XX:InitiatingHeapOccupancyPercent=35 -XX:G1ReservePercent=15</code></p>\n<ol class=\"ordered-list\">\n<li>Decrease executor memory size (e.g., prefer two 16 GB executors over one 32 GB executor) to reduce full-GC sweep duration.</li>\n<li>Cache data in serialized format (<code class=\"inline-code\">StorageLevel.MEMORY_ONLY_SER</code>) to reduce total Java object count.</li>\n<li>Utilize DataFrames instead of RDDs to benefit from Tungsten off-heap serialization.</li>\n</ol>", "raw_answer": "Garbage Collection pauses can freeze Spark executor threads, causing task timeouts or executor heartbeats to fail.\n\n**How to Inspect:**\n- Check the **Spark UI -> Executors Tab**: Observe the **Task Time (GC Time)** column. If GC time exceeds 10% of task execution time, GC tuning is required.\n\n**How to Mitigate GC Pauses:**\n1. Switch from Parallel GC to **G1GC (Garbage-First Collector)**:\n   `-XX:+UseG1GC -XX:InitiatingHeapOccupancyPercent=35 -XX:G1ReservePercent=15`\n2. Decrease executor memory size (e.g., prefer two 16 GB executors over one 32 GB executor) to reduce full-GC sweep duration.\n3. Cache data in serialized format (`StorageLevel.MEMORY_ONLY_SER`) to reduce total Java object count.\n4. Utilize DataFrames instead of RDDs to benefit from Tungsten off-heap serialization."}, {"id": 16, "question": "What is Memory Spill (Spill to Disk and Spill to Memory)?", "difficulty": "Advanced", "category": "Memory Management & Tungsten", "answer_html": "<p class=\"prose-p\"><strong>Spill</strong> occurs when an execution operator (like shuffle sort, external aggregate, or join hash table) requires more memory than available in Execution Memory. Spark flushes (spills) the partition data to local worker disk.</p>\n<p class=\"prose-p\"><strong>Types in Spark UI:</strong></p>\n<ul class=\"bullet-list\">\n<li><strong>Spill (Memory)</strong>: The uncompressed, deserialized size of data in RAM before flushing.</li>\n<li><strong>Spill (Disk)</strong>: The compressed, serialized size of data after writing to disk.</li>\n</ul>\n<p class=\"prose-p\"><strong>Consequences:</strong></p>\n<ul class=\"bullet-list\">\n<li>Severe performance penalty: requires disk I/O, serialization, compression, and subsequent disk re-reads.</li>\n</ul>\n<p class=\"prose-p\"><strong>Fixes:</strong></p>\n<ol class=\"ordered-list\">\n<li>Increase shuffle partitions (<code class=\"inline-code\">spark.sql.shuffle.partitions</code> or enable AQE).</li>\n<li>Increase executor memory per core (<code class=\"inline-code\">spark.executor.memory / spark.executor.cores</code>).</li>\n<li>Check and resolve data skew in the stage.</li>\n</ol>", "raw_answer": "**Spill** occurs when an execution operator (like shuffle sort, external aggregate, or join hash table) requires more memory than available in Execution Memory. Spark flushes (spills) the partition data to local worker disk.\n\n**Types in Spark UI:**\n- **Spill (Memory)**: The uncompressed, deserialized size of data in RAM before flushing.\n- **Spill (Disk)**: The compressed, serialized size of data after writing to disk.\n\n**Consequences:**\n- Severe performance penalty: requires disk I/O, serialization, compression, and subsequent disk re-reads.\n\n**Fixes:**\n1. Increase shuffle partitions (`spark.sql.shuffle.partitions` or enable AQE).\n2. Increase executor memory per core (`spark.executor.memory / spark.executor.cores`).\n3. Check and resolve data skew in the stage."}, {"id": 17, "question": "What is `spark.executor.memoryOverhead` and when should you increase it?", "difficulty": "Intermediate", "category": "Memory Management & Tungsten", "answer_html": "<p class=\"prose-p\"><code class=\"inline-code\">spark.executor.memoryOverhead</code> is non-JVM heap memory requested per executor from container resource managers (YARN / Kubernetes).</p>\n<p class=\"prose-p\"><strong>What it accommodates:</strong></p>\n<ul class=\"bullet-list\">\n<li>PySpark Python worker processes (<code class=\"inline-code\">Py4J</code> daemon processes).</li>\n<li>Direct byte buffers used by Netty during shuffle transfers.</li>\n<li>JVM internal overhead (thread stacks, C library memory, native shared libraries).</li>\n</ul>\n<p class=\"prose-p\"><strong>When to Increase:</strong></p>\n<ul class=\"bullet-list\">\n<li>If container gets killed with message: <code class=\"inline-code\">\"Container killed by YARN for exceeding memory limits. 10.4 GB of 10.0 GB physical memory used\"</code>.</li>\n<li>When running heavy Python UDFs or machine learning libraries (NumPy, SciPy) inside PySpark workers.</li>\n<li>Set via: <code class=\"inline-code\">--conf spark.executor.memoryOverhead=2048m</code> (or 15-20% of executor memory).</li>\n</ul>", "raw_answer": "`spark.executor.memoryOverhead` is non-JVM heap memory requested per executor from container resource managers (YARN / Kubernetes).\n\n**What it accommodates:**\n- PySpark Python worker processes (`Py4J` daemon processes).\n- Direct byte buffers used by Netty during shuffle transfers.\n- JVM internal overhead (thread stacks, C library memory, native shared libraries).\n\n**When to Increase:**\n- If container gets killed with message: `\"Container killed by YARN for exceeding memory limits. 10.4 GB of 10.0 GB physical memory used\"`.\n- When running heavy Python UDFs or machine learning libraries (NumPy, SciPy) inside PySpark workers.\n- Set via: `--conf spark.executor.memoryOverhead=2048m` (or 15-20% of executor memory)."}, {"id": 18, "question": "What is PySpark architecture, and how does Python communicate with the JVM?", "difficulty": "Advanced", "category": "Memory Management & Tungsten", "answer_html": "<p class=\"prose-p\">PySpark uses a dual-engine architecture: Python Driver + JVM Driver, and Python Workers + JVM Workers.</p>\n<p class=\"prose-p\"><strong>Communication Mechanism:</strong></p>\n<ol class=\"ordered-list\">\n<li><strong>Py4J Gateway</strong>: On the Driver node, Python code interacts with the JVM SparkContext through a local socket connection provided by <code class=\"inline-code\">Py4J</code>.</li>\n<li><strong>Executor Execution</strong>:</li>\n</ol>\n<ul class=\"bullet-list\">\n<li>For standard DataFrame operations, Spark plans execute 100% inside JVM executors via Tungsten. Python is not involved during execution.</li>\n<li>For custom Python UDFs, JVM executors spawn <strong>Python Worker processes</strong>. Data must be serialized (via Pickle or Arrow), sent over IPC pipes/sockets to Python, transformed, serialized back, and ingested into JVM. This causes high serialization overhead.</li>\n</ul>", "raw_answer": "PySpark uses a dual-engine architecture: Python Driver + JVM Driver, and Python Workers + JVM Workers.\n\n**Communication Mechanism:**\n1. **Py4J Gateway**: On the Driver node, Python code interacts with the JVM SparkContext through a local socket connection provided by `Py4J`.\n2. **Executor Execution**:\n   - For standard DataFrame operations, Spark plans execute 100% inside JVM executors via Tungsten. Python is not involved during execution.\n   - For custom Python UDFs, JVM executors spawn **Python Worker processes**. Data must be serialized (via Pickle or Arrow), sent over IPC pipes/sockets to Python, transformed, serialized back, and ingested into JVM. This causes high serialization overhead."}, {"id": 19, "question": "What is Apache Arrow, and how does PySpark utilize it?", "difficulty": "Intermediate", "category": "Memory Management & Tungsten", "answer_html": "<p class=\"prose-p\"><strong>Apache Arrow</strong> is an in-memory columnar data format that provides zero-copy data sharing between heterogeneous systems (like Python/Pandas and JVM).</p>\n<p class=\"prose-p\"><strong>Usage in PySpark:</strong></p>\n<ul class=\"bullet-list\">\n<li>Used to accelerate conversions between PySpark DataFrames and Pandas DataFrames (<code class=\"inline-code\">toPandas()</code> and <code class=\"inline-code\">createDataFrame()</code>).</li>\n<li>Used to run <strong>Vectorized / Pandas UDFs</strong>, executing Python functions on Arrow record batches rather than row-by-row Python objects.</li>\n<li>Enable via configuration:</li>\n</ul>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\">  spark.conf.set(&quot;spark.sql.execution.arrow.pyspark.enabled&quot;, &quot;true&quot;)</code></pre></div>", "raw_answer": "**Apache Arrow** is an in-memory columnar data format that provides zero-copy data sharing between heterogeneous systems (like Python/Pandas and JVM).\n\n**Usage in PySpark:**\n- Used to accelerate conversions between PySpark DataFrames and Pandas DataFrames (`toPandas()` and `createDataFrame()`).\n- Used to run **Vectorized / Pandas UDFs**, executing Python functions on Arrow record batches rather than row-by-row Python objects.\n- Enable via configuration:\n  ```python\n  spark.conf.set(\"spark.sql.execution.arrow.pyspark.enabled\", \"true\")\n  ```"}, {"id": 20, "question": "What is Dynamic Allocation in Spark, and how does it work?", "difficulty": "Advanced", "category": "Memory Management & Tungsten", "answer_html": "<p class=\"prose-p\"><strong>Dynamic Resource Allocation</strong> allows Spark to dynamically scale executor allocations based on workload demand instead of holding a fixed cluster capacity.</p>\n<p class=\"prose-p\"><strong>Configuration:</strong></p>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">properties</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-properties\">spark.dynamicAllocation.enabled=true\nspark.dynamicAllocation.minExecutors=2\nspark.dynamicAllocation.maxExecutors=50\nspark.dynamicAllocation.executorIdleTimeout=60s\nspark.dynamicAllocation.cachedExecutorIdleTimeout=infinity</code></pre></div>\n<p class=\"prose-p\"><strong>Workflow:</strong></p>\n<ol class=\"ordered-list\">\n<li>If tasks are pending in queue longer than <code class=\"inline-code\">schedulerBacklogTimeout</code> (default 1s), Spark requests additional executors.</li>\n<li>If an executor remains idle longer than <code class=\"inline-code\">executorIdleTimeout</code> (default 60s), Spark deallocates it back to the cluster pool.</li>\n<li>Requires <strong>External Shuffle Service</strong> (or Spark 3.x Shuffle tracking) to preserve shuffle files when executors terminate.</li>\n</ol>", "raw_answer": "**Dynamic Resource Allocation** allows Spark to dynamically scale executor allocations based on workload demand instead of holding a fixed cluster capacity.\n\n**Configuration:**\n```properties\nspark.dynamicAllocation.enabled=true\nspark.dynamicAllocation.minExecutors=2\nspark.dynamicAllocation.maxExecutors=50\nspark.dynamicAllocation.executorIdleTimeout=60s\nspark.dynamicAllocation.cachedExecutorIdleTimeout=infinity\n```\n\n**Workflow:**\n1. If tasks are pending in queue longer than `schedulerBacklogTimeout` (default 1s), Spark requests additional executors.\n2. If an executor remains idle longer than `executorIdleTimeout` (default 60s), Spark deallocates it back to the cluster pool.\n3. Requires **External Shuffle Service** (or Spark 3.x Shuffle tracking) to preserve shuffle files when executors terminate."}, {"id": 21, "question": "What is the difference between `repartition()` and `coalesce()`?", "difficulty": "Intermediate", "category": "Partitioning, Shuffling & Skew", "answer_html": "<p class=\"prose-p\">Both methods change the number of partitions in a DataFrame, but their mechanics differ:</p>\n<div class=\"table-container\"><table class=\"data-table\">\n<thead><tr>\n<th>Characteristic</th>\n<th><code class=\"inline-code\">repartition(n)</code></th>\n<th><code class=\"inline-code\">coalesce(n)</code></th>\n</tr></thead><tbody>\n<tr>\n<td><strong>Shuffle</strong></td>\n<td>Full shuffle across cluster (Wide operation)</td>\n<td>Minimizes/avoids shuffle (combines adjacent partitions)</td>\n</tr>\n<tr>\n<td><strong>Partition count</strong></td>\n<td>Can increase or decrease partition count</td>\n<td>Can <strong>only decrease</strong> partition count</td>\n</tr>\n<tr>\n<td><strong>Data distribution</strong></td>\n<td>Produces evenly distributed partitions</td>\n<td>Can result in uneven partition sizes</td>\n</tr>\n<tr>\n<td><strong>Use case</strong></td>\n<td>Fix data skew; balance partitions before heavy join</td>\n<td>Reduce partitions before writing output files to disk</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"code-terminal\"><div class=\"terminal-bar\"><div class=\"terminal-dots\"><span class=\"dot\"></span><span class=\"dot\"></span><span class=\"dot\"></span></div><span class=\"terminal-lang\">python</span><button class=\"copy-action-btn\" onclick=\"copyCode(this)\" title=\"Copy snippet to clipboard\">Copy</button></div><pre><code class=\"language-python\"># Repartition to 200 partitions with even distribution\ndf_balanced = df.repartition(200)\n\n# Coalesce to 1 single partition for single-file output write\ndf_single_file = df.coalesce(1).write.csv(&quot;output/&quot;)</code></pre></div>", "raw_answer": "Both methods change the number of partitions in a DataFrame, but their mechanics differ:\n\n| Characteristic | `repartition(n)` | `coalesce(n)` |\n| :--- | :--- | :--- |\n| **Shuffle** | Full shuffle across cluster (Wide operation) | Minimizes/avoids shuffle (combines adjacent partitions) |\n| **Partition count** | Can increase or decrease partition count | Can **only decrease** partition count |\n| **Data distribution** | Produces evenly distributed partitions | Can result in uneven partition sizes |\n| **Use case** | Fix data skew; balance partitions before heavy join | Reduce partitions before writing output files to disk |\n\n```python\n# Repartition to 200 partitions with even distribution\ndf_balanced = df.repartition(200)\n\n# Coalesce to 1 single partition for single-file output write\ndf_single_file = df.coalesce(1).write.csv(\"output/\")\n```"}, {"id": 22, "question": "What is a Shuffle in Spark, and why is it expensive?", "difficulty": "Intermediate", "category": "Partitioning, Shuffling & Skew", "answer_html": "<p class=\"prose-p\">A <strong>Shuffle</strong> is the redistribution of data across cluster nodes so that rows with identical keys end up on the same physical partition/executor.</p>\n<p class=\"prose-p\"><strong>Why Shuffle is Expensive:</strong></p>\n<ol class=\"ordered-list\">\n<li><strong>Disk I/O</strong>: Executors write intermediate shuffle files to local disks on the mapper side.</li>\n<li><strong>Network I/O</strong>: Reducer executors fetch shuffle partition blocks over the cluster network.</li>\n<li><strong>Serialization/Deserialization</strong>: Objects must be encoded into bytes before transmission and decoded upon receipt.</li>\n<li><strong>Garbage Collection</strong>: Intermediate buffers create memory pressure on reducers.</li>\n</ol>\n<p class=\"prose-p\"><strong>Trigger Operations</strong>: <code class=\"inline-code\">groupBy()</code>, <code class=\"inline-code\">join()</code>, <code class=\"inline-code\">distinct()</code>, <code class=\"inline-code\">reduceByKey()</code>, <code class=\"inline-code\">repartition()</code>.</p>", "raw_answer": "A **Shuffle** is the redistribution of data across cluster nodes so that rows with identical keys end up on the same physical partition/executor.\n\n**Why Shuffle is Expensive:**\n1. **Disk I/O**: Executors write intermediate shuffle files to local disks on the mapper side.\n2. **Network I/O**: Reducer executors fetch shuffle partition blocks over the cluster network.\n3. **Serialization/Deserialization**: Objects must be encoded into bytes before transmission and decoded upon receipt.\n4. **Garbage Collection**: Intermediate buffers create memory pressure on reducers.\n\n**Trigger Operations**: `groupBy()`, `join()`, `distinct()`, `reduceByKey()`, `repartition()`."}, {"id": 23, "question": "What is Data Skew, how do you spot it in the Spark UI, and how do you resolve it?", "difficulty": "Advanced", "category": "Partitioning, Shuffling & Skew", "answer_html": "<p class=\"prose-p\"><strong>Data Skew</strong> occurs when data is disproportionately distributed across keys, causing one or few partitions to be much larger than others.</p>\n<p class=\"prose-p\"><strong>How to Spot in Spark UI:</strong></p>\n<ul class=\"bullet-list\">\n<li>In the <strong>Stages Tab</strong>, inspect the <strong>Task Metrics Table</strong> (Min, 25th percentile, Median, 75th percentile, Max).</li>\n<li>If 99 tasks complete in 5 seconds (Median = 5s), but 1 single task takes 25 minutes (Max = 25m), the job is suffering from Data Skew.</li>\n</ul>\n<p class=\"prose-p\"><strong>How to Resolve Data Skew:</strong></p>\n<ol class=\"ordered-list\">\n<li><strong>Salting</strong>: Append random integer prefixes (e.g., <code class=\"inline-code\">key_0</code>, <code class=\"inline-code\">key_1</code>, ..., <code class=\"inline-code\">key_k</code>) to skewed keys to spread data across multip
